name: Capability build and unit tests

on:
  push:
    branches: [ "v2026.1" ]
    paths:
      - '2026/*'
      - 'capa-engine/*'
  pull_request:
    branches: [ "v2026.1" ]
  workflow_dispatch: 
    inputs:
      reason:
        description: 'Why are you running this manually?'
        required: false
        default: 'Manual health check'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./capa-engine

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

[package]
name    = "eunomia"
version = "0.1.0"
edition = "2021"

[lib]
name = "eunomia"
path = "src/lib.rs"

[[bin]]
name = "eunomia"
path = "src/main.rs"

[features]
default = ["console-serial", "app-smoke"]
console-serial = []
# Workload selection — enable exactly one app-* feature.
app-smoke = []    # Basic sanity tests (serial, GDT, IDT, stack)
app-timer = []    # Timer interrupt test

[profile.dev]
panic = "abort"

[profile.release]
panic   = "abort"
opt-level = "s"
lto     = true

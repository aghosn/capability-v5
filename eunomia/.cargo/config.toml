[build]
target = "x86_64-unknown-none"

[alias]
# Run workload under QEMU (default): cargo run-qemu
run-qemu = "run --release"
# Run workload under Cloud Hypervisor (PVH boot): cargo run-chv
run-chv = ["run", "--release", "--config", "target.x86_64-unknown-none.runner='../../scripts/run-chv-runner.sh'"]

[target.x86_64-unknown-none]
runner = "qemu-system-x86_64 -M microvm -enable-kvm -cpu host -m 128M -nographic -serial mon:stdio -no-reboot -device isa-debug-exit,iobase=0xf4,iosize=0x04 -kernel"
rustflags = [
    # Bare-metal: no SSE until FPU is explicitly initialised.
    "-C", "target-feature=-sse,-sse2",
    # Static executable (ET_EXEC).  PVH entry needs known physical addresses.
    "-C", "relocation-model=static",
]

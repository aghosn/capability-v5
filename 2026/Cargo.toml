[package]
name = "capability-engine-v2"
version = "0.1.0"
edition = "2021"

[lib]
name = "capability_engine"
path = "src/lib.rs"

[[bin]]
name = "capability-engine-v2"
path = "src/main.rs"

[features]
# Default: hosted OS environment (Linux/macOS/Windows).  Uses parking_lot which
# relies on OS threading primitives (futex, etc.).
# For bare-metal / no_std targets compile with --no-default-features.
default = ["hosted"]
hosted = ["dep:parking_lot"]
loom = ["dep:loom"]

[dependencies]
# Hosted lock: parking_lot (OS-backed, efficient on multi-core hosted platforms).
parking_lot = { version = "0.12", features = ["arc_lock"], optional = true }

# Bare-metal lock: spin (pure-Rust busy-wait, no OS, no libc, no_std compatible).
spin = { version = "0.9", default-features = false, features = ["rwlock"] }

# Deterministic concurrency testing (exhaustive interleaving exploration).
loom = { version = "0.7", optional = true }

[dev-dependencies]
# Tests run on a hosted platform and may import parking_lot directly.
parking_lot = { version = "0.12", features = ["arc_lock"] }
crossbeam = "0.8"


# dom0-versions.conf — Registry of tested dom0 cloud images.
#
# Each version block defines everything scripts need to fetch, boot, and
# configure Limine for that Ubuntu release.  Add new entries as releases
# are validated.
#
# Usage:  source dom0-lib.sh
#         dom0_select "noble"          # or set DOM0_VERSION=noble
#         echo "$DOM0_IMAGE_NAME"      # → ubuntu-24.04-server-cloudimg-amd64.img
#
# Fields (tab/space separated after the tag):
#   VERSION_<nick>_CODENAME    Ubuntu codename (for display / comments)
#   VERSION_<nick>_RELEASE     Ubuntu version number
#   VERSION_<nick>_IMAGE       Filename of the cloud image
#   VERSION_<nick>_URL         Full download URL
#   VERSION_<nick>_KERNEL      Limine module_path for vmlinuz
#   VERSION_<nick>_INITRD      Limine module_path for initrd.img
#   VERSION_<nick>_NOTES       One-line notes (quirks, caveats)

# ── Default version ──────────────────────────────────────────────────────── #
DOM0_DEFAULT_VERSION="noble"

# ── Tested versions ──────────────────────────────────────────────────────── #

# Jammy 22.04 LTS — kernel 5.15, single root partition holds /boot
VERSION_jammy_CODENAME="jammy"
VERSION_jammy_RELEASE="22.04"
VERSION_jammy_IMAGE="jammy-server-cloudimg-amd64.img"
VERSION_jammy_URL="https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img"
VERSION_jammy_KERNEL="fslabel(cloudimg-rootfs):/boot/vmlinuz"
VERSION_jammy_INITRD="fslabel(cloudimg-rootfs):/boot/initrd.img"
VERSION_jammy_NOTES="Single rootfs; kernel lives at /boot on cloudimg-rootfs"

# Noble 24.04 LTS — kernel 6.8, separate BOOT partition (LABEL=BOOT)
VERSION_noble_CODENAME="noble"
VERSION_noble_RELEASE="24.04"
VERSION_noble_IMAGE="ubuntu-24.04-server-cloudimg-amd64.img"
VERSION_noble_URL="https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-amd64.img"
VERSION_noble_KERNEL="fslabel(BOOT):/vmlinuz"
VERSION_noble_INITRD="fslabel(BOOT):/initrd.img"
VERSION_noble_NOTES="Separate BOOT partition; requires sync_ia32e_mode_guest fix for 6.8 trampoline"

[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    # Soft-float ABI: disable SSE/SSE2 until the FPU is initialised in early boot.
    # (-mmx omitted — not a recognised LLVM target feature on x86-64 toolchains)
    "-C", "target-feature=-sse,-sse2",
    # Produce a static executable (ET_EXEC) instead of PIE (ET_DYN).
    # Limine expects either ET_EXEC or ET_DYN with PT_DYNAMIC; the Rust
    # default PIE for x86_64-unknown-none produces ET_DYN without PT_DYNAMIC
    # which Limine rejects.
    "-C", "relocation-model=static",
    # Force curve25519-dalek to use the pure-Rust fiat backend.  The auto-
    # detected SIMD backend emits AVX2/SSE ops that LLVM can't lower with
    # -sse,-sse2.  CARGO_CFG_CURVE25519_DALEK_BACKEND is read by the crate's
    # build.rs from --cfg flags.
    "--cfg", "curve25519_dalek_backend=\"fiat\"",
]

[alias]
# cargo iso / qemu / debug / fetch-dom0 dispatch through xtask/src/main.rs
# which runs the corresponding scripts/<task>.sh on the host.
# All environment knobs (QEMU_MEM, PROFILE, FORCE, …) are forwarded.
#
# --manifest-path keeps xtask out of the bare-metal workspace.
# --target x86_64-unknown-linux-gnu overrides the workspace default target
# (x86_64-unknown-none) so xtask links against std on the host.
iso           = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "build-iso"]
themis        = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "run-qemu"]
themis-debug  = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "themis-debug"]
gdb           = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "gdb"]
fetch-dom0    = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "fetch-dom0"]
fetch-dom1    = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "fetch-dom1"]
dom0          = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "run-dom0"]
setup-limine  = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "setup-limine"]
resize-disk   = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "resize-disk"]

# AArch64 (cross-build + QEMU emulation)
aarch64-iso    = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "aarch64-iso"]
aarch64-themis = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "aarch64-themis"]
aarch64-direct = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "aarch64-direct"]
fetch-aarch64-kernel = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "fetch-aarch64-kernel"]
fetch-aarch64-dom0   = ["run", "--manifest-path", "xtask/Cargo.toml", "--target", "x86_64-unknown-linux-gnu", "--", "fetch-aarch64-dom0"]

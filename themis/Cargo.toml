[workspace]
members = [
    "capavisor",
    "crates/vtd",
    "crates/themis-abi",
    "crates/ept",
    "crates/capavisor-pt",
    "crates/vmx",
    "crates/libthemis",
]
# xtask is a host-side build helper; keep it OUT of the bare-metal workspace
# so that plain `cargo check/build` does not try to compile it for x86_64-unknown-none.
# It has its own mini-workspace at xtask/Cargo.toml and is invoked explicitly via aliases.
exclude = ["xtask"]
resolver = "2"

# Shared dependency versions for all workspace members.
[workspace.dependencies]
capa-engine = { path = "../capa-engine", default-features = false, features = ["address_translation"] }

x86                    = { version = "0.52",  default-features = false }
x2apic                 = { version = "0.5",   default-features = false }
acpi                   = { version = "6",     default-features = false, features = ["alloc", "aml"] }
pci_types              = { version = "0.10",  default-features = false }
spin                   = { version = "0.10",  default-features = false, features = ["mutex", "spin_mutex", "rwlock"] }
limine                 = { version = "0.5",   default-features = false }
linked_list_allocator  = { version = "0.10",  default-features = false, features = ["use_spin"] }
bitflags               = { version = "2",     default-features = false }

# Workspace-internal crates
vtd          = { path = "crates/vtd" }
themis-abi   = { path = "crates/themis-abi" }
ept          = { path = "crates/ept" }
capavisor-pt = { path = "crates/capavisor-pt" }
vmx          = { path = "crates/vmx" }
libthemis    = { path = "crates/libthemis" }

# Profiles must be defined at the workspace root (non-root package profiles are ignored).
# No unwinding on bare metal — panic = abort everywhere.
[profile.dev]
panic     = "abort"
opt-level = 1

[profile.release]
panic          = "abort"
opt-level      = 3
lto            = true
codegen-units  = 1
strip          = false   # keep symbols for GDB

[package]
name    = "capavisor"
version = "0.1.0"
edition = "2021"

[[bin]]
name              = "capavisor"
path              = "src/main.rs"
# build.rs emits the absolute path to linker.ld so cargo always finds it.

[features]
# Enable verbose per-VMEXIT / SWITCH / CHILD_EXIT serial tracing.
verbose = []
# Force-disable posted interrupts even when hardware supports them.
# Uses the software PIR→VMENTRY_INTR_INFO drain fallback in do_switch.
no-posted-interrupts = []
# Defer parent-bound interrupts during child execution to guarantee a
# minimum execution quantum on nested-virt platforms where VMRESUME
# overhead is high (~100µs).  Should NOT be enabled on bare-metal.
quantum-sched = []

[dependencies]
capa-engine  = { workspace = true }
x86                   = { workspace = true }
x2apic                = { workspace = true }
acpi                  = { workspace = true }
pci_types             = { workspace = true }
spin                  = { workspace = true }
limine                = { workspace = true }
linked_list_allocator = { workspace = true }

vtd          = { workspace = true }
tpm2         = { workspace = true }
themis-abi   = { workspace = true }
ept          = { workspace = true }
capavisor-pt = { workspace = true }
vmx          = { workspace = true }

ed25519-dalek = { workspace = true }
sha2          = { workspace = true }
zeroize       = { workspace = true }

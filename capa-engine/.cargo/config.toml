[alias]
# Run tarpaulin and print coverage summary + generate lcov report.
# Usage: cargo coverage
# Output: lcov report at target/tarpaulin/lcov.info, summary printed to stdout.
coverage = "tarpaulin --lib --tests --out Lcov --output-dir target/tarpaulin --no-fail-fast"

# Run all loom concurrency tests (exhaustive interleaving exploration).
# Usage: cargo loom
loom = "test --features loom,address_translation --release --test loom_concurrency --test loom_e2e --test loom_vp_switch --test loom_meta --test loom_translation"

[package]
name = "capability-cli"
version = "0.1.0"
edition = "2024"

[features]
default = []
lean-backend = ["dep:serde_json", "dep:cc"]

[dependencies]
capability_engine = { package = "capa-engine", path = "../capa-engine", features = ["address_translation"] }
crossterm = "0.28"
parking_lot = { version = "0.12", features = ["arc_lock"] }
rustyline = "14.0"
colored = "2.1"
serde_json = { version = "1", optional = true }

[build-dependencies]
cc = { version = "1", optional = true }

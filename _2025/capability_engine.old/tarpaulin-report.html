emapped(args[3] as u64)\n                };\n                ClientResult::wrap_empty(self.server.send(\n                    self.current.clone(),\n                    args[0] as LocalCapa,\n                    args[1] as LocalCapa,\n                    remap,\n                    Attributes::from_bits_truncate(args[4] as u8),\n                ))\n            }\n            CallInterface::ALIAS =\u003e {\n                let access = Access::new(\n                    args[1] as u64,\n                    args[2] as u64,\n                    Rights::from_bits_truncate(args[3] as u8),\n                );\n                ClientResult::wrap_value(self.server.alias(\n                    self.current.clone(),\n                    args[0] as LocalCapa,\n                    \u0026access,\n                ))\n            }\n            CallInterface::CARVE =\u003e {\n                let access = Access::new(\n                    args[1] as u64,\n                    args[2] as u64,\n                    Rights::from_bits_truncate(args[3] as u8),\n                );\n                ClientResult::wrap_value(self.server.carve(\n                    self.current.clone(),\n                    args[0] as LocalCapa,\n                    \u0026access,\n                ))\n            }\n            CallInterface::CREATE =\u003e ClientResult::wrap_value(self.server.create(\n                \u0026self.current.clone(),\n                args[0],\n                MonitorAPI::from_bits_truncate(args[1] as u16),\n                \u0026InterruptPolicy::default_none(),\n            )),\n            CallInterface::ATTEST =\u003e {\n                let other = if args[0] != 0 {\n                    Some(args[0] as LocalCapa)\n                } else {\n                    None\n                };\n                ClientResult::wrap_string(self.server.attest(self.current.clone(), other))\n            }\n            CallInterface::SWITCH =\u003e {\n                todo!()\n            }\n            CallInterface::REVOKE =\u003e ClientResult::wrap_empty(self.server.revoke(\n                self.current.clone(),\n                args[0] as LocalCapa,\n                args[1],\n            )),\n            CallInterface::ENUMERATE =\u003e ClientResult::wrap_string(\n                self.server\n                    .enumerate(self.current.clone(), args[0] as LocalCapa),\n            ),\n        }\n    }\n\n    // This is local, we do not care about the receive.\n    fn receive(\n        \u0026mut self,\n        call: crate::CallInterface,\n        args: \u0026[u64; 6],\n    ) -\u003e Result\u003cClientResult, ClientError\u003e {\n        self.send(call, args)\n    }\n}\n","traces":[{"line":26,"address":[522022,522028,521360],"length":1,"stats":{"Line":7}},{"line":27,"address":[831502],"length":1,"stats":{"Line":7}},{"line":29,"address":[521525,521413],"length":1,"stats":{"Line":7}},{"line":30,"address":[521513],"length":1,"stats":{"Line":7}},{"line":31,"address":[521551],"length":1,"stats":{"Line":7}},{"line":33,"address":[521698],"length":1,"stats":{"Line":7}},{"line":34,"address":[521816],"length":1,"stats":{"Line":7}},{"line":35,"address":[521871],"length":1,"stats":{"Line":7}},{"line":42,"address":[523125,523131,522048],"length":1,"stats":{"Line":3}},{"line":48,"address":[522112],"length":1,"stats":{"Line":3}},{"line":50,"address":[522253,523152],"length":1,"stats":{"Line":1}},{"line":51,"address":[833536,833634],"length":1,"stats":{"Line":4}},{"line":52,"address":[523212],"length":1,"stats":{"Line":2}},{"line":53,"address":[523245],"length":1,"stats":{"Line":2}},{"line":54,"address":[523261],"length":1,"stats":{"Line":2}},{"line":56,"address":[523278],"length":1,"stats":{"Line":2}},{"line":57,"address":[523325],"length":1,"stats":{"Line":2}},{"line":61,"address":[523462,522353],"length":1,"stats":{"Line":1}},{"line":62,"address":[523614,523708],"length":1,"stats":{"Line":2}},{"line":63,"address":[523522],"length":1,"stats":{"Line":1}},{"line":64,"address":[ ealed,\n    DomainSealed,\n    InsufficientRights,\n    InvalidChildCapa,\n    CapaNotOwned,\n    RevokeOnRootCapa,\n    DoubleRemapping,\n    IncompatibleRemap,\n    InvalidField,\n    InvalidValue,\n    // For parsing\n    ParserDomain,\n    ParserRegion,\n    ParserStatus,\n    ParserMonitor,\n    ParserCapability,\n    // Platform related issues\n    PlatformState,\n}\n\n/// Have to implement it by hand because Weak does not support PartialEq\nimpl\u003cT: PartialEq\u003e PartialEq for Capability\u003cT\u003e {\n    fn eq(\u0026self, other: \u0026Self) -\u003e bool {\n        Weak::ptr_eq(\u0026self.owned.owner, \u0026other.owned.owner)\n            \u0026\u0026 self.data == other.data\n            \u0026\u0026 self.children == other.children\n    }\n}\n\nimpl\u003cT\u003e Capability\u003cT\u003e\nwhere\n    T: PartialEq,\n{\n    pub fn add_child(\u0026mut self, child: CapaRef\u003cT\u003e, owner: WeakRef\u003cDomain\u003e) {\n        {\n            child.borrow_mut().owned = Ownership::new(owner, 0);\n        }\n        self.children.push(child)\n    }\n\n    pub fn revoke_node\u003cF\u003e(node: CapaRef\u003cT\u003e, on_revoke: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        let parent = {\n            let borrowed = node.borrow();\n            borrowed\n                .parent\n                .upgrade()\n                .ok_or(CapaError::RevokeOnRootCapa)?\n        };\n\n        parent.borrow_mut().revoke_child(\u0026node, on_revoke)?;\n        Ok(())\n    }\n\n    pub fn revoke_child\u003cF\u003e(\n        \u0026mut self,\n        child: \u0026CapaRef\u003cT\u003e,\n        on_revoke: \u0026mut F,\n    ) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        if let Some(pos) = self.children.iter().position(|c| Rc::ptr_eq(c, child)) {\n            // Safely remove the child and pass it for revocation\n            let child = self.children.remove(pos);\n            // Remove the backward edge to the parent.\n            child.borrow_mut().parent = WeakRef::new();\n            child.borrow_mut().revoke_all(on_revoke)?;\n            Ok(())\n        } else {\n            Err(CapaError::ChildNotFound)\n        }\n    }\n\n    pub fn revoke_all\u003cF\u003e(\u0026mut self, on_revoke: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for c in \u0026self.children {\n            let child = \u0026mut c.borrow_mut();\n            child.parent = WeakRef::new();\n            child.revoke_all(on_revoke)?;\n        }\n        self.children = Vec::new();\n        // Remove the node from its parent.\n        on_revoke(self)\n    }\n\n    pub fn dfs\u003cF\u003e(\u0026self, visit: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        visit(self)?;\n        for c in \u0026self.children {\n            c.borrow().dfs(visit)?;\n        }\n        Ok(())\n    }\n}\n\n// ———————————————————— Region Capability implementation ———————————————————— //\nimpl Capability\u003cMemoryRegion\u003e {\n    pub fn new(region: MemoryRegion) -\u003e Self {\n        Capability::\u003cMemoryRegion\u003e {\n            owned: Ownership::empty(),\n            data: region,\n            parent: WeakRef::new(),\n            children: Vec::new(),\n        }\n    }\n\n    pub fn alias(\u0026mut self, access: \u0026Access) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        self.alias_carve_logic(access, RegionKind::Alias)\n    }\n\n    pub fn carve(\u0026mut self, access: \u0026Access) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        self.alias_carve_logic(access, RegionKind::Carve)\n    }\n\n    pub fn alias_carve_logic(\n        \u0026mut self,\n        access: \u0026Access,\n        kind_op: RegionKind,\n    ) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        //TODO: bug should not be able to carve an aliased region.\n        if !self.contained(access, kind_op == RegionKind::Carve) {\n            return Err(CapaError::InvalidAccess);\n        }\n        // Compute the remapping\n        let remapping = match self.data.remapped {\n            Remapped::Identity =\u003e Remapped::Identity,\n            Remapped::Remapped(s) =\u003e {\n                Remapped::Remapped(s + (access.start - self.data.access.start))\n            }\n        };\n        // Compute the status: alias -\u003e aliased, carve inherit\n        let status_obtained = if kind_op == RegionKind::Alias {\n            Status::Aliased\n        } else {\n            self.data.status\n        };\n        // Create the region\n        let region = MemoryRegion {\n            kind: kind_op,\n            status: status_obtained,\n            access: *access,\n            // A new region has no attributes.\n            attributes: Attributes::NONE,\n            remapped: remapping,\n        };\n        let new_capa = Self::new(region);\n        let reference = Rc::new(RefCell::new(new_capa));\n        self.add_child(reference.clone(), Weak::new());\n        Ok(reference)\n    }\n\n    pub fn view(\u0026self) -\u003e Vec\u003cViewRegion\u003e {\n        let mut views = Vec::new();\n        // This is the range we consider.\n        let mut start = self.data.access.start;\n\n        // Constants.\n        let base = self.data.access.start;\n\n        // Children are sorted.\n        let mut sorted = self.children.clone();\n        sorted.sort_by(|a, b| {\n            a.borrow()\n                .data\n                .access\n                .start\n                .cmp(\u0026b.borrow().data.access.start)\n        });\n        for c in sorted {\n            let c_borrow = c.borrow();\n            // We do not care\n            if c_borrow.data.kind == RegionKind::Alias {\n                continue;\n            }\n            // It is a carve, the segment loses access.\n            if start \u003c= c_borrow.data.access.start {\n                let r = match self.data.remapped {\n                    Remapped::Identity =\u003e Remapped::Identity,\n                    Remapped::Remapped(x) =\u003e Remapped::Remapped(x + (start - base)),\n                };\n                if c_borrow.data.access.start != start {\n                    views.push(ViewRegion {\n                        access: Access {\n                            start,\n                            size: (c_borrow.data.access.start - start),\n                            rights: self.data.access.rights,\n                        },\n                        remap: r,\n                    });\n                }\n                start = c_borrow.data.access.end();\n            }\n        }\n        if start \u003c self.data.access.end() {\n            let r = match self.data.remapped {\n                Remapped::Identity =\u003e Remapped::Identity,\n                Remapped::Remapped(x) =\u003e Remapped::Remapped(x + (start - base)),\n            };\n            views.push(ViewRegion {\n                access: Access {\n                    start,\n                    size: self.data.access.end() - start,\n                    rights: self.data.access.rights,\n                },\n                remap: r,\n            });\n        }\n\n        views\n    }\n\n    // Does not remove the carved.\n    // This is used to check for compatible sends.\n    pub fn view_raw(\u0026self) -\u003e Vec\u003cViewRegion\u003e {\n        vec![ViewRegion::new(self.data.access, self.data.remapped)]\n    }\n\n    pub fn contained(\u0026self, access: \u0026Access, strict: bool) -\u003e bool {\n        // Easy case, it's not even contained without considering children.\n        if !access.contained(\u0026self.data.access) {\n            return false;\n        }\n        // Now see if it's carved.\n        let children = \u0026self.children;\n        for c in children {\n            if !strict \u0026\u0026 c.borrow().data.kind == RegionKind::Alias {\n                continue;\n            }\n            if c.borrow().data.access.intersect(access) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    // We should implement two on_revoke.\n    // One will do the dfs, the other will consider local changes\n    pub fn on_revoke(\u0026self, operation: \u0026mut OperationUpdate) -\u003e Result\u003c(), CapaError\u003e {\n        // Simple per node visit to collect attributes.\n        let mut visit = |capa: \u0026Capability\u003cMemoryRegion\u003e| -\u003e Result\u003c(), CapaError\u003e {\n            // This algorithm is a bit complicated so here is the explanation.\n            // we go top to bottom dfs style, so technically if the parent was visited,\n            // we do not need to do a reenable in the case of a carve.\n            // In the case of an alias, it will be merged within the updates for the domain\n            // as they are subsets of each other.\n            if capa.data.attributes.contains(Attributes::VITAL) {\n                operation.add(Update::Revoke {\n                    dom: capa.owned.owner.clone(),\n                });\n            }\n            if capa.data.attributes.contains(Attributes::CLEAN) {\n                operation.add(Update::Clean {\n                    start: capa.data.access.start,\n                    size: capa.data.access.size,\n                });\n            }\n            // We lose this access.\n            operation.add(Update::ChangeMemory {\n                dom: capa.owned.owner.clone(),\n            });\n\n            // For a carve the parent is affected as well.\n            if capa.data.kind == RegionKind::Carve {\n                if let Some(parent) = capa.parent.upgrade() {\n                    operation.add(Update::ChangeMemory {\n                        dom: parent.borrow().owned.owner.clone(),\n                    });\n                } else {\n                    return Err(CapaError::InvalidValue);\n                }\n            }\n            Ok(())\n        };\n\n        // Now go through the nodes.\n        self.dfs(\u0026mut visit)\n    }\n}\n\n// ———————————————————— Domain Capability implementation ———————————————————— //\n\nimpl Capability\u003cDomain\u003e {\n    pub fn new(domain: Domain) -\u003e Self {\n        Capability::\u003cDomain\u003e {\n            owned: Ownership::empty(),\n            data: domain,\n            parent: WeakRef::new(),\n            children: Vec::new(),\n        }\n    }\n\n    // Set on self.\n    pub fn set(\n        \u0026mut self,\n        _core: u64,\n        tpe: FieldType,\n        field: Field,\n        value: u64,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e {\n                return Err(CapaError::PlatformState);\n            }\n            _ =\u003e {\n                if self.data.is_sealed() {\n                    return Err(CapaError::DomainSealed);\n                }\n\n                self.data.set_policy(tpe, field, value)?;\n            }\n        }\n        Ok(())\n    }\n\n    // Get on self.\n    pub fn get(\u0026self, _core: u64, tpe: FieldType, field: Field) -\u003e Result\u003cu64, CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::PlatformState),\n            _ =\u003e self.data.get_policy(tpe, field),\n        }\n    }\n\n    pub fn seal(\u0026self, child: LocalCapa) -\u003e Result\u003c(), CapaError\u003e {\n        if !self.data.operation_allowed(MonitorAPI::SEAL) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        if !self.data.is_domain(child)? {\n            return Err(CapaError::WrongCapaType);\n        }\n        let domain = self.data.capabilities.get(\u0026child)?.as_domain()?;\n\n        if domain.borrow().data.is_sealed() {\n            return Err(CapaError::DomainSealed);\n        }\n        domain.borrow_mut().data.status = DStatus::Sealed;\n\n        //TODO: should we generate anything now?\n\n        Ok(())\n    }\n\n    pub fn attest(\u0026self, child: LocalCapa) -\u003e Result\u003cString, CapaError\u003e {\n        if !self.data.operation_allowed(MonitorAPI::ATTEST) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        if !self.data.is_domain(child)? {\n            return Err(CapaError::WrongCapaType);\n        }\n        let child = self.data.capabilities.get(\u0026child)?.as_domain()?;\n        let attestation = format!(\"{}\", child.borrow());\n        return Ok(attestation);\n    }\n\n    pub fn coalesce_view_regions(regions: \u0026mut Vec\u003cViewRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let mut curr: usize = 0;\n        while curr \u003c regions.len() {\n            let next = ViewRegion::merge_at(curr, regions)?;\n            curr = next;\n        }\n        Ok(())\n    }\n\n    pub fn view(\u0026self) -\u003e Result\u003cVec\u003cViewRegion\u003e, CapaError\u003e {\n        let mut regions: Vec\u003cViewRegion\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, c)| match c {\n                CapaWrapper::Region(r) =\u003e Some(r.borrow().view()),\n                _ =\u003e None,\n            })\n            .flatten()\n            .collect();\n\n        // Now we need to sort and coalesce.\n        regions.sort_by_key(|c| c.access.start);\n\n        // Now go through it and merge.\n        Self::coalesce_view_regions(\u0026mut regions)?;\n\n        Ok(regions)\n    }\n\n    pub fn gva_view_raw(\u0026self) -\u003e Result\u003cVec\u003cViewRegion\u003e, CapaError\u003e {\n        let mut regions: Vec\u003cViewRegion\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, c)| match c {\n                CapaWrapper::Region(r) =\u003e Some(r.borrow().view_raw()),\n                _ =\u003e None,\n            })\n            .flatten()\n            .collect();\n        regions.sort_by(|a, b| a.active_start().cmp(\u0026b.active_start()));\n        Ok(regions)\n    }\n\n    pub fn check_conflict(\u0026self, view: \u0026ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        // Ensure there is no ambiguity when we map a gva.\n        let effective = self.gva_view_raw()?;\n        for r in effective.iter() {\n            // Check that they are mapping to the same thing.\n            if !r.compatible(view) {\n                return Err(CapaError::IncompatibleRemap);\n            }\n        }\n        Ok(())\n    }\n\n    pub fn on_revoke_child(\n        \u0026self,\n        child: \u0026CapaRef\u003cDomain\u003e,\n        updates: \u0026mut OperationUpdate,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        // Add the child to the revoke.\n        updates.add(Update::Revoke {\n            dom: Rc::downgrade(child),\n        });\n        let mut visit = |capa: \u0026Capability\u003cDomain\u003e| -\u003e Result\u003c(), CapaError\u003e {\n            // The capa should have been marked for removal already.\n            for c in \u0026capa.children {\n                updates.add(Update::Revoke {\n                    dom: Rc::downgrade(c),\n                });\n            }\n            // Now go through the domain's regions.\n            capa.data\n                .capabilities\n                .foreach_region(\u0026mut |c: \u0026CapaRef\u003cMemoryRegion\u003e| c.borrow().on_revoke(updates))\n        };\n\n        // We go through the child.\n        child.borrow().dfs(\u0026mut visit)\n    }\n}\n","traces":[{"line":23,"address":[1134352],"length":1,"stats u003e) -\u003e Result\u003cSelf, CapaError\u003e {\n        Self::coalesce(\u0026mut regions)?;\n        Ok(CoalescedView { regions })\n    }\n\n    pub fn coalesce(regions: \u0026mut Vec\u003cViewRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        regions.sort_by_key(|c| c.access.start);\n        let mut curr: usize = 0;\n        while curr \u003c regions.len() {\n            let next = ViewRegion::merge_at(curr, regions)?;\n            curr = next;\n        }\n        Ok(())\n    }\n\n    // Add a single ViewRegion\n\n    pub fn add(\u0026mut self, region: ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        self.regions.push(region);\n        Self::coalesce(\u0026mut self.regions)\n    }\n\n    pub fn sub(\u0026mut self, region: \u0026ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        let mut idx: usize = 0;\n        while idx \u003c self.regions.len() {\n            if !self.regions[idx].intersect_remap(\u0026region) {\n                continue;\n            }\n\n            // We have an overlap.\n            let current = \u0026mut self.regions[idx];\n\n            // Check compatibility now.\n            if !current.compatible(region) {\n                return Err(CapaError::IncompatibleRemap);\n            }\n\n            if region.contains_remap(current) {\n                // Easy case, fully contained including access rights.\n                self.regions.remove(idx);\n                continue;\n            }\n            // Less easy, fully contained but not access rights.\n            if region.active_start() \u003c= current.active_start()\n                \u0026\u0026 current.active_end() \u003c= region.active_end()\n            {\n                current.access.rights.remove(region.access.rights);\n                idx += 1;\n                continue;\n            }\n            // Worst scenario is if we have split.\n            let mut replace: Vec\u003cViewRegion\u003e = Vec::new();\n            let mut rights = current.access.rights;\n            rights.remove(region.access.rights);\n\n            // left.\n            if region.active_start() \u003e current.active_start() {\n                let left = ViewRegion::new(\n                    Access::new(\n                        current.access.start,\n                        region.access.start - current.access.start,\n                        current.access.rights,\n                    ),\n                    current.remap,\n                );\n                replace.push(left);\n            };\n\n            // Middle\n            if !rights.is_empty() {\n                let start = u64::max(current.access.start, region.access.start);\n                let end = u64::min(current.access.end(), region.access.end());\n                let m = ViewRegion::new(\n                    Access::new(start, end - start, rights),\n                    current.remap.shift(start - current.access.start),\n                );\n                replace.push(m);\n            }\n\n            // Right\n            if region.active_end() \u003c current.active_end() {\n                let r = ViewRegion::new(\n                    Access::new(\n                        region.access.end(),\n                        current.access.end() - region.access.end(),\n                        current.access.rights,\n                    ),\n                    current\n                        .remap\n                        .shift(region.access.end() - current.access.start),\n                );\n                replace.push(r);\n            }\n            // Add the regions now.\n            self.regions.remove(idx);\n            for c in replace.iter() {\n                self.regions.insert(idx, *c);\n                idx += 1;\n            }\n        }\n        Ok(())\n    }\n}\n","traces":[{"line":12,"address":[1074960],"length":1,"stats":{"Line":1}},{"line":13,"address":[1008893],"length":1,"stats":{"Line":1}},{"line":16,"address":[1058720,1059001],"length":1,"s u003cT\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        full: bool,\n    ) -\u003e fmt::Result;\n}\n\nimpl fmt::Display for Rights {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        if self.contains(Rights::READ) {\n            write!(f, \"R\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        if self.contains(Rights::WRITE) {\n            write!(f, \"W\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        if self.contains(Rights::EXECUTE) {\n            write!(f, \"X\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Remapped {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        match *self {\n            Remapped::Identity =\u003e write!(f, \"Identity\")?,\n            Remapped::Remapped(x) =\u003e write!(f, \"Remapped({:#x})\", x)?,\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Access {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(\n            f,\n            \"{:#x} {:#x} with {}\",\n            self.start,\n            self.end(),\n            self.rights,\n        )\n    }\n}\n\nimpl fmt::Display for Attributes {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        if self.contains(Attributes::HASH) {\n            write!(f, \"H\")?;\n        }\n        if self.contains(Attributes::CLEAN) {\n            write!(f, \"C\")?;\n        }\n        if self.contains(Attributes::VITAL) {\n            write!(f, \"V\")?;\n        }\n        Ok(())\n    }\n}\n\nimpl PrintWithNames\u003cMemoryRegion\u003e for Capability\u003cMemoryRegion\u003e {\n    fn fmt_with_names(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names: \u0026mut HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        full: bool,\n    ) -\u003e fmt::Result {\n        let region = \u0026self.data;\n\n        // Print the main region\n        write!(\n            f,\n            \"{:?} {} mapped {}\",\n            region.status, region.access, region.remapped\n        )?;\n        // Print the attributes is any\n        if !region.attributes.is_empty() {\n            write!(f, \" {}\", region.attributes)?;\n        }\n\n        // Skip over the children.\n        if !full {\n            return Ok(());\n        }\n        // Print children recursively\n        if !self.children.is_empty() {\n            for (_, child) in self.children.iter().enumerate() {\n                let name = if names.contains_key(\u0026CapaKey(child.clone())) {\n                    *names.get(\u0026CapaKey(child.clone())).unwrap()\n                } else {\n                    // Generate a new name.\n                    let name = *next_id;\n                    *next_id += 1;\n                    names.insert(CapaKey(child.clone()), name);\n                    name\n                };\n                let child_borrowed = child.borrow();\n                write!(\n                    f,\n                    \"\\n| {:?} at {} for {}{}\",\n                    child_borrowed.data.kind, child_borrowed.data.access, prefix, name\n                )?;\n            }\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Capability\u003cMemoryRegion\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        let mut next_id = 0;\n        let prefix: String = String::from(\".\");\n        let mut names: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e = HashMap::new();\n        self.fmt_with_names(f, \u0026mut names, prefix, \u0026mut next_id, true)\n    }\n}\n\nimpl fmt::Display for ViewRegion {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"{} mapped {}\", self.access, self.remap)\n    }\n}\n\nimpl Capability\u003cDomain\u003e {\n    pub fn print_header(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names_td: \u0026mut HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e,\n        next_td: \u0026mut usize,\n        names_regions: \u0026mut HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e,\n        next_region: \u0026mut usize,\n    ) -\u003e fmt::Result {\n        write!(f, \"{:?} domain(\", self.data.status)?;\n        let mut as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        as_sorted_vector.sort_by_key(|(id, _)| *id);\n        let mut regions: Vec\u003c_\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, x)| match x {\n                CapaWrapper::Region(r) =\u003e {\n                    if !names_regions.contains_key(\u0026CapaKey(r.clone())) {\n                        names_regions.insert(CapaKey(r.clone()), *next_region);\n                        *next_region += 1;\n                    }\n                    Some(r)\n                }\n                _ =\u003e None,\n            })\n            .collect();\n        regions.sort_by_key(|c| *names_regions.get(\u0026CapaKey((*c).clone())).unwrap());\n\n        // Now build strings from those\n        self.fmt_with_names(f, names_td, String::from(\"td\"), next_td, true)?;\n\n        if as_sorted_vector.len() != 0\n            \u0026\u0026 as_sorted_vector.len() != regions.len()\n            \u0026\u0026 regions.len() != 0\n        {\n            write!(f, \",\")?;\n        }\n        // Print the regions.\n        let mut region_print: Vec\u003cString\u003e = Vec::new();\n        for r in regions {\n            let r_name = names_regions.get(\u0026CapaKey(r.clone())).unwrap();\n            region_print.push(format!(\"r{}\", r_name));\n        }\n        writeln!(f, \"{})\", region_print.join(\",\"))?;\n        // Print policies\n        write!(f, \"{}\", self.data.policies)\n    }\n}\n\nimpl PrintWithNames\u003cDomain\u003e for Capability\u003cDomain\u003e {\n    fn fmt_with_names(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names: \u0026mut HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        _full: bool,\n    ) -\u003e fmt::Result {\n        let as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        let tds: Vec\u003c_\u003e = as_sorted_vector\n            .iter()\n            .filter(|(_, x)| matches!(x, CapaWrapper::Domain(_)))\n            .collect();\n\n        // Insert names for the \"tds\" domains into the HashMap\n        for (_, wrapper) in \u0026tds {\n            if let CapaWrapper::Domain(ref d) = wrapper {\n                // Only insert if the key does not exist\n                if !names.contains_key(\u0026CapaKey(d.clone())) {\n                    names.insert(CapaKey(d.clone()), *next_id);\n                    *next_id += 1;\n                }\n            }\n        }\n\n        // Now build strings only for the domains that are in `names`\n        let tds_display: Vec\u003cString\u003e = tds\n            .iter()\n            .filter_map(|(_, wrapper)| {\n                if let CapaWrapper::Domain(ref d) = wrapper {\n                    // Get the name from `names` based on the domain\n                    let name = names.get(\u0026CapaKey(d.clone())).unwrap();\n                    Some(format!(\"{}{}\", prefix, *name))\n                } else {\n                    None\n                }\n            })\n            .collect();\n\n        // Print the names\n        write!(f, \"{}\", tds_display.join(\",\"))\n    }\n}\n\nimpl fmt::Display for Capability\u003cDomain\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"td0 = \")?;\n        let mut as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        let mut names_region: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e = HashMap::new();\n        let mut names_td: HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e = HashMap::new();\n        as_sorted_vector.sort_by_key(|(id, _)| *id);\n        // Assign names to domain capabilities\n        let mut next_td: usize = 1;\n        let mut next_region: usize = 0;\n\n        // Keep actual capabilities separate\n        let mut tds: Vec\u003c_\u003e = self.children.iter().collect();\n\n        let mut regions: Vec\u003c_\u003e = as_sorted_vector\n            .iter()\n            .filter_map(|(_, x)| match x {\n                CapaWrapper::Region(r) =\u003e {\n                    // Let generate names now.\n                    names_region.insert(CapaKey(r.clone()), next_region);\n                    next_region += 1;\n                    Some(r)\n                }\n                _ =\u003e None,\n            })\n            .collect();\n\n        // Sort the regions by name.\n        regions.sort_by_key(|c| names_region.get(\u0026CapaKey((*c).clone())).unwrap());\n\n        // Give names to children regions first.\n        for r in \u0026regions {\n            let reg = \u0026r.borrow();\n            for c in \u0026reg.children {\n                if !names_region.contains_key(\u0026CapaKey(c.clone())) {\n                    names_region.insert(CapaKey(c.clone()), next_region);\n                    next_region += 1;\n                }\n            }\n        }\n\n        // Now we can go through the header of the current capa.\n        self.print_header(\n            f,\n            \u0026mut names_td,\n            \u0026mut next_td,\n            \u0026mut names_region,\n            \u0026mut next_region,\n        )?;\n\n        tds.sort_by_key(|td| {\n            if !names_td.contains_key(\u0026CapaKey((*td).clone())) {\n                names_td.insert(CapaKey((*td).clone()), next_td);\n                next_td += 1;\n            }\n            *names_td.get(\u0026CapaKey((*td).clone())).unwrap()\n        });\n        for td in tds {\n            write!(f, \"td{} = \", names_td.get(\u0026CapaKey(td.clone())).unwrap())?;\n            td.borrow().print_header(\n                f,\n                \u0026mut names_td,\n                \u0026mut next_td,\n                \u0026mut names_region,\n                \u0026mut next_region,\n            )?;\n        }\n\n        // Print the regions.\n        let mut regions_sorted: Vec\u003c(CapaRef\u003cMemoryRegion\u003e, usize)\u003e = names_region\n            .iter()\n            .map(|(k, v)| (k.0.clone(), *v))\n            .collect();\n\n        // Now we can sort without borrowing names_region\n        regions_sorted.sort_by_key(|(_, v)| *v);\n\n        // Filter the regions to be printed.\n        let mut region_set: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, bool\u003e = HashMap::new();\n        for r in regions {\n            region_set.insert(CapaKey(r.clone()), true);\n            for c in \u0026r.borrow().children {\n                // If we do not own the child region anymore.\n                if !region_set.contains_key(\u0026CapaKey(c.clone())) {\n                    region_set.insert(CapaKey(c.clone()), false);\n                }\n            }\n        }\n\n        // Now iterate and print\n        for (key, name) in regions_sorted {\n            if !region_set.contains_key(\u0026CapaKey(key.clone())) {\n                continue;\n            }\n            write!(f, \"r{} = \", name)?;\n            let full = *region_set.get(\u0026CapaKey(key.clone())).unwrap();\n            let capa = key.borrow(); // no conflict anymore\n            capa.fmt_with_names(\n                f,\n                \u0026mut names_region,\n                String::from(\"r\"),\n                \u0026mut next_region,\n                full,\n            )?;\n            write!(f, \"\\n\")?;\n        }\n\n        // Print the local indices\n        if as_sorted_vector.len() != 0 {\n            write!(f, \"|indices:\")?;\n            for (key, capa) in as_sorted_vector {\n                match capa {\n                    CapaWrapper::Region(r) =\u003e {\n                        let name = names_region.get(\u0026CapaKey(r.clone())).unwrap();\n                        write!(f, \" {}-\u003er{}\", key, name)?;\n                    }\n                    CapaWrapper::Domain(d) =\u003e {\n                        let name = names_td.get(\u0026CapaKey(d.clone())).unwrap();\n                        write!(f, \" {}-\u003etd{}\", key, name)?;\n                    }\n                }\n            }\n\n            write!(f, \"\\n\")?;\n        }\n\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Policies {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        writeln!(f, \"|cores: {:#x}\", self.cores)?;\n        writeln!(f, \"|mon.api: {:#x}\", self.api.bits())?;\n        write!(f, \"{}\", self.interrupts)\n    }\n}\n\nimpl fmt::Display for InterruptPolicy {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        let mut start = 0;\n        let mut vector = self.get(0);\n\n        for i in 1..NB_INTERRUPTS {\n            if self.get(i) == vector {\n                continue;\n            }\n\n            // Print the range [start, i - 1] and the associated policy\n            if start == i - 1 {\n                writeln!(f, \"|vec{}: {}\", start, vector)?;\n            } else {\n                writeln!(f, \"|vec{}-{}: {}\", start, i - 1, vector)?;\n            }\n\n            // Update start and vector for the next range\n            start = i;\n            vector = self.get(i);\n        }\n\n        // Print the final range\n        if start == NB_INTERRUPTS - 1 {\n            writeln!(f, \"|vec{}: {}\", start, vector)?;\n        } else {\n            writeln!(f, \"|vec{}-{}: {}\", start, NB_INTERRUPTS - 1, vector)?;\n        }\n\n         const ALLOWED = 0b1;\n        const VISIBLE = 0b10;\n    }\n}\n\n#[derive(Debug, PartialEq, Eq, Clone, Copy)]\npub enum Status {\n    Unsealed,\n    Sealed,\n    Revoked,\n}\n\n#[derive(Debug, PartialEq, Eq, Clone, Copy)]\n#[repr(u8)]\npub enum FieldType {\n    Register = 1,\n    Cores = 2,\n    Api = 3,\n    InterruptVisibility = 4,\n    InterruptRead = 5,\n    InterruptWrite = 6,\n}\n\nimpl FieldType {\n    pub fn from_u64(v: u64) -\u003e Option\u003cSelf\u003e {\n        match v {\n            1 =\u003e Some(Self::Register),\n            2 =\u003e Some(Self::Cores),\n            3 =\u003e Some(Self::Api),\n            4 =\u003e Some(Self::InterruptVisibility),\n            5 =\u003e Some(Self::InterruptRead),\n            6 =\u003e Some(Self::InterruptWrite),\n            _ =\u003e None,\n        }\n    }\n}\n\n/// Define the type for field here\npub type Field = u64;\n\npub struct Policies {\n    pub cores: u64,\n    pub api: MonitorAPI,\n    pub interrupts: InterruptPolicy,\n}\n\nimpl Policies {\n    pub fn new(cores: u64, api: MonitorAPI, interrupts: \u0026InterruptPolicy) -\u003e Self {\n        Policies {\n            cores,\n            api,\n            interrupts: interrupts.clone(),\n        }\n    }\n\n    /// Is the other a subset of self\n    pub fn contains(\u0026self, other: \u0026Policies) -\u003e bool {\n        is_core_subset(self.cores, other.cores)\n            \u0026\u0026 self.api.contains(other.api)\n            \u0026\u0026 self.interrupts.contains(\u0026other.interrupts)\n    }\n}\n\n#[derive(Copy, Clone, PartialEq, Eq, Debug, PartialOrd, Ord)]\npub struct VectorPolicy {\n    pub visibility: VectorVisibility,\n    pub read_set: u64,\n    pub write_set: u64,\n}\n\nimpl VectorPolicy {\n    pub fn contains(\u0026self, other: \u0026VectorPolicy) -\u003e bool {\n        //TODO: do we care about register sets?\n        self.visibility.contains(other.visibility)\n    }\n}\n\npub const NB_INTERRUPTS: usize = 256;\npub const MASK_LEN: usize = (NB_INTERRUPTS + 63) / 64;\n\n#[derive(Clone, Copy)]\npub struct BitMask {\n    bits: [u64; MASK_LEN],\n}\n\nimpl BitMask {\n    /*fn is_set(\u0026self, i: usize) -\u003e bool {\n        let idx = i / 64;\n        let bit = i % 64;\n        (self.bits[idx] \u0026 (1 \u003c\u003c bit)) != 0\n    }*/\n\n    fn set(\u0026mut self, i: usize) {\n        let idx = i / 64;\n        let bit = i % 64;\n        self.bits[idx] |= 1 \u003c\u003c bit;\n    }\n\n    fn zero() -\u003e Self {\n        BitMask {\n            bits: [0; MASK_LEN],\n        }\n    }\n}\n\n#[derive(Clone)]\npub struct InterruptPolicy {\n    pub default: VectorPolicy,\n    pub overrides: BTreeMap\u003cVectorPolicy, BitMask\u003e,\n}\n\nimpl InterruptPolicy {\n    pub fn default_none() -\u003e Self {\n        InterruptPolicy {\n            default: VectorPolicy {\n                visibility: VectorVisibility::empty(),\n                read_set: !(0 as u64),\n                write_set: !(0 as u64),\n            },\n            overrides: BTreeMap::new(),\n        }\n    }\n    pub fn default_all() -\u003e Self {\n        InterruptPolicy {\n            default: VectorPolicy {\n                visibility: VectorVisibility::all(),\n                read_set: 0,\n                write_set: 0,\n            },\n            overrides: BTreeMap::new(),\n        }\n    }\n\n    pub fn get(\u0026self, i: usize) -\u003e VectorPolicy {\n        for (policy, mask) in \u0026self.overrides {\n            let idx = i / 64;\n            let bit = i % 64;\n            if idx \u003c mask.bits.len() \u0026\u0026 (mask.bits[idx] \u0026 (1 \u003c\u003c bit)) != 0 {\n                return *policy;\n            }\n        }\n        self.default\n    }\n\n    pub fn contains(\u0026self, other: \u0026InterruptPolicy) -\u003e bool {\n        for i in 0..NB_INTERRUPTS {\n            if !self.get(i).contains(\u0026other.get(i)) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    pub fn remove(\u0026mut self, i: usize) {\n        let mut to_remove = Vec::new();\n\n        for (policy, mask) in self.overrides.iter_mut() {\n            let idx = i / 64;\n            let bit = i % 64;\n            if idx \u003c mask.bits.len() \u0026\u0026 (mask.bits[idx] \u0026 (1 \u003c\u003c bit)) != 0 {\n                mask.bits[idx] \u0026= !(1 \u003c\u003c bit); // remove vector from old mask\n                if mask.bits.iter().all(|\u0026x| x == 0) {\n                    to_remove.push(*policy); // mark empty masks for removal\n                }\n                break; // vector can only be in one policy\n            }\n        }\n\n        for policy in to_remove {\n            self.overrides.remove(\u0026policy);\n        }\n    }\n\n    pub fn set(\u0026mut self, tpe: FieldType, field: u64, value: u64) -\u003e Result\u003c(), CapaError\u003e {\n        if field as usize \u003e= NB_INTERRUPTS {\n            return Err(CapaError::InvalidField);\n        }\n        let mut prev = self.get(field as usize);\n\n        match tpe {\n            FieldType::InterruptVisibility =\u003e {\n                let vis =\n                    VectorVisibility::from_bits(value as u8).ok_or(CapaError::InvalidValue)?;\n                prev.visibility = vis;\n            }\n            FieldType::InterruptRead =\u003e {\n                prev.read_set = value as u64;\n            }\n            FieldType::InterruptWrite =\u003e {\n                prev.write_set = value as u64;\n            }\n            _ =\u003e return Err(CapaError::InvalidField),\n        }\n\n        // Now add it back.\n        self.set_full(field, prev)\n    }\n\n    pub fn set_full(\u0026mut self, field: u64, value: VectorPolicy) -\u003e Result\u003c(), CapaError\u003e {\n        if field as usize \u003e= NB_INTERRUPTS {\n            return Err(CapaError::InvalidField);\n        }\n        self.remove(field as usize);\n        // Now add it back.\n        let mask = self\n            .overrides\n            .entry(value)\n            .or_insert_with(|| BitMask::zero());\n        mask.set(field as usize);\n        Ok(())\n    }\n}\n\n/// For the moment define a handle\npub type LocalCapa = u64;\n\n/// The structure to manipulate capabilities.\npub enum CapaWrapper {\n    Region(CapaRef\u003cMemoryRegion\u003e),\n    Domain(CapaRef\u003cDomain\u003e),\n}\n\nimpl CapaWrapper {\n    pub fn as_domain(\u0026self) -\u003e Result\u003cCapaRef\u003cDomain\u003e, CapaError\u003e {\n        if let CapaWrapper::Domain(d) = self {\n            return Ok(d.clone());\n        }\n        return Err(CapaError::WrongCapaType);\n    }\n    pub fn as_region(\u0026self) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        if let CapaWrapper::Region(r) = self {\n            return Ok(r.clone());\n        }\n        return Err(CapaError::WrongCapaType);\n    }\n}\n\npub struct CapabilityStore {\n    pub capabilities: BTreeMap\u003cLocalCapa, CapaWrapper\u003e,\n    pub next_handle: LocalCapa,\n    pub free_handles: VecDeque\u003cLocalCapa\u003e,\n}\n\nimpl CapabilityStore {\n    pub fn new() -\u003e Self {\n        CapabilityStore {\n            capabilities: BTreeMap::new(),\n            next_handle: 1,\n            free_handles: VecDeque::new(),\n        }\n    }\n    pub fn install_capability(\u0026mut self, cap: CapaWrapper) -\u003e LocalCapa {\n        let handle = if let Some(recycled) = self.free_handles.pop_front() {\n            recycled\n        } else {\n            let h = self.next_handle;\n            self.next_handle += 1;\n            h\n        };\n        self.capabilities.insert(handle, cap);\n        handle\n    }\n\n    pub fn install_capabilitiy_at(\u0026mut self, cap: CapaWrapper, idx: LocalCapa) {\n        self.capabilities.insert(idx, cap);\n    }\n\n    pub fn remove(\u0026mut self, handle: \u0026LocalCapa) -\u003e Result\u003cCapaWrapper, CapaError\u003e {\n        if let Some(cap) = self.capabilities.remove(handle) {\n            self.free_handles.push_back(*handle);\n            return Ok(cap);\n        }\n        Err(CapaError::InvalidLocalCapa)\n    }\n\n    pub fn get(\u0026self, handle: \u0026LocalCapa) -\u003e Result\u003c\u0026CapaWrapper, CapaError\u003e {\n        self.capabilities\n            .get(handle)\n            .ok_or(CapaError::InvalidLocalCapa)\n    }\n\n    pub fn foreach_region_mut\u003cF\u003e(\u0026mut self, op: F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: Fn(\u0026CapaRef\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for (_k, c) in \u0026mut self.capabilities {\n            if c.as_region().is_err() {\n                continue;\n            }\n            let region = c.as_region()?;\n            op(\u0026region)?;\n        }\n        Ok(())\n    }\n\n    pub fn foreach_region\u003cF\u003e(\u0026self, op: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026CapaRef\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for (_k, c) in \u0026self.capabilities {\n            if c.as_region().is_err() {\n                continue;\n            }\n            let region = c.as_region()?;\n            op(\u0026region)?;\n        }\n        Ok(())\n    }\n\n    pub fn reset(\u0026mut self) {\n        self.capabilities = BTreeMap::new();\n        self.next_handle = 1;\n        self.free_handles = VecDeque::new();\n    }\n}\n\npub struct Domain {\n    pub id: u64,\n    pub status: Status,\n    pub capabilities: CapabilityStore,\n    pub policies: Policies,\n}\n\nimpl PartialEq for Domain {\n    fn eq(\u0026self, other: \u0026Self) -\u003e bool {\n        self.id == other.id\n    }\n}\n\nimpl Domain {\n    pub fn new(policies: Policies) -\u003e Self {\n        Domain {\n            id: NEXT_ID.fetch_add(1, Ordering::Relaxed),\n            status: Status::Unsealed,\n            capabilities: CapabilityStore::new(),\n            policies,\n        }\n    }\n    pub fn is_sealed(\u0026self) -\u003e bool {\n        return self.status == Status::Sealed;\n    }\n    pub fn install(\u0026mut self, capa: CapaWrapper) -\u003e LocalCapa {\n        self.capabilities.install_capability(capa)\n    }\n\n    pub fn remove(\u0026mut self, capa: LocalCapa) -\u003e Result\u003cCapaWrapper, CapaError\u003e {\n        self.capabilities.remove(\u0026capa)\n    }\n\n    pub fn is_domain(\u0026self, capa: LocalCapa) -\u003e Result\u003cbool, CapaError\u003e {\n        if let CapaWrapper::Domain(_) = self.capabilities.get(\u0026capa)? {\n            return Ok(true);\n        }\n        Ok(false)\n    }\n\n    pub fn is_region(\u0026self, capa: LocalCapa) -\u003e Result\u003cbool, CapaError\u003e {\n        if let CapaWrapper::Region(_) = self.capabilities.get(\u0026capa)? {\n            return Ok(true);\n        }\n        return Ok(false);\n    }\n\n    pub fn operation_allowed(\u0026self, apicall: MonitorAPI) -\u003e bool {\n        self.policies.api.contains(apicall)\n    }\n\n    pub fn set_policy(\u0026mut self, tpe: FieldType, field: u64, value: u64) -\u003e Result\u003c(), CapaError\u003e {\n        if self.is_sealed() {\n            return Err(CapaError::DomainSealed);\n        }\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::InvalidField),\n            FieldType::Cores =\u003e {\n                self.policies.cores = value as u64;\n                return Ok(());\n            }\n            FieldType::Api =\u003e {\n                self.policies.api =\n                    MonitorAPI::from_bits(value as u16).ok_or(CapaError::InvalidValue)?;\n                return Ok(());\n            }\n            FieldType::InterruptVisibility\n            | FieldType::InterruptRead\n            | FieldType::InterruptWrite =\u003e self.policies.interrupts.set(tpe, field, value),\n        }\n    }\n\n    pub fn get_policy(\u0026self, tpe: FieldType, field: u64) -\u003e Result\u003cu64, CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::InvalidField),\n            FieldType::Api =\u003e Ok(self.policies.api.bits() as u64),\n            FieldType::Cores =\u003e Ok(self.policies.cores),\n            FieldType::InterruptWrite =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self.policies.interrupts.get(field as usize).write_set)\n            }\n            FieldType::InterruptRead =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self.policies.interrupts.get(field as usize).read_set)\n            }\n            FieldType::InterruptVisibility =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self\n                    .policies\n                    .interrupts\n                    .get(field as usize)\n                    .visibility\n                    .bits() as u64)\n            }\n        }\n    }\n}\n","traces":[{"line":11,"address":[744881,744585,744741,744993,745089,742613,744617,744449,745057,744492,744817,744785,744757,744913,745025,743099,742939,743598,741729,742557,741682,739607,742758,741822,743190,743438,741701,743534,744956,744654,744433,743278,742838,742653,743019,744469,745113,743358,744849,741896],"length":1,"stats":{"Line":306}},{"line":12,"address":[445920,445872,445792,445909,445925,445904,445824,445891],"length":1,"stats":{"Line":0}},{"line":31,"address":[800016],"length":1,"stats":{"Line":2}},{"line":32,"address":[435521],"length":1,"stats":{"Line":2}},{"line":36,"address":[721096,721328,720092,719108,719783,721064,718869,718892,720945,720965,721567,721134,721535,719449,719032,720984,721237,721392,721471,721435,718564,719300,720929,721264,720023,719609,721296,719157,719364,   const CLEAN   = 0b010;\n        const VITAL   = 0b100;\n    }\n}\n\n#[derive(PartialEq, Debug, Clone, Copy, Eq)]\npub enum Remapped {\n    Identity,\n    Remapped(u64),\n}\n\nimpl Remapped {\n    pub fn shift(\u0026self, x: u64) -\u003e Self {\n        match self {\n            Self::Identity =\u003e Self::Identity,\n            Self::Remapped(y) =\u003e Self::Remapped(x + y),\n        }\n    }\n}\n\n#[derive(PartialEq, Clone, Copy, Debug, Eq)]\npub struct Access {\n    pub start: u64,\n    pub size: u64,\n    pub rights: Rights,\n}\n\nimpl Access {\n    pub fn new(start: u64, size: u64, rights: Rights) -\u003e Self {\n        Access {\n            start,\n            size,\n            rights,\n        }\n    }\n    pub fn contained(\u0026self, other: \u0026Self) -\u003e bool {\n        self.start \u003e= other.start\n            \u0026\u0026 self.start + self.size \u003c= other.start + other.size\n            \u0026\u0026 other.rights.contains(self.rights)\n    }\n\n    pub fn intersect(\u0026self, other: \u0026Self) -\u003e bool {\n        let case_1 = self.start \u003c= other.start \u0026\u0026 other.start \u003c self.start + self.size;\n        let case_2 = other.start \u003c= self.start \u0026\u0026 self.start \u003c other.start + other.size;\n        case_1 || case_2\n    }\n    pub fn end(\u0026self) -\u003e u64 {\n        self.start + self.size\n    }\n}\n\n#[derive(PartialEq, Debug, Clone)]\npub struct MemoryRegion {\n    pub kind: RegionKind,\n    pub status: Status,\n    pub access: Access,\n    pub attributes: Attributes,\n    pub remapped: Remapped,\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct ViewRegion {\n    pub access: Access,\n    pub remap: Remapped,\n}\n\nimpl ViewRegion {\n    pub fn new(access: Access, remap: Remapped) -\u003e Self {\n        ViewRegion { access, remap }\n    }\n\n    pub fn active_start(\u0026self) -\u003e u64 {\n        if let Remapped::Remapped(gva) = self.remap {\n            gva\n        } else {\n            self.access.start\n        }\n    }\n    pub fn active_end(\u0026self) -\u003e u64 {\n        self.active_start() + self.access.size\n    }\n\n    pub fn contains_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.active_start() \u003c= other.active_start()\n            \u0026\u0026 other.active_end() \u003c= self.active_end()\n            \u0026\u0026 self.access.rights.contains(other.access.rights)\n    }\n\n    pub fn contiguous(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        // They must be contiguous in remaps and non remaps\n        // and have the same access rights\n        self.active_end() == other.active_start()\n            \u0026\u0026 self.access.end() == other.access.start\n            \u0026\u0026 self.access.rights == other.access.rights\n    }\n\n    pub fn overlap_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.active_start() \u003c= other.active_start() \u0026\u0026 other.active_start() \u003c self.active_end()\n        //\u0026\u0026 self.active_end() \u003c other.active_end()\n    }\n\n    pub fn overlap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.access.start \u003c= other.access.start \u0026\u0026 other.access.start \u003c self.access.end()\n        //\u0026\u0026 self.access.end() \u003c other.access.end()\n    }\n\n    // Check if they intersect.\n    pub fn intersect_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.overlap_remap(other) || other.overlap_remap(self)\n    }\n\n    pub fn compatible(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        if self.active_start() \u003c= other.active_start() \u0026\u0026 !self.overlap_remap(other) {\n            return true;\n        }\n        if self.active_start() \u003e= other.active_start() \u0026\u0026 !other.overlap_remap(self) {\n            return true;\n        }\n        let (first, second) = if self.active_start() \u003c= other.active_start() {\n            (self, other)\n        } else {\n            (other, self)\n        };\n\n        match (first.remap, second.remap) {\n            (Remapped::Identity, Remapped::Identity) =\u003e {\n                return true;\n            }\n            // Needs to be remapped in exactly the same way.\n            // We can have several capabilities with the same physical and remaped\n            // range but we cannot have a gap with two different ranges, i.e.,\n            // we need to avoid gva mapping to multiple hpa.\n            (Remapped::Remapped(x), Remapped::Remapped(y)) =\u003e {\n                // They are not ordered in the same way, that won't work.\n                if first.access.start \u003e second.access.start {\n                    return false;\n                }\n                let diff_active = y - x;\n                let diff_real = second.access.start - first.access.start;\n                return diff_active == diff_real;\n            }\n            // For the moment, let's disallow all remapping overlaps.\n            _ =\u003e return false,\n        }\n    }\n\n    pub fn merge_at(curr: usize, regions: \u0026mut Vec\u003cSelf\u003e) -\u003e Result\u003cusize, CapaError\u003e {\n        if curr == regions.len() - 1 {\n            return Ok(regions.len());\n        }\n\n        let mut current = regions[curr];\n        let mut other = regions[curr + 1];\n\n        // Case 1: contained.\n        if current.contains_remap(\u0026other) {\n            // Safety check, this should only happen if they are the same in physical space.\n            if !(current.access.start \u003c= other.access.start\n                \u0026\u0026 other.access.end() \u003c= current.access.end())\n            {\n                return Err(CapaError::DoubleRemapping);\n            }\n            // Remove the next.\n            regions.remove(curr + 1);\n            return Ok(curr);\n        }\n\n        // Case 2: contiguous\n        if current.contiguous(\u0026other) {\n            current = ViewRegion::new(\n                Access::new(\n                    current.access.start,\n                    current.access.size + other.access.size,\n                    current.access.rights,\n                ),\n                current.remap,\n            );\n            // Commit the change.\n            regions[curr] = current;\n            regions.remove(curr + 1);\n            return Ok(curr);\n        }\n\n        if current.overlap_remap(\u0026other) {\n            // Check that they are in the same physical space.\n            if !current.overlap(\u0026other) {\n                return Err(CapaError::DoubleRemapping);\n            }\n            // Split the overlap and let the next round merge contiguous.\n            let middle_remap = match current.remap {\n                Remapped::Identity =\u003e Remapped::Identity,\n                Remapped::Remapped(x) =\u003e {\n                    Remapped::Remapped(other.access.start - current.access.start + x)\n                }\n            };\n            let middle = ViewRegion::new(\n                Access::new(\n                    other.access.start,\n                    u64::min(current.access.end(), other.access.end()) - other.access.start,\n                    current.access.rights.union(other.access.rights),\n                ),\n                middle_remap,\n            );\n            let remainder = u64::max(current.access.end(), other.access.end());\n            let rights = if remainder == current.access.end() {\n                current.access.rights\n            } else {\n                other.access.rights\n            };\n            // Update left.\n            current.access.size = middle.access.start - current.access.start;\n            // Update right\n            other.access.start = middle.access.end();\n            other.access.size = remainder - other.access.start;\n            other.access.rights = rights;\n            let other_remap = match other.remap {\n                Remapped::Identity =\u003e Remapped::Identity,\n                Remapped::Remapped(x) =\u003e Remapped::Remapped(x + middle.access.size),\n            };\n\n            other.remap = other_remap;\n            // Commit the changes before inserting the new view.\n            regions[curr] = current;\n            regions[curr + 1] = other;\n            // Now insert\n            if current.access.size == 0 {\n                regions[curr] = middle;\n            } else {\n                regions.insert(curr + 1, middle);\n            }\n            return Ok(curr);\n        }\n        Ok(curr + 1)\n    }\n}\n\nimpl PartialOrd for ViewRegion {\n    fn partial_cmp(\u0026self, other: \u0026Self) -\u003e Option\u003cOrdering\u003e {\n        Some(self.cmp(other))\n    }\n}\n\nimpl Ord for ViewRegion {\n    fn cmp(\u0026self, other: \u0026Self) -\u003e Ordering {\n        self.active_start()\n            .cmp(\u0026other.active_start())\n            .then(self.access.size.cmp(\u0026other.access.size))\n    }\n}\n","traces":[{"line":19,"address":[523255,524975,524800,524943,522669,524736,524907,524709,522772,522380,524536,523081,523335,523172,525064,523001,524437,522579,524456,524768,523415,523564,524693,522836,522293,525039,522629,522921,522262,524832,524568,521860,522316,523495,524401,522456,524606,524417,524864,525007],"length":1,"stats":{"Line":361}},{"line":20,"address":[521264,521184,521251,521152,521232,521280,521269,521285],"length":1,"stats":{"Line":26}},{"line":28,"address":[517435,515529,515863,517264,516929,517360,515783,517221,517535,516945,517592,516984,517237,517392,514773,514796,517064,516023,517567,514936,515364,514212,515449,517134,517503,514860,515157,516965,514744,515300,515700,517096,515197,515609,515106,515943,516092,517296,517328,517471],"length":1,"stats":{"Line":164}},{"line":29,"address":[554389,554355,554373,554288,554336,554384,554256,554368],"length":1,"stats":{"Line":2}},{"line":45,"address":[526816],"length":1,"stats":{"Line":1}},{"line":46,"address":[54 :[545793,545575],"length":1,"stats":{"Line":6}},{"line":253,"address":[522958],"length":1,"stats":{"Line":1}},{"line":255,"address":[493646],"length":1,"stats":{"Line":4}},{"line":256,"address":[545844,545891,545738],"length":1,"stats":{"Line":8}},{"line":258,"address":[530519,530418],"length":1,"stats":{"Line":5}},{"line":259,"address":[536320],"length":1,"stats":{"Line":1}},{"line":261,"address":[493974,494018],"length":1,"stats":{"Line":6}},{"line":263,"address":[530561],"length":1,"stats":{"Line":4}},{"line":265,"address":[535183,535255,535246],"length":1,"stats":{"Line":12}},{"line":270,"address":[546592],"length":1,"stats":{"Line":0}},{"line":271,"address":[494590],"length":1,"stats":{"Line":0}},{"line":276,"address":[495376],"length":1,"stats":{"Line":0}},{"line":277,"address":[531175],"length":1,"stats":{"Line":0}},{"line":278,"address":[549079],"length":1,"stats":{"Line":0}},{"line":279,"address":[537134],"length":1,"stats":{"Line":0}}],"covered":99,"coverable":113},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","src","core","mod.rs"],"content":"pub mod capability;\npub mod capakey;\npub mod coalesced;\npub mod display;\npub mod domain;\npub mod memory_region;\npub mod parser;\npub mod platform_state;\npub mod update;\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","src","core","parser.rs"],"content":"use std::cell::RefCell;\nuse std::collections::HashMap;\nuse std::rc::Rc;\n\nuse crate::core::capability::{CapaRef, Capability, Ownership};\n\nuse crate::core::domain::{\n    CapaWrapper, CapabilityStore, InterruptPolicy, Policies, VectorPolicy, VectorVisibility,\n};\nuse crate::core::memory_region::{\n    Access, Attributes, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse crate::core::{\n    capability::CapaError,\n    domain::{Domain, LocalCapa, MonitorAPI, Status},\n    memory_region::MemoryRegion,\n};\n\npub enum ParserChild {\n    Carve(String),\n    Alias(String),\n}\n\npub struct Parser {\n    pub regions: HashMap\u003cString, CapaRef\u003cMemoryRegion\u003e\u003e,\n    pub owner: HashMap\u003cString, String\u003e,\n    pub parent_children: HashMap\u003cString, Vec\u003cString\u003e\u003e,\n    pub domains: HashMap\u003cString, CapaRef\u003cDomain\u003e\u003e,\n    pub indicies: HashMap\u003cString, LocalCapa\u003e,\n}\n\nimpl Parser {\n    pub fn new() -\u003e Self {\n        Self {\n            regions: HashMap::new(),\n            owner: HashMap::new(),\n            parent_children: HashMap::new(),\n            domains: HashMap::new(),\n            indicies: HashMap::new(),\n        }\n    }\n\n    pub fn find_end(lines: \u0026[\u0026str], start: usize) -\u003e usize {\n        let mut j = start + 1;\n        while j \u003c lines.len() \u0026\u0026 lines[j].starts_with(\"|\") \u0026\u0026 !lines[j].starts_with(\"|indices:\") {\n            j += 1;\n        }\n        return j;\n    }\n\n    pub fn parse_indicies(\u0026mut self, line: \u0026str) -\u003e Result\u003c(), CapaError\u003e {\n        if !line.starts_with(\"|indices: \") {\n            return Err(CapaError::ParserCapability);\n        }\n\n        let line = line.trim_start_matches(\"|indices: \");\n        line.split_whitespace().for_each(|e| {\n            let sp: Vec\u003c\u0026str\u003e = e.split(\"-\u003e\").collect();\n            if sp.len() != 2 {\n                panic!(\"Invalid length {}\", sp.len());\n            }\n            self.indicies.insert(\n                sp[1].to_string(),\n                LocalCapa::from_str_radix(sp[0], 10).unwrap(),\n            );\n        });\n        Ok(())\n    }\n\n    pub fn parse_domain(\u0026mut self, lines: \u0026[\u0026str]) -\u003e Result\u003c(), CapaError\u003e {\n        if lines.len() \u003c 4 {\n            return Err(CapaError::ParserDomain);\n        }\n        // Should be tdX = STATUS domain(CAPAS)\n        let header: Vec\u003c\u0026str\u003e = lines[0].split_whitespace().collect();\n        let name = header[0].trim();\n        let status = Status::from_string(header[2].to_string())?;\n        let capabilities: Vec\u003c\u0026str\u003e = {\n            let start = header[3].find('(').ok_or(CapaError::ParserDomain)?;\n            let end = start\n                + header[3][start..]\n                    .find(\")\")\n                    .ok_or(CapaError::InvalidValue)?;\n            header[3][start + 1..end]\n                .split(\",\")\n                .filter(|s| s.len() \u003e 0)\n                .collect()\n        };\n        // Add the children now so it's done.\n        for c in capabilities {\n            self.owner.insert(c.to_string(), name.to_string());\n            if !c.starts_with(\"td\") {\n                continue;\n            }\n            self.parent_children\n                .entry(name.to_string())\n                .or_insert_with(Vec::new)\n                .push(c.to_string());\n        }\n\n        // Now parse the next lines.\n        if !lines[1].starts_with(\"|cores: 0x\") {\n            return Err(CapaError::ParserDomain);\n        }\n        let cores = {\n            let mask = lines[1].trim_start_matches(\"|cores: 0x\");\n            u64::from_str_radix(mask, 16).map_err(|_| CapaError::ParserDomain)?\n        };\n        let api = MonitorAPI::from_string(lines[2].to_string())?;\n\n        // Parse the interrupt policies.\n        let mut inter_policy: InterruptPolicy = InterruptPolicy::default_none();\n\n        for l in lines[3..].iter() {\n            if !l.starts_with(\"|vec\") {\n                break;\n            }\n            inter_policy.parse_one(l.to_string())?;\n        }\n        let domain = Domain {\n            id: 0,\n            status,\n            capabilities: CapabilityStore::new(),\n            policies: Policies::new(cores, api, \u0026inter_policy),\n        };\n        // Add the domain.\n        self.domains.insert(\n            name.to_string(),\n            CapaRef::new(RefCell::new(Capability::\u003cDomain\u003e::new(domain))),\n        );\n        Ok(())\n    }\n\n    pub fn parse_rights(input: \u0026str) -\u003e Result\u003cRights, CapaError\u003e {\n        let mut rights = Rights::empty();\n        if input.contains(\"R\") {\n            rights |= Rights::READ;\n        }\n        if input.contains(\"W\") {\n            rights |= Rights::WRITE;\n        }\n        if input.contains(\"W\") {\n            rights |= Rights::EXECUTE;\n        }\n        Ok(rights)\n    }\n\n    pub fn parse_remapped(input: \u0026str) -\u003e Result\u003cRemapped, CapaError\u003e {\n        if input.trim().contains(\"Identity\") {\n            return Ok(Remapped::Identity);\n        }\n        if !input.contains(\"Remapped\") {\n            return Err(CapaError::ParserRegion);\n        }\n        let mut trimmed = input.trim().trim_start_matches(\"Remapped(0x\");\n        trimmed = \u0026trimmed[0..trimmed.len() - 1];\n        let addr = u64::from_str_radix(trimmed, 16).map_err(|_| CapaError::ParserRegion)?;\n        Ok(Remapped::Remapped(addr))\n    }\n\n    pub fn parse_region_child(input: \u0026str) -\u003e Result\u003c(String, CapaRef\u003cMemoryRegion\u003e), CapaError\u003e {\n        let kind = if input.starts_with(\"| Alias\") {\n            RegionKind::Alias\n        } else if input.starts_with(\"| Carve\") {\n            RegionKind::Carve\n        } else {\n            return Err(CapaError::ParserRegion);\n        };\n        let splitted: Vec\u003c\u0026str\u003e = input.split_whitespace().collect();\n        if splitted.len() != 9 {\n            return Err(CapaError::ParserRegion);\n        }\n\n        let start = u64::from_str_radix(splitted[3].trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        let end = u64::from_str_radix(splitted[4].trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        if end \u003c= start {\n            return Err(CapaError::InvalidValue);\n        }\n        let rights = Self::parse_rights(splitted[6])?;\n        let access = Access::new(start, end - start, rights);\n        let name = splitted.last().ok_or(CapaError::ParserRegion)?;\n        if !name.starts_with(\"r\") {\n            return Err(CapaError::ParserRegion);\n        }\n        Ok((\n            name.to_string(),\n            CapaRef::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n                MemoryRegion {\n                    kind,\n                    status: MStatus::Exclusive,\n                    access,\n                    attributes: Attributes::empty(),\n                    remapped: Remapped::Identity,\n                },\n            ))),\n        ))\n    }\n\n    pub fn parse_region(\u0026mut self, input: \u0026[\u0026str]) -\u003e Result\u003c(), CapaError\u003e {\n        if input.len() == 0 || !input[0].starts_with(\"r\") {\n            return Err(CapaError::ParserDomain);\n        }\n        let header: Vec\u003c\u0026str\u003e = input[0].split_whitespace().collect();\n        if header.len() != 9 {\n            return Err(CapaError::ParserRegion);\n        }\n        let name = header[0];\n        let status = if header[2].to_lowercase().contains(\"exclusive\") {\n            MStatus::Exclusive\n        } else if header[2].to_lowercase().contains(\"aliased\") {\n            MStatus::Aliased\n        } else {\n            return Err(CapaError::ParserRegion);\n        };\n        let start = u64::from_str_radix(header[3].trim().trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        let end = u64::from_str_radix(header[4].trim().trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        if end \u003c= start {\n            return Err(CapaError::InvalidValue);\n        }\n        let rights = Self::parse_rights(header[6])?;\n\n        let access: Access = Access::new(start, end - start, rights);\n\n        let remapped = Self::parse_remapped(header[8])?;\n\n        let kind = if status == MStatus::Exclusive {\n            RegionKind::Carve\n        } else {\n            RegionKind::Alias\n        };\n\n        let region = self\n            .regions\n            .entry(name.to_string())\n            .or_insert(CapaRef::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n                MemoryRegion {\n                    kind,\n                    status,\n                    access,\n                    attributes: Attributes::empty(),\n                    remapped,\n                },\n            ))));\n        // Make sure we set what might be missing, i.e., the status, remapped, and attributes.\n        region.borrow_mut().data.status = status;\n        region.borrow_mut().data.remapped = remapped;\n        //region.attributes = ???;\n\n        // Now parse the children and populate the map.\n        for i in 1..input.len() {\n            let (cname, child) = Self::parse_region_child(input[i])?;\n            if self.regions.contains_key(\u0026cname) {\n                let entry = self\n                    .regions\n                    .get_mut(\u0026cname)\n                    .ok_or(CapaError::ParserRegion)?;\n                entry.borrow_mut().data.kind = child.borrow_mut().data.kind;\n            } else {\n                self.regions.insert(cname.clone(), child);\n            }\n            self.parent_children\n                .entry(name.to_string())\n                .or_insert_with(Vec::new)\n                .push(cname.clone());\n        }\n\n        Ok(())\n    }\n\n    pub fn parse_attestation(\u0026mut self, attestation: String) -\u003e Result\u003c(), CapaError\u003e {\n        let lines: Vec\u003c\u0026str\u003e = attestation.lines().collect();\n        self.parse_attestation_internal(\u0026lines)\n    }\n\n    fn parse_attestation_internal(\u0026mut self, lines: \u0026Vec\u003c\u0026str\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let mut i: usize = 0;\n        while i \u003c lines.len() {\n            if lines[i].starts_with(\"td\") {\n                let end = Self::find_end(lines, i);\n                self.parse_domain(\u0026lines[i..end])?;\n                i = end;\n            } else if lines[i].starts_with(\"r\") {\n                let end = Self::find_end(lines, i);\n                self.parse_region(\u0026lines[i..end])?;\n                i = end;\n            } else if lines[i].starts_with(\"|indices:\") {\n                self.parse_indicies(lines[i])?;\n                i += 1;\n            } else {\n                break;\n            }\n        }\n        // Now create the tree for the capabilities.\n        for (k, v) in self.parent_children.iter() {\n            if k.starts_with(\"td\") {\n                let parent = self.domains.get(k).ok_or(CapaError::ParserCapability)?;\n                for c in v.iter() {\n                    if !self.domains.contains_key(c) {\n                        continue;\n                    }\n                    let child = self.domains.get(c).unwrap();\n                    parent.borrow_mut().children.push(child.clone());\n                    child.borrow_mut().parent = Rc::downgrade(parent);\n                }\n            } else if k.starts_with(\"r\") {\n                let parent = self.regions.get(k).ok_or(CapaError::ParserCapability)?;\n                for c in v.iter() {\n                    if !self.regions.contains_key(c) {\n                        continue;\n                    }\n                    let child = self.regions.get(c).unwrap();\n                    parent.borrow_mut().children.push(child.clone());\n                    child.borrow_mut().parent = Rc::downgrade(parent);\n                }\n            }\n        }\n        let td0 = self.domains.get(\"td0\").ok_or(CapaError::ParserDomain)?;\n        // Now use the indicies to set ownership.\n        for (k, v) in self.indicies.iter() {\n            let capa_wrapper = if k.start ing) -\u003e Result\u003cSelf::Output, CapaError\u003e {\n        match input.trim().to_lowercase().as_str() {\n            \"sealed\" =\u003e Ok(crate::core::domain::Status::Sealed),\n            \"unsealed\" =\u003e Ok(crate::core::domain::Status::Unsealed),\n            _ =\u003e return Err(CapaError::ParserStatus),\n        }\n    }\n}\n\nimpl Unmarshall for MonitorAPI {\n    type Output = MonitorAPI;\n    fn from_string(input: String) -\u003e Result\u003cSelf::Output, CapaError\u003e {\n        let value = input.trim_start_matches(\"|mon.api: 0x\");\n        let raw = u64::from_str_radix(value, 16).map_err(|_| CapaError::ParserMonitor)?;\n        MonitorAPI::from_bits(raw as u16).ok_or(CapaError::ParserMonitor)\n    }\n}\n\nimpl InterruptPolicy {\n    pub fn parse_one(\u0026mut self, l: String) -\u003e Result\u003c(), CapaError\u003e {\n        if !l.starts_with(\"|vec\") {\n            return Err(CapaError::InvalidValue);\n        }\n        let prefix = l.strip_prefix(\"|vec\").ok_or(CapaError::InvalidValue)?;\n        let parts: Vec\u003c\u0026str\u003e = prefix.split(',').collect();\n        if parts.len() != 3 {\n            return Err(CapaError::InvalidValue);\n        }\n\n        let tmp: Vec\u003c\u0026str\u003e = parts[0].split(':').collect();\n        let (range, visi) = (tmp[0].trim_start_matches(\"|vec\"), tmp[1]);\n        // We have the start and end vector.\n        let (vs, ve) = if let Some((start, end)) = range.split_once('-') {\n            (\n                usize::from_str_radix(start, 10).map_err(|_| CapaError::InvalidValue)?,\n                usize::from_str_radix(end, 10).map_err(|_| CapaError::InvalidValue)?,\n            )\n        } else {\n            let value = usize::from_str_radix(range, 10).map_err(|_| CapaError::InvalidValue)?;\n            (value, value)\n        };\n\n        let visibility = match visi.trim().to_lowercase().as_str() {\n            \"allowed|visible\" =\u003e VectorVisibility::all(),\n            \"allowed\" );\n        }\n    }\n\n    // Add an update.\n    pub fn add(\u0026mut self, update: Update) {\n        match update {\n            Update::Clean { start: _, size: _ } =\u003e {\n                self.to_clean.push(update);\n            }\n            Update::Revoke { ref dom } =\u003e {\n                self.to_change.remove(\u0026WeakKey(dom.clone()));\n                self.to_change.insert(WeakKey(dom.clone()));\n            }\n            Update::ChangeMemory { ref dom } =\u003e {\n                if !self.to_revoke.contains(\u0026WeakKey(dom.clone())) {\n                    self.to_change.insert(WeakKey(dom.clone()));\n                }\n            }\n        }\n    }\n\n    // Compute the views for all the domains that are affected.\n    pub fn snapshot(\u0026mut self) -\u003e Result\u003c(), CapaError\u003e {\n        //TODO: we might change this.\n        for d in \u0026self.to_change {\n            let weak = \u0026d.0;\n            if let Some(domain) = weak.clone().upgrade() {\n                let coal = CoalescedView::from_regions(domain.borrow().view()?)?;\n                self.snap.insert(WeakKey(weak.clone()), coal);\n            }\n        }\n        //TODO we will need to do the cleaning + switch due to revoke\n        Ok(())\n    }\n\n    pub fn compute(\u0026mut self) -\u003e Result\u003c(), CapaError\u003e {\n        //TODO: I'll have to think about the most efficient change.\n        /*for (d, v) in self.snap.iter() {\n            if let Some(dom) = \u0026d.0.upgrade() {\n                let view = CoalescedView::from_regions(dom.borrow().view()?)?;\n                let (add, remove) = v.diff(view);\n            }\n        }*/\n        Ok(())\n    }\n}\n","traces":[{"line":33,"address":[621627,621312,621621],"length":1,"stats":{"Line":11}},{"line":35,"address":[702453],"length":1,"stats":{"Line":10}},{"line":36,"address":[719374],"length":1,"stats":{"Line":11}},{"line":37,"address":[1158455],"length":1,"stats":{"Line":10}},{"line":38,"address":

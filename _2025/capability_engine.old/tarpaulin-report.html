lf,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        call: MonitorAPI,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        let dom = domain.borrow();\n        if dom.data.status != Status::Sealed {\n            return Err(CapaError::DomainUnsealed);\n        }\n        if !dom.data.operation_allowed(call) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        Ok(())\n    }\n\n    pub fn add_root_region(\n        \u0026self,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        region: \u0026CapaRef\u003cMemoryRegion\u003e,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        let local_handle = {\n            let dom = \u0026mut domain.borrow_mut();\n            dom.data.install(CapaWrapper::Region(region.clone()))\n        };\n        let reg = \u0026mut region.borrow_mut();\n        reg.owned = Ownership::new(Rc::downgrade(domain), local_handle);\n        Ok(local_handle)\n    }\n\n    fn revoke_region_handler(capa: \u0026mut Capability\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let owner = capa.owned.owner.upgrade().ok_or(CapaError::CapaNotOwned)?;\n        owner\n            .borrow_mut()\n            .data\n            .capabilities\n            .remove(\u0026capa.owned.handle)?;\n        Ok(())\n    }\n}\n\nimpl\u003cP: PlatformState\u003e EngineInterface for Engine\u003cP\u003e {\n    type CapaReference = CapaRef\u003cDomain\u003e;\n    type OwnedCapa = LocalCapa;\n    type CapabilityError = CapaError;\n\n    fn new(nb_cores: u64) -\u003e Self {\n        // Create the root capability for the domain.\n        let mut root = Domain::new(Policies::new(\n            (1 \u003c\u003c nb_cores) - 1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_all(),\n        ));\n        root.status = Status::Sealed;\n        let dom = Capability::\u003cDomain\u003e::new(root);\n        let ref_td = Rc::new(RefCell::new(dom));\n        Engine {\n            root: ref_td,\n            scheduled: Vec::new(), /*vec![\u0026ref_td; nb_cores]*/\n            updates: VecDeque::\u003cVec\u003cUpdate\u003e\u003e::new(),\n            core_update: Vec::new(),\n            platform: P::new(),\n        }\n    }\n\n    fn create(\n        \u0026mut self,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        cores: u64,\n        api: MonitorAPI,\n        interrupts: \u0026InterruptPolicy,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::CREATE)?;\n\n        let dom = \u0026mut domain.borrow_mut();\n        if !is_core_subset(dom.data.policies.cores, cores) {\n            return Err(CapaError::InsufficientRights);\n        }\n        let policies = Policies::new(cores, api, interrupts);\n        let child_dom = Domain::new(policies);\n\n        let capa = Capability::\u003cDomain\u003e::new(child_dom);\n        let reference = Rc::new(RefCell::new(capa));\n        dom.add_child(reference.clone(), Rc::downgrade(\u0026domain));\n        let local_capa = dom.data.install(CapaWrapper::Domain(reference));\n        Ok(local_capa)\n    }\n\n    fn set(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        child: LocalCapa,\n        core: u64,\n        tpe: FieldType,\n        field: Field,\n        value: u64,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SET)?;\n        // We are not setting registers\n        if tpe != FieldType::Register {\n            // Check if the domain is sealed in which case policies cannot be set.\n            if domain\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)?\n                .as_domain()?\n                .borrow()\n                .data\n                .is_sealed()\n            {\n                return Err(CapaError::DomainSealed);\n            }\n\n            // The fact that it is a esult\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SEAL)?;\n\n        let current_policies = \u0026domain.borrow().data.policies;\n        // Check the child's policies are a subset of the parent.\n        if !current_policies.contains(\n            \u0026domain\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)?\n                .as_domain()?\n                .borrow()\n                .data\n                .policies,\n        ) {\n            return Err(CapaError::InsufficientRights);\n        }\n        domain.borrow().seal(child)\n    }\n\n    fn attest(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        other: Option\u003cLocalCapa\u003e,\n    ) -\u003e Result\u003cString, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ATTEST)?;\n\n        if let Some(child) = other {\n            return domain.borrow().attest(child);\n        }\n        let display = format!(\"{}\", domain.borrow());\n        return Ok(display);\n    }\n\n    fn enumerate(\u0026mut self, domain: CapaRef\u003cDomain\u003e, capa: LocalCapa) -\u003e Result\u003cString, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ENUMERATE)?;\n        let binding = domain.borrow();\n        let capa = binding.data.capabilities.get(\u0026capa)?;\n        match capa {\n            CapaWrapper::Region(r) =\u003e Ok(format!(\"{}\", r.borrow())),\n            CapaWrapper::Domain(d) =\u003e Ok(format!(\"{}\", d.borrow())),\n        }\n    }\n\n    fn switch(\u0026mut self, domain: CapaRef\u003cDomain\u003e, _capa: LocalCapa) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SWITCH)?;\n        todo!();\n    }\n\n    fn alias(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ALIAS)?;\n\n        let dom = \u0026mut domain.borrow_mut();\n        let region = dom.data.capabilities.get(\u0026capa)?.as_region()?;\n        let aliased = region.borrow_mut().alias(access)?;\n        let aliased_capa = dom.data.install(CapaWrapper::Region(aliased.clone()));\n\n        // Tree \u0026 ownership logic.\n        aliased.borrow_mut().parent = Rc::downgrade(\u0026region);\n        aliased.borrow_mut().owned = Ownership::new(Rc::downgrade(\u0026domain), aliased_capa);\n        Ok(aliased_capa)\n    }\n\n    fn carve(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::CARVE)?;\n\n        let mut updates = OperationUpdate::new();\n\n        let region = {\n            let dom = \u0026domain.borrow();\n            dom.data.capabilities.get(\u0026capa)?.as_region()?\n        };\n\n        // Carve can require updates if we reduce access rights.\n        if region.borrow().data.access.rights != access.rights {\n            updates.add(Update::ChangeMemory {\n                dom: Rc::downgrade(\u0026domain.clone()),\n            });\n        }\n        updates.snapshot()?;\n        //TODO: notify all cores\n\n        let dom = \u0026mut domain.borrow_mut();\n        let carved = region.borrow_mut().carve(access)?;\n        let carved_capa = dom.data.install(CapaWrapper::Region(carved.clone()));\n\n        // Tree \u0026 ownership logic.\n        carved.borrow_mut().parent = Rc::downgrade(\u0026region);\n        carved.borrow_mut().owned = Ownership::new(Rc::downgrade(\u0026domain), carved_capa);\n\n        updates.compute()?;\n        Ok(carved_capa)\n    }\n\n    fn revoke(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\ ined(\u0026a2)); // a1's range exceeds a2's\n}\n\n#[test]\nfn test_not_contained_rights_not_subset() {\n    let a1 = Access::new(0, 0x1000, Rights::READ | Rights::WRITE);\n    let a2 = Access::new(0, 0x2000, Rights::READ); // no WRITE\n    assert!(!a1.contained(\u0026a2)); // rights not a subset\n}\n\n#[test]\nfn test_not_contained_start_before_other() {\n    let a1 = Access::new(0, 0x1000, Rights::READ);\n    let a2 = Access::new(0x1000, 0x2000, Rights::READ | Rights::WRITE);\n    assert!(!a1.contained(\u0026a2)); // a1 starts before a2\n}\n\n#[test]\nfn test_contained_equal_range_lesser_rights() {\n    let a1 = Access::new(0, 0x2000, Rights::READ);\n    let a2 = Access::new(0, 0x2000, Rights::READ | Rights::WRITE);\n    assert!(a1.contained(\u0026a2)); // a1 has fewer rights but same range\n}\n\n#[test]\nfn test_not_contained_partial_overlap() {\n    let a1 = Access::new(0x1000, 0x2000, Rights::READ);\n    let a2 = Access::new(0x0000, 0x2000, Rights::READ | Rights::WRITE);\n    assert!(!a1.contained(\u0026a2)); // a1 spills past a2.end\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","coalesce.rs"],"content":"use capa_engine::core::coalesced::CoalescedView;\nuse capa_engine::core::memory_region::{Access, Remapped, Rights, ViewRegion};\n\n// ———————————————————————————————— Helpers ————————————————————————————————— //\n\nfn assert_view_display_eq(coal: \u0026CoalescedView, expected: \u0026[\u0026str]) {\n    let rendered: Vec\u003cString\u003e = coal.regions.iter().map(|v| v.to_string()).collect();\n    assert_eq!(rendered.len(), expected.len(), \"Length mismatch\");\n\n    for (i, (actual, expect)) in rendered.iter().zip(expected.iter()).enumerate() {\n        assert_eq!(\n            actual, expect,\n            \"Mismatch at index {}: got `{}`, expected `{}`\",\n            i, actual, expect\n        );\n    }\n}\n// ————————————————————————————————— Tests —————————————————————————————————— //\n\n#[test]\nfn test_coalesce() {\n    let vr1 = ViewRegion {\n        access: Access {\n            start: 0,\n            size: 0x1000,\n            rights: Rights::READ,\n        },\n        remap: Remapped::Identity,\n    };\n\n    let vr2 = ViewRegion {\n        access: Access {\n            start: 0x1000,\n            size: 0x2000,\n            rights: Rights::READ,\n        },\n        remap: Remapped::Identity,\n    };\n\n    let mut view = CoalescedView::new();\n    view.add(vr1).unwrap();\n    view.add(vr2).unwrap();\n    let expected = vec![\"0x0 0x3000 with R__ mapped Identity\"];\n    assert_view_display_eq(\u0026view.clone(), \u0026expected);\n\n    view.sub(\u0026ViewRegion {\n        access: Access {\n            start: 0x1000,\n            size: 0x1000,\n            rights: Rights::READ,\n        },\n        remap: Remapped::Identity,\n    })\n    .unwrap();\n    let expected = vec![\n        \"0x0 0x1000 with R__ mapped Identity\",\n        \"0x2000 0x3000 with R__ mapped Identity\",\n    ];\n    assert_view_display_eq(\u0026view, \u0026expected)\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","display.rs"],"content":"use capa_engine::core::capability::*;\nuse capa_engine::core::memory_region::*;\n\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\n#[test]\nfn test_display_single_node() {\n    let root = create_root();\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = \"Exclusive 0x0 0x10000 with RWX mapped Identity\";\n\n    // Check if the display output matches the expected output\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_alias() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x1000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let a1 = root.alias(\u0026alias_access).expect(\"Error\");\n\n    // Get the display output of the root capability with its alias\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\"#;\n\n    // Check if the display output contains the root and child\n    assert_eq!(display_output, expected_output);\n\n    // Check the child.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Identity\";\n\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_multiple_children() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x1000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let a1 = root.alias(\u0026alias_access).expect(\"Error\");\n\n    let carve_access = Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026carve_access).expect(\"Error\");\n\n    // Get the display output of the root capability with its children\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\n| Carve at 0x3000 0x4000 with RW_ for .1\"#;\n\n    // Check if the display output contains the root and children\n    assert_eq!(display_output, expected_output);\n\n    // Check the children now.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Identity\";\n    assert_eq!(display_output, expected_output);\n\n    let display_output = format!(\"{}\", c1.borrow());\n    let expected_output = \"Exclusive 0x3000 0x4000 with RW_ mapped Identity\";\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_nested_children() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x2000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let a1 = root.alias(\u0026alias_access).expect(\"Error\");\n\n    let carve_access = Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE);\n    let c1 = a1.borrow_mut().carve(\u0026carve_access).expect(\"Error\");\n\n    // Get the display output of the root capability with its alias and nested carve\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x4000 with RWX for .0\"#; // Nested carve should also be .0\n\n    // Check if the display output contains the root and nested child\n    assert_eq!(display_output, expected_output);\n\n    // Check the alias.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = r#\"Aliased 0x2000 0x4000 with RWX mapped Identity\n| Carve at 0x3000 0x4000 with RW_ for .0\"#;\n    assert_eq!(display_output, expected_output);\n\n    // Check the carve.\n    let display_output = format!(\"{}\", c1.borrow());\n    let expected_output = \"Aliased 0x3000 0x4000 with RW_ mapped Identity\";\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_remap() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x1000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let alias_ref = root.alias(\u0026alias_access).expect(\"Error\");\n\n    // Change the remap to a non-identity one\n    alias_ref.borrow_mut().data.remapped = Remapped::Remapped(0x1000);\n\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\"#;\n\n    // Check if the display output contains the remap information\n    assert_eq!(display_output, expected_output);\n\n    // Check the remapped in the child.\n    let display_output = format!(\"{}\", alias_ref.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Remapped(0x1000)\";\n    assert_eq!(display_output, expected_output);\n}\n\n// ——————————————————— Testing the display of ViewRegions ——————————————————— //\n\nfn assert_view_display_eq(view: \u0026[ViewRegion], expected: \u0026[\u0026str]) {\n    let rendered: Vec\u003cString\u003e = view.iter().map(|v| v.to_string()).collect();\n    assert_eq!(rendered.len(), expected.len(), \"Length mismatch\");\n\n    for (i, (actual, expect)) in rendered.iter().zip(expected.iter()).enumerate() {\n        assert_eq!(\n            actual, expect,\n            \"Mismatch at index {}: got `{}`, expected `{}`\",\n            i, actual, expect\n        );\n    }\n}\n\n#[test]\nfn test_display_viewregion_identity() {\n    let base_access = Access::new(0x0, 0x10000, Rights::READ | Rights::WRITE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    let mut cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    // Carve out a region in the middle\n    let carved = Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE);\n    cap.carve(\u0026carved).unwrap();\n\n    let views = cap.view();\n\n    let expected = vec![\n        \"0x0 0x1000 with RW_ mapped Identity\",\n        \"0x2000 0x10000 with RW_ mapped Identity\",\n    ];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_display_viewregion_remapped() {\n    let base_access = Access::new(0x0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Remapped(0x4000),\n    };\n\n    let mut cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    // Carve out a region at the start\n    let carved = Access::new(\n        0x2000,\n        0x2000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    cap.carve(\u0026carved).unwrap();\n\n    let views = cap.view();\n\n    let expected = vec![\n        \"0x0 0x2000 with RWX mapped Remapped(0x4000)\",\n        \"0x4000 0x10000 with RWX mapped Remapped(0x8000)\",\n    ];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_display_viewregion_no_carves() {\n    let base_access = Access::new(0x0, 0x10000, Rights::WRITE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    let cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    let views = cap.view();\n\n    let expected = vec![\"0x0 0x10000 with _W_ mapped Identity\"];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_view_with_alias() {\n    let mut capa = Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    });\n\n    capa.alias(\u0026Access::new(0x1400, 0x200, Rights::READ | Rights::WRITE))\n        .unwrap(); // should NOT affect view\n    let views = capa.view();\n    assert_view_display_eq(\u0026views, \u0026vec![\"0x1000 0x2000 with RW_ mapped Identity\"]);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","domain.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_domain() -\u003e Capability\u003cDomain\u003e {\n    let policies = Policies::new(0b111111, MonitorAPI::all(), \u0026InterruptPolicy::default_all());\n    let mut capa = Capability::\u003cDomain\u003e::new(Domain::new(policies));\n    capa.data.status = Status::Sealed;\n    capa\n}\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_empty_root_domain() {\n    let domain = create_root_domain();\n    let display_output = format!(\"{}\", domain);\n    let expected_output = format!(\"td0 = Sealed domain()\\n|cores: 0x3f\\n|mon.api: 0x1fff\\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\\n\");\n    assert_eq!(display_output, expected_output)\n}\n\n#[test]\nfn test_root_domain_with_root_memory() {\n    let mut domain = create_root_domain();\n    let region = create_root();\n    let reference = Rc::new(RefCell::new(region));\n    domain.data.install(CapaWrapper::Region(reference));\n\n    let display_output = format!(\"{}\", domain);\n    let expected_output = format!(\"td0 = Sealed domain(r0)\\n|cores: 0x3f\\n|mon.api: 0x1fff\\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\\n|indices: 1-\u003er0\\n\");\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_unallowed_calls() {\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::ATTEST,\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // Let's seal the child directly.\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    // Now try to send it something.\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n\n    let res = engine.send(\n        td0.clone(),\n        child_td,\n        alias,\n        Remapped::Identity,\n        Attributes::empty(),\n    );\n    assert!(res.is_err());\n\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Now try to make the child do stuff while not sealed.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias,\n            Remapped::Identity,\n            Attributes::empty(),\n        )\n        .unwrap();\n\n    {\n        let child = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let access = Access::new(0x0, 0x1000, Rights::READ);\n        let res = engine.alias(child.clone(), 1, \u0026access);\n        assert_eq!(res, Err(CapaError::DomainUnsealed));\n    }\n\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Okay last one.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::CARVE,\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias,\n            Remapped::Identity,\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    {\n        let child = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let res = engine.alias(child.clone(), 1, \u0026Access::new(0x0, 0x1000, Rights::READ));\n        assert_eq!(res, Err(CapaError::CallNotAllowed));\n\n        let res = child.borrow().seal(1);\n        assert!(res.is_err());\n    }\n\n    // Okay try to reseal the same domain.\n    let res = engine.seal(td0.clone(), child_td);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n\n    // Try to seal something wrong.\n    let res = engine.seal(td0.clone(), td0_r0);\n    assert_eq!(res, Err(CapaError::WrongCapaType));\n    let res = td0.borrow().seal(td0_r0);\n    assert_eq!(res, Err(CapaError::WrongCapaType));\n}\n\n#[test]\nfn test_set_get() {\n    let (mut engine, td0, _r0, _td0_r0) = setup_engine_with_root();\n\n    // Create a child domain\n\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // First let's seal it and see if we read the right things.\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    let cores = engine\n        .get(td0.clone(), child_td, 0, FieldType::Cores, 0)\n        .unwrap();\n    assert_eq!(cores, 1);\n\n    let api = engine\n        .get(td0.clone(), child_td, 0, FieldType::Api, 0)\n        .unwrap();\n    assert_eq!(api, MonitorAPI::all().bits() as u64);\n\n    for i in 0..NB_INTERRUPTS {\n        let vis = engine\n            .get(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptVisibility,\n                i as u64,\n            )\n            .unwrap();\n        let read = engine\n            .get(td0.clone(), child_td, 0, FieldType::InterruptRead, i as u64)\n            .unwrap();\n        let write = engine\n            .get(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptWrite,\n                i as u64,\n            )\n            .unwrap();\n        assert_eq!(vis, 0);\n        assert_eq!(read, !0);\n        assert_eq!(write, !0);\n    }\n\n    // Now attempt to change policies.\n    let res = engine.set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n    let res = engine.set(td0.clone(), child_td, 0, FieldType::Api, 0, 0);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n    for i in 0..NB_INTERRUPTS {\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptVisibility,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptRead,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptWrite,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n    }\n\n    // Revoke and now lets do sets.\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Create the new one and play with its values.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::empty(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // Now attempt to change policies.\n    engine\n        .set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11)\n        .unwrap();\n    engine\n        .set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::Api,\n            0,\n            MonitorAPI::all().bits() as u64,\n        )\n        .unwrap();\n    for i in 0..NB_INTERRUPTS {\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptVisibility,\n                i as u64,\n                VectorVisibility::all().bits() as u64,\n            )\n            .unwrap();\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptRead,\n                i as u64,\n                0,\n            )\n            .unwrap();\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptWrite,\n                i as u64,\n                0,\n            )\n            .unwrap();\n    }\n\n    // Try to set a field that's above the allowed range.\n    let res = engine.set(\n        td0.clone(),\n        child_td,\n        0,\n        FieldType::InterruptVisibility,\n        (NB_INTERRUPTS + 2) as u64,\n        555,\n    );\n    assert_eq!(res, Err(CapaError::InvalidField));\n    // Same for get.\n    let res = engine.get(\n        td0.clone(),\n        child_td,\n        0,\n        FieldType::InterruptVisibility,\n        (NB_INTERRUPTS + 2) as u64,\n    );\n    assert_eq!(res, Err(CapaError::InvalidField));\n\n    // Let's try to see if we can overload the cores before sealing.\n    // This should work, but then we will see if when we attempt to seal.\n    engine\n        .set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::Cores,\n            0,\n            0b11111111111111111,\n        )\n        .unwrap();\n\n    let res = engine.seal(td0.clone(), child_td);\n    assert_eq!(res, Err(CapaError::InsufficientRights));\n\n    engine\n        .set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11)\n        .unwrap();\n    engine.seal(td0.clone(), child_td).unwrap();\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","engine.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_engine_create_root_and_simple_child() {\n    // Initial setup\n    let (mut engine, ref_td, ref_mem, ref_region) = setup_engine_with_root();\n\n    assert_eq!(Rc::strong_count(\u0026ref_td), 2);\n    assert_eq!(Rc::weak_count(\u0026ref_td), 1);\n    assert_eq!(Rc::strong_count(\u0026ref_mem), 2);\n\n    {\n        // Create a child.\n        let child_td = engine\n            .create(\n                \u0026ref_td.clone(),\n                1,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n\n        // Create some regions.\n        let ref_aliased = engine\n            .alias(\n                ref_td.clone(),\n                ref_region,\n                \u0026Access::new(0x0, 0x2000, Rights::READ | Rights::WRITE),\n            )\n            .unwrap();\n        let ref_carved = engine\n            .carve(\n                ref_td.clone(),\n                ref_region,\n                \u0026Access::new(\n                    0x2000,\n                    0x2000,\n                    Rights::READ | Rights::WRITE | Rights::EXECUTE,\n                ),\n            )\n            .unwrap();\n\n        // Send the region, this moves the references.\n        engine\n            .send(\n                ref_td.clone(),\n                child_td,\n                ref_aliased,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n        engine\n            .send(\n                ref_td.clone(),\n                child_td,\n                ref_carved,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n\n        // Seal\n        engine.seal(ref_td.clone(), child_td).unwrap();\n\n        // Print the root domain.\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RW_ for r1\n| Carve at 0x2000 0x4000 with RWX for r2\nr1 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n\n        assert_eq!(display, expected);\n        // Print the child domain.\n        let child = ref_td\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now hack the engine to make a new capability appear.\n        let phantom = Rc::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n            MemoryRegion {\n                kind: RegionKind::Carve,\n                status: MStatus::Exclusive,\n                access: Access::new(\n                    0x15000,\n                    0x20000,\n                    Rights::READ | Rights::WRITE | Rights::EXECUTE,\n                ),\n                attributes: Attributes::NONE,\n                remapped: Remapped::Identity,\n            },\n        )));\n        let ref_phantom = child\n            .borrow_mut()\n            .data\n            .install(CapaWrapper::Region(phantom));\n\n        // Now do the attestation again, we should see a region that is not reported.\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2,r3)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RW_ for r1\n| Carve at 0x2000 0x4000 with RWX for r2\nr1 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now display the children again.\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\nr2 = Exclusive 0x15000 0x35000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n        assert_eq!(display, expected);\n\n        // Remove the phantom.\n        _ = child.borrow_mut().data.remove(ref_phantom);\n\n        // Now we can revoke, let's first revoke one capa, then revoke the domain.\n        engine.revoke(ref_td.clone(), ref_region, 0).unwrap();\n\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x2000 0x4000 with RWX for r1\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 2-\u003er0\n\"#;\n        assert_eq!(display, expected);\n\n        engine.revoke(ref_td.clone(), child_td, 0).unwrap();\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n\n    assert_eq!(Rc::strong_count(\u0026ref_td), 2);\n    assert_eq!(Rc::weak_count(\u0026ref_td), 1);\n    assert_eq!(Rc::strong_count(\u0026ref_mem), 2);\n}\n\n#[test]\nfn test_engine_nested_child_revoke_td() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n    // Main logic.\n    let td0_td1 = {\n        // Let td LOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r2,r3)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x4000 with RWX mapped Identity\n| Carve at 0x2000 0x3000 with RWX for r2\n| Alias at 0x3000 0x4000 with RW_ for r3\nr1 = Aliased 0x5000 0x6000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr3 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Check td2\n        {\n            let display = format!(\n                \"{}\",\n                \u0026td0.borrow().children[0].borrow().children[0].borrow(),\n            );\n            let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr1 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Now we revoke td1 from td0.\n        engine.revoke(td0.clone(), td0_td1, 0).unwrap();\n        // Check td0\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n            assert_eq!(display, expected);\n\n            // Now check the structures.\n            assert_eq!(c_td0.children.len(), 0);\n            assert_eq!(c_td0.data.capabilities.capabilities.len(), 1);\n\n            let mem = c_td0\n                .data\n                .capabilities\n                .get(\u00261)\n                .unwrap()\n                .as_region()\n                .unwrap();\n            assert_eq!(mem.borrow() \n        }\n\n        // Now let's access td1 and create td2.\n        {\n            let td1 = \u0026td0.borrow().children[0];\n            let td1_td2 = engine\n                .create(\n                    \u0026td1.clone(),\n                    0b11,\n                    MonitorAPI::encapsulated(),\n                    \u0026InterruptPolicy::default_none(),\n                )\n                .unwrap();\n\n            // Now create the regions and send them.\n            let td1_carve = engine\n                .carve(td1.clone(), 1, \u0026Access::new(0x2000, 0x1000, Rights::all()))\n                .unwrap();\n            let td1_alias = engine\n                .alias(\n                    td1.clone(),\n                    1,\n                    \u0026Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_carve,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_alias,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine.seal(td1.clone(), td1_td2).unwrap();\n        }\n        td0_td1\n    };\n    // Let's check everything is well-formed.\n    {\n        // Check td0.\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2,r1,r2)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at ount(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_two_children_revoke_aliased_twice() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    {\n        // Let td0 create td1.\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n        // Let td0 create td2\n        let td0_td2 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        // Carve a region.\n        let td0_carve = engine\n            .carve(\n                td0.clone(),\n                td0_r0,\n                \u0026Access::new(0x0, 0x2000, Rights::all()),\n            )\n            .unwrap();\n\n        // Do two aliases.\n        let td0_alias_td1 = engine\n            .alias(\n                td0.clone(),\n                td0_carve,\n                \u0026Access::new(0x0, 0x2000, Rights::all()),\n            )\n            .unwrap();\n        let td0_alias_td2 = engine\n            .alias(\n                td0.clone(),\n                td0_carve,\n                \u0026Access::new(0x0, 0x1000, Rights::all()),\n            )\n            .unwrap();\n        // Send the capas.\n        engine\n            .send(\n                td0.clone(),\n                td0_td1,\n                td0_alias_td1,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n        engine\n            .send(\n                td0.clone(),\n                td0_td2,\n                td0_alias_td2,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n\n        // Seal the domains.\n        engine.seal(td0.clone(), td0_td1).unwrap();\n        engine.seal(td0.clone(), td0_td2).unwrap();\n\n        // Now check the output.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r2)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(r3)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x2000 with RWX for r1\nr1 = Exclusive 0x0 0x2000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RWX for r2\n| Alias at 0x0 0x1000 with RWX for r3\nr2 = Aliased 0x0 0x2000 with RWX mapped Identity\nr3 = Aliased 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2 4-\u003er1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke the carve.\n        engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n\n        // Now make sure the display is correct.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain()\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke both domains.\n        engine.revoke(td0.clone(), td0_td1, 0).unwrap();\n        engine.revoke(td0.clone(), td0_td2, 0).unwrap();\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_nested_domains_three_branches() {\n    // Initial setup\n    let (mut engine, td0, r0, _) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    let mut create_three_domains = |capa_me: \u0026CapaRef\u003cDomain\u003e| -\u003e Vec\u003cLocalCapa\u003e {\n        let mut handles: Vec\u003cLocalCapa\u003e = Vec::new();\n        for _i in 0..3 {\n            let local = engine\n                .create(\n                    \u0026capa_me.clone(),\n                    0x1,\n                    MonitorAPI::all(),\n                    \u0026InterruptPolicy::default_all(),\n                )\n                .unwrap();\n            handles.push(local);\n            engine.seal(capa_me.clone(), local).unwrap();\n        }\n        handles\n    };\n\n    {\n        let handles_td0 = create_three_domains(\u0026td0);\n        for child in \u0026td0.borrow().children {\n            let _ = create_three_domains(\u0026child);\n            for grandchild in \u0026child.borrow().children {\n                let _ = create_three_domains(\u0026grandchild);\n            }\n        }\n\n        // Now make sure everyone has three children.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,td3,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td4,td5,td6)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(td7,td8,td9)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd3 = Sealed domain(td10,td11,td12)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2 4-\u003etd3\n\"#;\n        assert_eq!(display, expected);\n\n        // Now attest each of the children.\n        for i in \u0026handles_td0 {\n            let child = td0\n                .borrow()\n                .data\n                .capabilities\n                .get(i)\n                .unwrap()\n                .as_domain()\n                .unwrap();\n            let display = format!(\"{}\", child.borrow());\n            let expected = r#\"td0 = Sealed domain(td1,td2,td3)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td4,td5,td6)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(td7,td8,td9)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd3 = Sealed domain(td10,td11,td12)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\n|indices: 1-\u003etd1 2-\u003etd2 3-\u003etd3\n\"#;\n            assert_eq!(display, expected);\n        }\n\n        // Now revoke them\n        for i in \u0026handles_td0 {\n            engine.revoke(td0.clone(), *i, 0).unwrap();\n        }\n\n        // Display td0\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_reclaim_from_grand_child() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    let carve = engine\n        .carve(\n            td0.clone(),\n            td0_r0,\n            \u0026Access::new(0x0, 0x1000, Rights::all()),\n        )\n        .unwrap();\n\n    {\n        let mut current: CapaRef\u003cDomain\u003e = td0.clone();\n        let mut to_send: LocalCapa = carve;\n        for _i in 0..5 {\n            let child = engine\n                .create(\n                    \u0026current.clone(),\n                    0b1,\n                    MonitorAPI::all(),\n                    \u0026InterruptPolicy::default_all(),\n                )\n                .unwrap();\n            engine.seal(current.clone(), child).unwrap();\n            engine\n                .send(\n                    current.clone(),\n                    child,\n                    to_send,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            // Update to point to the child.\n            let child_ref = current\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)\n                .unwrap()\n                .as_domain()\n                .unwrap();\n            current = child_ref;\n            to_send = 1;\n        }\n\n        // Now check the child that has the region.\n        let display = format!(\"{}\", current.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke from td0.\n        engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 3-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke the domains in cascade.\n        engine.revoke(td0.clone(), 3, 0).unwrap();\n\n        // Check it worked.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_policies_core_fail() {\n    // Initial setup\n    let (mut engine, td0, r0, _td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    // Let td0 create a domain and that domain try to gain more writes.\n    {\n        let mut api_without_send_rcv = MonitorAPI::all();\n        api_without_send_rcv.remove(MonitorAPI::SEND | MonitorAPI::RECEIVE);\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b1,\n                api_without_send_rcv,\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n        engine.seal(td0.clone(), td0_td1).unwrap();\n\n        // Now let the domain try to create a new one with more cores.\n        let td1 = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026td0_td1)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let td2_err = engine.create(\n            \u0026td1.clone(),\n            0x2,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_all(),\n        );\n        assert!(td2_err.is_err());\n\n        // Now let's try the wrong interrupt policies.\n        let td1_td2 = engine\n            .create(\n                \u0026td1.clone(),\n                0b1,\n                api_without_send_rcv,\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        assert!(engine.seal(td1.clone(), td1_td2).is_err());\n\n        // Now let's try the wrong api policies.\n        engine.revoke(td1.clone(), td1_td2, 0).unwrap();\n        let td1_td2 = engine\n            .create(\n                \u0026td1.clone(),\n                0b1,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n\n        assert!(engine.seal(td1.clone(), td1_td2).is_err());\n    }\n}\n\n#[test]\nfn test_engine_alias_then_carve_root() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n    let err = engine.carve(td0.clone(), td0_r0, \u0026access);\n    assert!(err.is_err());\n\n    // Try to alias it a second time.\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n\n    // Do the display.\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x1000 with RWX for r1\n| Alias at 0x0 0x1000 with RWX for r2\nr1 = Aliased 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n    assert_eq!(display, expected);\n}\n\n#[test]\nfn test_engine_alias_carve_root() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let carve = engine.carve(td0.clone(), td0_r0, \u0026access).unwrap();\n    let err = engine.alias(td0.clone(), td0_r0, \u0026access);\n    assert!(err.is_err());\n\n    // Try to alias it a second time.\n    let carve2 = engine.carve(td0.clone(), td0_r0, \u0026access);\n    assert!(carve2.is_err());\n\n    // Carve the carve.\n    engine.carve(td0.clone(), carve, \u0026access).unwrap();\n\n    // Do the display.\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r2\nr2 = Exclusive 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n    assert_eq!(display, expected);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","local_client.rs"],"content":"use capa_engine::client::engine::Engine;\nuse capa_engine::client::local_client::LocalClient;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup() -\u003e Engine\u003cLocalClient\u003e {\n    let engine = Engine::\u003cLocalClient\u003e::new(16);\n\n    let root_region = create_root_region();\n    let root_region2 = create_root_region();\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_mem2 = Rc::new(RefCell::new(root_region2));\n    let _ = engine\n        .platform\n        .server\n        .add_root_region(\u0026engine.platform.current.clone(), \u0026ref_mem)\n        .unwrap();\n    // Cheat to add a root region for client engine.\n    let _ = engine\n        .add_root_region(\u0026engine.current.clone(), \u0026ref_mem2)\n        .unwrap();\n    engine\n}\n\n#[test]\nfn test_client_create() {\n    let mut client = setup();\n\n    // Check that the initial attesttion is correct.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Create and attest again.\n    let child_td = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Unsealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Seal it and attest again.\n    client.r_seal(\u0026child_td).unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n}\n\n#[test]\nfn test_client_alias() {\n    let mut client = setup();\n\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x0,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x1000 with RW_ for r1\nr1 = Aliased 0x0 0x1000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Check r1 is correct too.\n    let display = format!(\"{}\", r1.borrow());\n    let expected = \"Aliased 0x0 0x1000 with RW_ mapped Identity\";\n    assert_eq!(display, expected)\n}\n\n#[test]\nfn test_client_carve() {\n    let mut client = setup();\n\n    // We have only one region.\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_carve(\n            \u0026r0.clone(),\n            0x0,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RW_ for r1\nr1 = Exclusive 0x0 0x1000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Check r1 is correct too.\n    let display = format!(\"{}\", r1.borrow());\n    let expected = \"Exclusive 0x0 0x1000 with RW_ mapped Identity\";\n    assert_eq!(display, expected)\n}\n\n#[test]\nfn test_client_child_alias_carve() {\n    let mut client = setup();\n\n    // We have only one region.\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_carve(\u0026r0.clone(), 0x0, 0x1000, Rights::all().bits())\n        .unwrap();\n\n    let r2 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x1000,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    let td1 = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n\n    client\n        .r_send(\u0026td1.clone(), \u0026r1, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client\n        .r_send(\u0026td1.clone(), \u0026r2, Remapped::Identity, Attributes::empty())\n        .unwrap();\n\n    client.r_seal(\u0026td1.clone()).unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\n|indices: 1-\u003er0 4-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Try the revoke.\n fffffffff, w: 0xffffffffffffffff\ntd2 = Sealed domain(r3,r4,r5)\n|cores: 0x2\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\n| Alias at 0x1000 0x2000 with RW_ for r3\n| Carve at 0x2000 0x3000 with RWX for r4\n| Alias at 0x5000 0x6000 with RWX for r5\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr3 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr4 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr5 = Aliased 0x5000 0x6000 with RWX mapped Identity\n|indices: 1-\u003er0 6-\u003etd1 7-\u003etd2\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Now revoke the r5 child.\n    client.r_revoke_region(\u0026r5).unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\ntd2 = Sealed domain(r3,r4)\n|cores: 0x2\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\n| Alias at 0x1000 0x2000 with RW_ for r3\n| Carve at 0x2000 0x3000 with RWX for r4\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr3 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr4 = Exclusive 0x2000 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 6-\u003etd1 7-\u003etd2\n\"#;\n    assert_eq!(attestation, expected);\n    // Check locally\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Now revoke everything.\n    client.r_revoke_child(\u0026td2).unwrap();\n    client.r_revoke_child(\u0026td1).unwrap();\n\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n    // Check the local state.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n}\n\n#[test]\nfn test_client_exercise_set_get() {\n    let mut client = setup();\n\n    let td1 = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n\n    // Change cores.\n    client\n        .r_set(\u0026td1.clone(), 0, FieldType::Cores, 0, 0x22)\n        .unwrap();\n    // Get it and check.\n    let v = client.r_get(\u0026td1.clone(), 0, FieldType::Cores, 0).unwrap();\n    assert_eq!(v, 0x22);\n\n    // Check local and remote attestation.\n    let attestation = format!(\"{}\", td1.borrow());\n    let expected = r#\"td0 = Unsealed domain()\n|cores: 0x22\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\n\"#;\n    assert_eq!(attestation, expected);\n    let attestation = client.r_attest(Some(\u0026td1.clone())).unwrap();\n    assert_eq!(attestation, expected);\n\n    // Change the monitor API.\n    client\n        .r_set(\n            \u0026td1.clone(),\n            0,\n            FieldType::Api,\n            0,\n            MonitorAPI::RECEIVE.bits() as u64,\n        )\n        .unwrap();\n    // Get it and check.\n    let v = client.r_get(\u0026td1.clone(), 0, FieldType::Api, 0).unwrap();\n    assert_eq!(v, MonitorAPI::RECEIVE.bits() as u64);\n\n    // Check local and remote attestation.\n    let attestation =

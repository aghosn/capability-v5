voke_child(\u0026c).unwrap();\n        child = client.find_child(|_x| true);\n    }\n\n    // Attest everything is good.\n    let attestation = format!(\"{}\", client.current.borrow());\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n\n    let attestation = client.r_attest(None).unwrap();\n    assert_eq!(attestation, expected);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","memory_region.rs"],"content":"use capa_engine::core::capability::*;\nuse capa_engine::core::memory_region::*;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\n#[test]\nfn test_valid_carve() {\n    let mut root = create_root();\n    let access = Access::new(0x2000, 0x1000, Rights::READ | Rights::WRITE);\n    let result = root.carve(\u0026access);\n    assert!(result.is_ok());\n\n    let carved = result.unwrap();\n    let carved_borrow = carved.borrow();\n\n    assert_eq!(carved_borrow.data.kind, RegionKind::Carve);\n    assert_eq!(carved_borrow.data.status, Status::Exclusive);\n    assert_eq!(carved_borrow.data.access, access);\n}\n\n#[test]\nfn test_valid_alias() {\n    let mut root = create_root();\n    let access = Access::new(0x2000, 0x1000, Rights::READ);\n    let result = root.alias(\u0026access);\n    assert!(result.is_ok());\n\n    let alias = result.unwrap();\n    let alias_borrow = alias.borrow();\n\n    assert_eq!(alias_borrow.data.kind, RegionKind::Alias);\n    assert_eq!(alias_borrow.data.status, Status::Aliased);\n    assert_eq!(alias_borrow.data.access, access);\n}\n\n#[test]\nfn test_carve_overlap_rejected() {\n    let mut root = create_root();\n\n    let c1 = Access::new(0x2000, 0x1000, Rights::READ);\n    assert!(root.carve(\u0026c1).is_ok());\n\n    // Overlaps with previous carve\n    let overlapping = Access::new(0x2800, 0x1000, Rights::READ);\n    let result = root.carve(\u0026overlapping);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_alias_overlap_with_carve_rejected() {\n    let mut root = create_root();\n\n    let c1 = Access::new(0x3000, 0x1000, Rights::READ);\n    assert!(root.carve(\u0026c1).is_ok());\n\n    // Aliases are no longer possible\n    let a1 = Access::new(0x3000, 0x1000, Rights::READ);\n    let result = root.alias(\u0026a1);\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_carve_out_of_bounds() {\n    let mut root = create_root();\n\n    // Beyond the root region\n    let access = Access::new(0x20000, 0x1000, Rights::READ);\n    let result = root.carve(\u0026access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_alias_with_extra_rights_rejected() {\n    let mut root = create_root();\n\n    // Root does not give WRITE or EXECUTE\n    root.data.access.rights = Rights::READ;\n\n    let access = Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE);\n    let result = root.alias(\u0026access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n// ——————————————————————————— Nested operations ———————————————————————————— //\n\n#[test]\nfn test_nested_carve() {\n    let mut root = create_root();\n\n    // Carve a sub-region from the root\n    let c1_access = Access::new(0x2000, 0x4000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026c1_access).expect(\"root carve failed\");\n\n    // Carve from the carved region\n    let mut c1_borrow = c1.borrow_mut();\n    let c2_access = Access::new(0x3000, 0x1000, Rights::READ);\n    let c2 = c1_borrow.carve(\u0026c2_access).expect(\"nested carve failed\");\n\n    let c2_borrow = c2.borrow();\n    assert_eq!(c2_borrow.data.access, c2_access);\n    assert_eq!(c2_borrow.data.status, Status::Exclusive);\n    assert_eq!(c2_borrow.data.kind, RegionKind::Carve);\n    assert_eq!(c2_borrow.data.remapped, Remapped::Identity);\n}\n\n#[test]\nfn test_nested_alias() {\n    let mut root = create_root();\n\n    let c1_access = Access::new(0x1000, 0x2000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026c1_access).expect(\"carve failed\");\n\n    let mut c1_borrow = c1.borrow_mut();\n    let a1_access = Access::new(0x1800, 0x800, Rights::READ);\n    let a1 = c1_borrow\n        .alias(\u0026a1_access)\n        .expect(\"alias from carve failed\");\n\n    let a1_borrow = a1.borrow();\n    assert_eq!(a1_borrow.data.kind, RegionKind::Alias);\n    assert_eq!(a1_borrow.data.status, Status::Aliased);\n    assert_eq!(a1_borrow.data.access, a1_access);\n}\n\n#[test]\nfn test_nested_carve_invalid_due_to_rights() {\n    let mut root = create_root();\n\n    let carve_access = Access::new(0x0, 0x4000, Rights::READ);\n    let carve = root.carve(\u0026carve_access).expect(\"carve failed\");\n\n    let mut carve_borrow = carve.borrow_mut();\n\n    // Request WRITE, which is not present in parent\n    let invalid_access = Access::new(0x1000, 0x1000, Rights::WRITE);\n    let result = carve_borrow.carve(\u0026invalid_access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_nested_alias_invalid_due_to_overlap() {\n    let mut root = create_root();\n\n    let carve_1 = root\n        .carve(\u0026Access::new(0x2000, 0x2000, Rights::READ))\n        .expect(\"carve_1 failed\");\n    let carve_2 = root\n        .carve(\u0026Access::new(0x4000, 0x2000, Rights::READ))\n        .expect(\"carve_2 failed\");\n\n    let mut carve_1_borrow = carve_1.borrow_mut();\n    let alias_1_access = Access::new(0x2000, 0x1000, Rights::READ);\n    let alias_1 = carve_1_borrow\n        .alias(\u0026alias_1_access)\n        .expect(\"alias_1 creation failed\");\n\n    {\n        let alias_1_borrow = alias_1.borrow();\n        assert_eq!(alias_1_borrow.data.access, alias_1_access);\n        assert_eq!(alias_1_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_1_borrow.data.status, Status::Aliased);\n    }\n\n    let mut carve_2_borrow = carve_2.borrow_mut();\n    let alias_2_access = Access::new(0x4000, 0x1000, Rights::READ);\n    let alias_2 = carve_2_borrow\n        .alias(\u0026alias_2_access)\n        .expect(\"alias_2 creation failed\");\n\n    {\n        let alias_2_borrow = alias_2.borrow();\n        assert_eq!(alias_2_borrow.data.access, alias_2_access);\n        assert_eq!(alias_2_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_2_borrow.data.status, Status::Aliased);\n    }\n}\n\n#[test]\nfn test_carve_then_alias_then_carve() {\n    let mut root = create_root();\n\n    // Step 1: Carve a region from the root\n    let carved = root\n        .carve(\u0026Access::new(0x2000, 0x2000, Rights::READ | Rights::WRITE))\n        .expect(\"Carving from root failed\");\n\n    // Step 2: Alias the carved region\n    let alias_access = Access::new(0x2000, 0x1000, Rights::READ);\n    let alias = carved\n        .borrow_mut()\n        .alias(\u0026alias_access)\n        .expect(\"Aliasing carved region failed\");\n\n    // Check alias kind and status\n    {\n        let alias_borrow = alias.borrow();\n        assert_eq!(alias_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_borrow.data.status, Status::Aliased);\n    }\n\n    // Step 3: Carve from the alias\n    let carve_from_alias_access = Access::new(0x2000, 0x0800, Rights::READ);\n    let carved_from_alias = alias\n        .borrow_mut()\n        .carve(\u0026carve_from_alias_access)\n        .expect(\"Carving from alias failed\");\n\n    // Check carve kind and status\n    {\n        let carved_borrow = carved_from_alias.borrow();\n        assert_eq!(carved_borrow.data.kind, RegionKind::Carve);\n        assert_eq!(carved_borrow.data.status, Status::Aliased); // inherits from parent\n    }\n}\n\n// ——————————————————————————————— Revocation ——————————————————————————————— //\n\n#[test]\nfn test_revoke_single_node() {\n    let mut root = create_root();\n\n    // Create a simple child node under the root\n    let child = root\n        .carve(\u0026Access::new(0x1000, 0x2000, Rights::READ | Rights::WRITE))\n        .unwrap();\n\n    // Track revoked nodes\n    let mut seen = Vec::new();\n\n    // Revoke the child node\n    let revoked = root.revoke_child(\u0026child, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n        seen.push(c.data.access.start);\n        Ok(())\n    });\n\n    // Check that the revocation was successful\n    assert!(revoked.is_ok());\n\n    // Check that the callback was called with the correct access start address\n    assert_eq!(seen, vec![0x1000]);\n\n    // Check that the child node is now removed\n    assert_eq!(root.children.len(), 0);\n}\n\n#[test]\nfn test_revoke_complex_subtree() {\n    let mut root = create_root();\n\n    // Branch 1\n    let b1 = root\n        .carve(\u0026Access::new(0x0000, 0x4000, Rights::READ | Rights::WRITE))\n        .unwrap();\n    let b1a = b1\n        .borrow_mut()\n        .alias(\u0026Access::new(0x1000, 0x1000, Rights::READ))\n        .unwrap();\n    let _b1a1 = b1a\n        .borrow_mut()\n        .carve(\u0026Access::new(0x1000, 0x0800, Rights::READ))\n        .unwrap();\n\n    // Branch 2 (will not be revoked)\n    let _b2 = root\n        .carve(\u0026Access::new(0x5000, 0x1000, Rights::READ))\n        .unwrap();\n\n    // Track revoked nodes\n    let mut seen = Vec::new();\n\n    //let data = b1a.borrow().data;\n    // Revoke b1a\n    let revoked = b1\n        .borrow_mut()\n        .revoke_child(\u0026b1a, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            seen.push((\n                c.data.kind.clone(),\n                c.data.status.clone(),\n                c.data.access.start,\n            ));\n            Ok(())\n        });\n\n    // Check the callback was called for b1a1 then b1a\n    assert!(revoked.is_ok());\n    assert_eq!(seen.len(), 2);\n    assert!(seen.contains(\u0026(RegionKind::Carve, Status::Aliased, 0x1000)));\n    assert!(seen.contains(\u0026(RegionKind::Alias, Status::Aliased, 0x1000)));\n\n    // b1 should still be there, but now empty\n    assert_eq!(b1.borrow().children.len(), 0);\n\n    // b2 should still exist\n    assert_eq!(root.children.len(), 2);\n    let b2_found = root\n        .children\n        .iter()\n        .any(|c| c.borrow().data.access.start == 0x5000);\n    assert!(b2_found);\n}\n\n#[test]\nfn test_revoke_deep_leaf_order() {\n    let mut root = create_root();\n\n    let c1 = root\n        .carve(\u0026Access::new(0x0000, 0x8000, Rights::READ | Rights::WRITE))\n        .unwrap();\n    let c2 = c1\n        .borrow_mut()\n        .carve(\u0026Access::new(0x1000, 0x4000, Rights::READ))\n        .unwrap();\n    let c3 = c2\n        .borrow_mut()\n        .alias(\u0026Access::new(0x2000, 0x1000, Rights::READ))\n        .unwrap();\n    let _c4 = c3\n        .borrow_mut()\n        .carve(\u0026Access::new(0x2000, 0x0800, Rights::READ))\n        .unwrap();\n\n    let mut seen = Vec::new();\n\n    let res = c2\n        .borrow_mut()\n        .revoke_child(\u0026c3, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            seen.push(c.data.access.start);\n            Ok(())\n        });\n    assert!(res.is_ok());\n\n    // Order of callback: c4 then c3\n    assert_eq!(seen, vec![0x2000, 0x2000]);\n    assert_eq!(c2.borrow().children.len(), 0);\n}\n\n#[test]\nfn test_revoke_nonexistent() {\n    let mut root = create_root();\n\n    // Create a valid region in the root.\n    let _valid_region = root\n        .carve(\u0026Access::new(0x0000, 0x1000, Rights::READ | Rights::WRITE))\n        .unwrap();\n\n    // Create a dummy region that doesn't exist in the children\n    let dummy_region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0xDEAD, 0x100, Rights::READ),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    // Try to revoke the dummy region, which doesn't exist as a child\n    let result = root.revoke_child(\n        \u0026Rc::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(dummy_region))),\n        \u0026mut |_c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            panic!(\"Callback should not run on nonexistent revoke\");\n        },\n    );\n\n    // Assert that the result is an error, indicating that the child was not found\n    assert_eq!(result, Err(CapaError::ChildNotFound));\n\n    // Ensure the valid_region is still present\n    let valid_region_found = root\n        .children\n        .iter()\n        .any(|c| c.borrow().data.access.start == 0x0000);\n    assert!(valid_region_found);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","parser.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::core::parser::Parser;\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_parse_simple_td0() {\n    // Initial setup\n    let (_engine, td0, _r0, _td0_r0) = setup_engine_with_root();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(display, expected);\n\n    // Now parse the attestation.\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    // Now print td0 from the parser\n    let reconstructed_td0 = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", reconstructed_td0.borrow());\n    assert_eq!(display, expected);\n}\n\n#[test]\nfn test_parse_with_alias() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    // Let's create some regions.\n    let alias_access = Access::new(0x0, 0x3000, Rights::all());\n\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026alias_access).unwrap();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x3000 with RWX for r1\nr1 = Aliased 0x0 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(display, expected);\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_recon = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_recon.borrow());\n    assert_eq!(display, expected);\n\n    // Do some reconstruction checks.\n    let r1 = parser.regions.get(\"r1\").unwrap();\n    assert_eq!(r1.borrow().data.kind, RegionKind::Alias);\n    assert_eq!(r1.borrow().data.status, MStatus::Aliased);\n    assert_eq!(r1.borrow().owned.handle, 2);\n}\n\n#[test]\nfn test_parse_with_carve() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    // Let's create some regions.\n    let carve_access = Access::new(0x0, 0x3000, Rights::all());\n\n    let _carve = engine.carve(td0.clone(), td0_r0, \u0026carve_access).unwrap();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x3000 with RWX for r1\nr1 = Exclusive 0x0 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(display, expected);\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_recon = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_recon.borrow());\n    assert_eq!(display, expected);\n\n    // Do some reconstruction checks.\n    let r1 = parser.regions.get(\"r1\").unwrap();\n    assert_eq!(r1.borrow().data.kind, RegionKind::Carve);\n    assert_eq!(r1.borrow().data.status, MStatus::Exclusive);\n    assert_eq!(r1.borrow().owned.handle, 2);\n}\n\n#[test]\nfn test_parse_with_td1() {\n    // Initial setup\n    let (mut engine, td0, _r0, _td0_r0) = setup_engine_with_root();\n\n    // Let's create a child domain.\n    let td1 = engine\n        .create(\n            \u0026td0.clone(),\n            0b1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_all(),\n        )\n        .unwrap();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Unsealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(display, expected);\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_recon = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_recon.borrow());\n    assert_eq!(display, expected);\n\n    // Do some reconstruction checks.\n    let r1 = parser.domains.get(\"td1\").unwrap();\n    assert_eq!(r1.borrow().data.status, Status::Unsealed);\n    assert_eq!(r1.borrow().owned.handle, 2);\n\n    // Now seal it.\n    engine.seal(td0.clone(), td1).unwrap();\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(display, expected);\n    assert_eq!(display, expected);\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_recon = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_recon.borrow());\n    assert_eq!(display, expected);\n    // Do some reconstruction checks.\n    let r1 = parser.domains.get(\"td1\").unwrap();\n    assert_eq!(r1.borrow().data.status, Status::Sealed);\n    assert_eq!(r1.borrow().owned.handle, 2);\n}\n\n#[test]\nfn test_parse_with_td1_and     let c_access = Access::new(0x1000, 0x2000, Rights::all());\n    let carved = engine.carve(td0.clone(), td0_r0, \u0026c_access).unwrap();\n\n    let a_access = Access::new(0x3000, 0x1000, Rights::all());\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026a_access).unwrap();\n\n    // Create a child domain.\n    let ipolicy = InterruptPolicy::default_none();\n\n    let td1 = engine\n        .create(\u0026td0.clone(), 0b1, MonitorAPI::empty(), \u0026ipolicy)\n        .unwrap();\n    engine\n        .send(\n            td0.clone(),\n            td1,\n            carved,\n            Remapped::Remapped(0x0),\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine\n        .send(\n            td0.clone(),\n            td1,\n            alias,\n            Remapped::Remapped(0x2000),\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine.seal(td0.clone(), td1).unwrap();\n\n    // Check the display\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x1000 0x3000 with RWX for r1\n| Alias at 0x3000 0x4000 with RWX for r2\nr1 = Exclusive 0x1000 0x3000 with RWX mapped Remapped(0x0)\nr2 = Aliased 0x3000 0x4000 with RWX mapped Remapped(0x2000)\n|indices: 1-\u003er0 4-\u003etd1\n\"#;\n    assert_eq!(display, expected);\n\n    // Now parse.\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_r = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_r.borrow());\n    assert_eq!(display, expected);\n}\n\n#[test]\nfn test_invalid_td0() {\n    let _correct = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, for .1\"#;\n    assert_eq!(enumeration, expected);\n\n    // Revoke the first.\n    engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n    let enumeration = engine.enumerate(td0.clone(), td0_r0).unwrap();\n    let expected = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x3000 0x4000 with RW_ for .0\"#;\n    assert_eq!(enumeration, expected);\n\n    // Enumerate the local capa indices.\n    let attestation = engine.attest(td0.clone(), None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Unsealed domain()\n|cores: 0x1\n|mon.api: 0x0\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x3000 0x4000 with RW_ for r1\nr1 = Exclusive 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 4-\u003er1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Send the region to td1.\n    engine\n        .send(\n            td0.clone(),\n            td1,\n            r2,\n            Remapped::Identity,\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine.revoke(td0.clone(), td1, 0).unwrap();\n\n    // Check we got back to the expected configuration.\n    let attestation = engine.attest(td0.clone(), None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","remapper.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStat y,\n    )];\n    assert_eq!(view, expected);\n}\n\n#[test]\nfn test_remap_illegal() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    // Create a child.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // Create a region and send it with a remap\n    let alias_access = Access::new(0x0, 0x2000, Rights::all());\n    let alias2_access = Access::new(0x0, 0x1000, Rights::all());\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026alias_access).unwrap();\n    let alias2 = engine.alias(td0.clone(), td0_r0, \u0026alias2_access).unwrap();\n\n    // Send them with a remap.\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias,\n            Remapped::Remapped(0x10000),\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias2,\n            Remapped::Remapped(0x10000),\n            Attributes::empty(),\n        )\n        .unwrap();\n    let res = engine.send(\n        td0.clone(),\n        child_td,\n        alias2,\n        Remapped::Remapped(0x11000),\n        Attributes::empty(),\n    );\n    assert!(res.is_err());\n\n    // Seal the child.\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    // Check revoking makes all things good.\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    let view = td0.borrow().view().unwrap();\n    let expected = vec![ViewRegion::new(\n        Access::new(0x0, 0x10000, Rights::all()),\n        Remapped::Identity,\n    )];\n    assert_eq!(view, expected);\n}\n\n#[test]\nfn test_remap_illegal_in_hole() {\n    // Initial setup\n :REVOKE =\u003e ClientResult::wrap_empty(self.server.revoke(\n                self.current.clone(),\n                args[0] as LocalCapa,\n                args[1],\n            )),\n            CallInterface::ENUMERATE =\u003e ClientResult::wrap_string(\n                self.server\n                    .enumerate(self.current.clone(), args[0] as LocalCapa),\n            ),\n        }\n    }\n\n    // This is local, we do not care about the receive.\n    fn receive(\n        \u0026mut self,\n        call: crate::CallInterface,\n        args: \u0026[u64; 6],\n    ) -\u003e Result\u003cClientResult, ClientError\u003e {\n        self.send(call, args)\n    }\n}\n","traces":[{"line":23,"address":[521762,521280,521768],"length":1,"stats":{"Line":7}},{"line":24,"address":[754940],"length":1,"stats":{"Line":7}},{"line":26,"address":[521355,521467],"length":1,"stats":{"Line":7}},{"line":27,"address":[521455],"length":1,"stats":{"Line":7}},{"line":28,"address":[521493],"length":1,"stats":{"Line":7}},{"line":30,"address":[521552],"length":1,"stats":{"Line":7}},{"line":31,"address":[521582],"length":1,"stats":{"Line":7}},{"line":32,"address":[521637],"length":1,"stats":{"Line":7}},{"line":39,"address":[522835,522829,521792],"length":1,"stats":{"Line":1}},{"line":45,"address":[521871],"length":1,"stats":{"Line":2}},{"line":47,"address":[522012,522856],"length":1,"stats":{"Line":2}},{"line":48,"address":[756802,756704],"length":1,"stats":{"Line":5}},{"line":49,"address":[522916],"length":1,"stats":{"Line":2}},{"line":50,"address":[522949],"length":1,"stats":{"Line":2}},{"line":51,"address":[522965],"length":1,"stats":{"Line":2}},{"line":53,"address":[522982],"length":1,"stats":{"Line":2}},{"line":54,"address":[523029],"length":1,"stats":{"Line":2}},{"line":58,"address":[523166,522112],"length":1,"stats":{"Line":1}},{"line":59,"address":[523412,523318],"length":1,"stats":{"Line":2}},{"line":60,"address":[523226],"length":1,"stats":{"Line":1}},{"line":61,"address":[523259],"length" ub struct Capability\u003cT\u003e {\n    pub owned: Ownership,\n    pub data: T,\n    pub parent: WeakRef\u003cT\u003e,\n    pub children: Vec\u003cCapaRef\u003cT\u003e\u003e,\n}\n\n/// Capability errors.\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub enum CapaError {\n    InvalidAccess,\n    InvalidAttributes,\n    ChildNotFound,\n    InvalidLocalCapa,\n    WrongCapaType,\n    CallNotAllowed,\n    DomainUnsealed,\n    DomainSealed,\n    InsufficientRights,\n    InvalidChildCapa,\n    CapaNotOwned,\n    RevokeOnRootCapa,\n    DoubleRemapping,\n    IncompatibleRemap,\n    InvalidField,\n    InvalidValue,\n    // For parsing\n    ParserDomain,\n    ParserRegion,\n    ParserStatus,\n    ParserMonitor,\n    ParserCapability,\n    // Platform related issues\n    PlatformState,\n}\n\n/// Have to implement it by hand because Weak does not support PartialEq\nimpl\u003cT: PartialEq\u003e PartialEq for Capability\u003cT\u003e {\n    fn eq(\u0026self, other: \u0026Self) -\u003e bool {\n        Weak::ptr_eq(\u0026self.owned.owner, \u0026other.owned.owner)\n            \u0026\u0026 self.data == other.data\n            \u0026\u0026 self.children == other.children\n    }\n}\n\nimpl\u003cT\u003e Capability\u003cT\u003e\nwhere\n    T: PartialEq,\n{\n    pub fn add_child(\u0026mut self, child: CapaRef\u003cT\u003e, owner: WeakRef\u003cDomain\u003e) {\n        {\n            child.borrow_mut().owned = Ownership::new(owner, 0);\n        }\n        self.children.push(child)\n    }\n\n    pub fn revoke_node\u003cF\u003e(node: CapaRef\u003cT\u003e, on_revoke: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        let parent = {\n            let borrowed = node.borrow();\n            borrowed\n                .parent\n                .upgrade()\n                .ok_or(CapaError::RevokeOnRootCapa)?\n        };\n\n        parent.borrow_mut().revoke_child(\u0026node, on_revoke)?;\n        Ok(())\n    }\n\n    pub fn revoke_child\u003cF\u003e(\n        \u0026mut self,\n        child: \u0026CapaRef\u003cT\u003e,\n        on_revoke: \u0026mut F,\n    ) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        if let Some(pos) = self.children.iter().position(|c| Rc::ptr_eq(c, child)) {\n            // Safely remove the child and pass it for revocation\n            let child = self.children.remove(pos);\n            // Remove the backward edge to the parent.\n            child.borrow_mut().parent = WeakRef::new();\n            child.borrow_mut().revoke_all(on_revoke)?;\n            Ok(())\n        } else {\n            Err(CapaError::ChildNotFound)\n        }\n    }\n\n    pub fn revoke_all\u003cF\u003e(\u0026mut self, on_revoke: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026mut Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for c in \u0026self.children {\n            let child = \u0026mut c.borrow_mut();\n            child.parent = WeakRef::new();\n            child.revoke_all(on_revoke)?;\n        }\n        self.children = Vec::new();\n        // Remove the node from its parent.\n        on_revoke(self)\n    }\n\n    pub fn dfs\u003cF\u003e(\u0026self, visit: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026Capability\u003cT\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        visit(self)?;\n        for c in \u0026self.children {\n            c.borrow().dfs(visit)?;\n        }\n        Ok(())\n    }\n}\n\n// ———————————————————— Region Capability implementation ———————————————————— //\nimpl Capability\u003cMemoryRegion\u003e {\n    pub fn new(region: MemoryRegion) -\u003e Self {\n        Capability::\u003cMemoryRegion\u003e {\n            owned: Ownership::empty(),\n            data: region,\n            parent: WeakRef::new(),\n            children: Vec::new(),\n        }\n    }\n\n    pub fn alias(\u0026mut self, access: \u0026Access) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        self.alias_carve_logic(access, RegionKind::Alias)\n    }\n\n    pub fn carve(\u0026mut self, access: \u0026Access) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        self.alias_carve_logic(access, RegionKind::Carve)\n    }\n\n    pub fn alias_carve_logic(\n        \u0026mut self,\n        access: \u0026Access,\n        kind_op: RegionKind,\n    ) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        //TODO: bug should not be able to carve an aliased region.\n        if !self.contained(access, kind_op == RegionKind::Carve) {\n            return Err(CapaError::InvalidAccess);\n        }\n        // Compute the remapping\n        let remapping = match self.data.remapped {\n            Remapped::Identity =\u003e Remapped::Identity,\n            Remapped::Remapped(s) =\u003e {\n                Remapped::Remapped(s + (access.start - self.data.access.start))\n            }\n        };\n        // Compute the status: alias -\u003e aliased, carve inherit\n        let status_obtained = if kind_op == RegionKind::Alias {\n            Status::Aliased\n        } else {\n            self.data.status\n        };\n        // Create the region\n        let region = MemoryRegion {\n            kind: kind_op,\n            status: status_obtained,\n            access: *access,\n            // A new region has no attributes.\n            attributes: Attributes::NONE,\n            remapped: remapping,\n        };\n        let new_capa = Self::new(region);\n        let reference = Rc::new(RefCell::new(new_capa));\n        self.add_child(reference.clone(), Weak::new());\n        Ok(reference)\n    }\n\n    pub fn view(\u0026self) -\u003e Vec\u003cViewRegion\u003e {\n        let mut views = Vec::new();\n        // This is the range we consider.\n        let mut start = self.data.access.start;\n\n        // Constants.\n        let base = self.data.access.start;\n\n        // Children are sorted.\n        let mut sorted = self.children.clone();\n        sorted.sort_by(|a, b| {\n            a.borrow()\n                .data\n                .access\n                .start\n                .cmp(\u0026b.borrow().data.access.start)\n        });\n        for c in sorted {\n            let c_borrow = c.borrow();\n            // We do not care\n            if c_borrow.data.kind == RegionKind::Alias {\n                continue;\n            }\n            // It is a carve, the segment loses access.\n            if start \u003c= c_borrow.data.access.start {\n                let r = match self.data.remapped {\n                    Remapped::Identity =\u003e Remapped::Identity,\n                    Remapped::Remapped(x) =\u003e Remapped::Remapped(x + (start - base)),\n                };\n                if c_borrow.data.access.start != start {\n                    views.push(ViewRegion {\n                        access: Access {\n                            start,\n                            size: (c_borrow.data.access.start - start),\n                            rights: self.data.access.rights,\n                        },\n                        remap: r,\n                    });\n                }\n                start = c_borrow.data.access.end();\n            }\n        }\n        if start \u003c self.data.access.end() {\n            let r = match self.data.remapped {\n                Remapped::Identity =\u003e Remapped::Identity,\n                Remapped::Remapped(x) =\u003e Remapped::Remapped(x + (start - base)),\n            };\n            views.push(ViewRegion {\n                access: Access {\n                    start,\n                    size: self.data.access.end() - start,\n                    rights: self.data.access.rights,\n                },\n                remap: r,\n            });\n        }\n\n        views\n    }\n\n    // Does not remove the carved.\n    // This is used to check for compatible sends.\n    pub fn view_raw(\u0026self) -\u003e Vec\u003cViewRegion\u003e {\n        vec![ViewRegion::new(self.data.access, self.data.remapped)]\n    }\n\n    pub fn contained(\u0026self, access: \u0026Access, strict: bool) -\u003e bool {\n        // Easy case, it's not even contained without considering children.\n        if !access.contained(\u0026self.data.access) {\n            return false;\n        }\n        // Now see if it's carved.\n        let children = \u0026self.children;\n        for c in children {\n            if !strict \u0026\u0026 c.borrow().data.kind == RegionKind::Alias {\n                continue;\n            }\n            if c.borrow().data.access.intersect(access) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    // We should implement two on_revoke.\n    // One will do the dfs, the other will consider local changes\n    pub fn on_revoke(\u0026self, operation: \u0026mut OperationUpdate) -\u003e Result\u003c(), CapaError\u003e {\n        // Simple per node visit to collect attributes.\n        let mut visit = |capa: \u0026Capability\u003cMemoryRegion\u003e| -\u003e Result\u003c(), CapaError\u003e {\n            // This algorithm is a bit complicated so here is the explanation.\n            // we go top to bottom dfs style, so technically if the parent was visited,\n            // we do not need to do a reenable in the case of a carve.\n            // In the case of an alias, it will be merged within the updates for the domain\n            // as they are subsets of each other.\n            if capa.data.attributes.contains(Attributes::VITAL) {\n                operation.add(Update::Revoke {\n                    dom: capa.owned.owner.clone(),\n                });\n            }\n            if capa.data.attributes.contains(Attributes::CLEAN) {\n                operation.add(Update::Clean {\n                    start: capa.data.access.start,\n                    size: capa.data.access.size,\n                });\n            }\n            // We lose this access.\n            operation.add(Update::ChangeMemory {\n                dom: capa.owned.owner.clone(),\n            });\n\n            // For a carve the parent is affected as well.\n            if capa.data.kind == RegionKind::Carve {\n                if let Some(parent) = capa.parent.upgrade() {\n                    operation.add(Update::ChangeMemory {\n                        dom: parent.borrow().owned.owner.clone(),\n                    });\n                } else {\n                    return Err(CapaError::InvalidValue);\n                }\n            }\n            Ok(())\n        };\n\n        // Now go through the nodes.\n        self.dfs(\u0026mut visit)\n    }\n}\n\n// ———————————————————— Domain Capability implementation ———————————————————— //\n\nimpl Capability\u003cDomain\u003e {\n    pub fn new(domain: Domain) -\u003e Self {\n        Capability::\u003cDomain\u003e {\n            owned: Ownership::empty(),\n            data: domain,\n            parent: WeakRef::new(),\n            children: Vec::new(),\n        }\n    }\n\n    // Set on self.\n    pub fn set(\n        \u0026mut self,\n        _core: u64,\n        tpe: FieldType,\n        field: Field,\n        value: u64,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e {\n                return Err(CapaError::PlatformState);\n            }\n            _ =\u003e {\n                if self.data.is_sealed() {\n                    return Err(CapaError::DomainSealed);\n                }\n\n                self.data.set_policy(tpe, field, value)?;\n            }\n        }\n        Ok(())\n    }\n\n    // Get on self.\n    pub fn get(\u0026self, _core: u64, tpe: FieldType, field: Field) -\u003e Result\u003cu64, CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::PlatformState),\n            _ =\u003e self.data.get_policy(tpe, field),\n        }\n    }\n\n    pub fn seal(\u0026self, child: LocalCapa) -\u003e Result\u003c(), CapaError\u003e {\n        if !self.data.operation_allowed(MonitorAPI::SEAL) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        if !self.data.is_domain(child)? {\n            return Err(CapaError::WrongCapaType);\n        }\n        let domain = self.data.capabilities.get(\u0026child)?.as_domain()?;\n\n        if domain.borrow().data.is_sealed() {\n            return Err(CapaError::DomainSealed);\n        }\n        domain.borrow_mut().data.status = DStatus::Sealed;\n\n        //TODO: should we generate anything now?\n\n        Ok(())\n    }\n\n    pub fn attest(\u0026self, child: LocalCapa) -\u003e Result\u003cString, CapaError\u003e {\n        if !self.data.operation_allowed(MonitorAPI::ATTEST) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        if !self.data.is_domain(child)? {\n            return Err(CapaError::WrongCapaType);\n        }\n        let child = self.data.capabilities.get(\u0026child)?.as_domain()?;\n        let attestation = format!(\"{}\", child.borrow());\n        return Ok(attestation);\n    }\n\n    pub fn coalesce_view_regions(regions: \u0026mut Vec\u003cViewRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let mut curr: usize = 0;\n        while curr \u003c regions.len() {\n            let next = ViewRegion::merge_at(curr, regions)?;\n            curr = next;\n        }\n        Ok(())\n    }\n\n    pub fn view(\u0026self) -\u003e Result\u003cVec\u003cViewRegion\u003e, CapaError\u003e {\n        let mut regions: Vec\u003cViewRegion\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, c)| match c {\n                CapaWrapper::Region(r) =\u003e Some(r.borrow().view()),\n                _ =\u003e None,\n            })\n            .flatten()\n            .collect();\n\n        // Now we need to sort and coalesce.\n        regions.sort_by_key(|c| c.access.start);\n\n        // Now go through it and merge.\n        Self::coalesce_view_regions(\u0026mut regions)?;\n\n        Ok(regions)\n    }\n\n    pub fn gva_view_raw(\u0026self) -\u003e Result\u003cVec\u003cViewRegion\u003e, CapaError\u003e {\n        let mut regions: Vec\u003cViewRegion\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, c)| match c {\n                CapaWrapper::Region(r) =\u003e Some(r.borrow().view_raw()),\n                _ =\u003e None,\n            })\n            .flatten()\n            .collect();\n        regions.sort_by(|a, b| a.active_start().cmp(\u0026b.active_start()));\n        Ok(regions)\n    }\n\n    pub fn check_conflict(\u0026self, view: \u0026ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        // Ensure there is no ambiguity when we map a gva.\n        let effective = self.gva_view_raw()?;\n        for r in effective.iter() {\n            // Check that they are mapping to the same thing.\n            if !r.compatible(view) {\n                return Err(CapaError::IncompatibleRemap);\n            }\n        }\n        Ok(())\n    }\n\n    pub fn on_revoke_child(\n        \u0026self,\n        child: \u0026CapaRef\u003cDomain\u003e,\n        updates: \u0026mut OperationUpdate,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        // Add the child to the revoke.\n        updates.add(Update::Revoke {\n            dom: Rc::downgrade(child),\n        });\n        let mut visit = |capa: \u0026Capability\u003cDomain\u003e| -\u003e Result\u003c(), CapaError\u003e {\n            // The capa should have been marked for removal already.\n            for c in \u0026capa.children {\n                updates.add(Update::Revoke {\n                    dom: Rc::downgrade(c),\n u003cViewRegion\u003e,\n}\n\nimpl CoalescedView {\n    pub fn new() -\u003e Self {\n        CoalescedView { regions: vec![] }\n    }\n\n    pub fn from_regions(mut regions: Vec\u003cViewRegion\u003e) -\u003e Result\u003cSelf, CapaError\u003e {\n        Self::coalesce(\u0026mut regions)?;\n        Ok(CoalescedView { regions })\n    }\n\n    pub fn coalesce(regions: \u0026mut Vec\u003cViewRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        regions.sort_by_key(|c| c.access.start);\n        let mut curr: usize = 0;\n        while curr \u003c regions.len() {\n            let next = ViewRegion::merge_at(curr, regions)?;\n            curr = next;\n        }\n        Ok(())\n    }\n\n    // Add a single ViewRegion\n\n    pub fn add(\u0026mut self, region: ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        self.regions.push(region);\n        Self::coalesce(\u0026mut self.regions)\n    }\n\n    pub fn sub(\u0026mut self, region: \u0026ViewRegion) -\u003e Result\u003c(), CapaError\u003e {\n        let mut idx: usize = 0;\n        while idx \u003c self.regions.len() {\n            if !self.regions[idx].intersect_remap(\u0026region) {\n                continue;\n            }\n\n            // We have an overlap.\n            let current = \u0026mut self.regions[idx];\n\n            // Check compatibility now.\n            if !current.compatible(region) {\n                return Err(CapaError::IncompatibleRemap);\n            }\n\n            if region.contains_remap(current) {\n                // Easy case, fully contained including access rights.\n                self.regions.remove(idx);\n                continue;\n            }\n            // Less easy, fully contained but not access rights.\n            if region.active_start() \u003c= current.active_start()\n                \u0026\u0026 current.active_end() \u003c= region.active_end()\n            {\n                current.access.rights.remove(region.access.rights);\n                idx += 1;\n                continue;\n            }\n            // Worst scenario is if we have split.\n            let mut replace: Vec\u003cViewRegion\u003e = Vec::new();\n            let mut rights = current.access.rights;\n            rights.remove(region.access.rights);\n\n            // left.\n            if region.active_start() \u003e current.active_start() {\n                let left = ViewRegion::new(\n                    Access::new(\n                        current.access.start,\n                        region.access.start - current.access.start,\n                        current.access.rights,\n                    ),\n                    current.remap,\n                );\n                replace.push(left);\n            };\n\n            // Middle\n            if !rights.is_empty() {\n                let start = u64::max(current.access.start, region.access.start);\n                let end = u64::min(current.access.end(), region.access.end());\n                let m = ViewRegion::new(\n                    Access::new(start, end - start, rights),\n                    current.remap.shift(start - current.access.start),\n                );\n                replace.push(m);\n            }\n\n            // Right\n            if region.active_end() \u003c current.active_end() {\n                let r = ViewRegion::new(\n                    Access::new(\n                        region.access.end(),\n                        current.access.end() - region.access.end(),\n                        current.access.rights,\n                    ),\n                    current\n                        .remap\n                        .shift(region.access.end() - current.access.start),\n                );\n                replace.push(r);\n            }\n            // Add the regions now.\n            self.regions.remove(idx);\n            for c in replace.iter() {\n                self.regions.insert(idx, *c);\n                idx += 1;\n            }\n        }\n        Ok(())\n    } b trait PrintWithNames\u003cT\u003e {\n    fn fmt_with_names(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names: \u0026mut HashMap\u003cCapaKey\u003cT\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        full: bool,\n    ) -\u003e fmt::Result;\n}\n\nimpl fmt::Display for Rights {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        if self.contains(Rights::READ) {\n            write!(f, \"R\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        if self.contains(Rights::WRITE) {\n            write!(f, \"W\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        if self.contains(Rights::EXECUTE) {\n            write!(f, \"X\")?;\n        } else {\n            write!(f, \"_\")?;\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Remapped {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        match *self {\n            Remapped::Identity =\u003e write!(f, \"Identity\")?,\n            Remapped::Remapped(x) =\u003e write!(f, \"Remapped({:#x})\", x)?,\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Access {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(\n            f,\n            \"{:#x} {:#x} with {}\",\n            self.start,\n            self.end(),\n            self.rights,\n        )\n    }\n}\n\nimpl fmt::Display for Attributes {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        if self.contains(Attributes::HASH) {\n            write!(f, \"H\")?;\n        }\n        if self.contains(Attributes::CLEAN) {\n            write!(f, \"C\")?;\n        }\n        if self.contains(Attributes::VITAL) {\n            write!(f, \"V\")?;\n        }\n        Ok(())\n    }\n}\n\nimpl PrintWithNames\u003cMemoryRegion\u003e for Capability\u003cMemoryRegion\u003e {\n    fn fmt_with_names(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names: \u0026mut HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        full: bool,\n    ) -\u003e fmt::Result {\n        let region = \u0026self.data;\n\n        // Print the main region\n        write!(\n            f,\n            \"{:?} {} mapped {}\",\n            region.status, region.access, region.remapped\n        )?;\n        // Print the attributes is any\n        if !region.attributes.is_empty() {\n            write!(f, \" {}\", region.attributes)?;\n        }\n\n        // Skip over the children.\n        if !full {\n            return Ok(());\n        }\n        // Print children recursively\n        if !self.children.is_empty() {\n            for (_, child) in self.children.iter().enumerate() {\n                let name = if names.contains_key(\u0026CapaKey(child.clone())) {\n                    *names.get(\u0026CapaKey(child.clone())).unwrap()\n                } else {\n                    // Generate a new name.\n                    let name = *next_id;\n                    *next_id += 1;\n                    names.insert(CapaKey(child.clone()), name);\n                    name\n                };\n                let child_borrowed = child.borrow();\n                write!(\n                    f,\n                    \"\\n| {:?} at {} for {}{}\",\n                    child_borrowed.data.kind, child_borrowed.data.access, prefix, name\n                )?;\n            }\n        }\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Capability\u003cMemoryRegion\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        let mut next_id = 0;\n        let prefix: String = String::from(\".\");\n        let mut names: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e = HashMap::new();\n        self.fmt_with_names(f, \u0026mut names, prefix, \u0026mut next_id, true)\n    }\n}\n\nimpl fmt::Display for ViewRegion {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"{} mapped {}\", self.access, self.remap)\n    }\n}\n\nimpl Capability\u003cDomain\u003e {\n    pub fn print_header(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names_td: \u0026mut HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e,\n        next_td: \u0026mut usize,\n        names_regions: \u0026mut HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e,\n        next_region: \u0026mut usize,\n    ) -\u003e fmt::Result {\n        write!(f, \"{:?} domain(\", self.data.status)?;\n        let mut as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        as_sorted_vector.sort_by_key(|(id, _)| *id);\n        let mut regions: Vec\u003c_\u003e = self\n            .data\n            .capabilities\n            .capabilities\n            .iter()\n            .filter_map(|(_, x)| match x {\n                CapaWrapper::Region(r) =\u003e {\n                    if !names_regions.contains_key(\u0026CapaKey(r.clone())) {\n                        names_regions.insert(CapaKey(r.clone()), *next_region);\n                        *next_region += 1;\n                    }\n                    Some(r)\n                }\n                _ =\u003e None,\n            })\n            .collect();\n        regions.sort_by_key(|c| *names_regions.get(\u0026CapaKey((*c).clone())).unwrap());\n\n        // Now build strings from those\n        self.fmt_with_names(f, names_td, String::from(\"td\"), next_td, true)?;\n\n        if as_sorted_vector.len() != 0\n            \u0026\u0026 as_sorted_vector.len() != regions.len()\n            \u0026\u0026 regions.len() != 0\n        {\n            write!(f, \",\")?;\n        }\n        // Print the regions.\n        let mut region_print: Vec\u003cString\u003e = Vec::new();\n        for r in regions {\n            let r_name = names_regions.get(\u0026CapaKey(r.clone())).unwrap();\n            region_print.push(format!(\"r{}\", r_name));\n        }\n        writeln!(f, \"{})\", region_print.join(\",\"))?;\n        // Print policies\n        write!(f, \"{}\", self.data.policies)\n    }\n}\n\nimpl PrintWithNames\u003cDomain\u003e for Capability\u003cDomain\u003e {\n    fn fmt_with_names(\n        \u0026self,\n        f: \u0026mut fmt::Formatter,\n        names: \u0026mut HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e,\n        prefix: String,\n        next_id: \u0026mut usize,\n        _full: bool,\n    ) -\u003e fmt::Result {\n        let as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        let tds: Vec\u003c_\u003e = as_sorted_vector\n            .iter()\n            .filter(|(_, x)| matches!(x, CapaWrapper::Domain(_)))\n            .collect();\n\n        // Insert names for the \"tds\" domains into the HashMap\n        for (_, wrapper) in \u0026tds {\n            if let CapaWrapper::Domain(ref d) = wrapper {\n                // Only insert if the key does not exist\n                if !names.contains_key(\u0026CapaKey(d.clone())) {\n                    names.insert(CapaKey(d.clone()), *next_id);\n                    *next_id += 1;\n                }\n            }\n        }\n\n        // Now build strings only for the domains that are in `names`\n        let tds_display: Vec\u003cString\u003e = tds\n            .iter()\n            .filter_map(|(_, wrapper)| {\n                if let CapaWrapper::Domain(ref d) = wrapper {\n                    // Get the name from `names` based on the domain\n                    let name = names.get(\u0026CapaKey(d.clone())).unwrap();\n                    Some(format!(\"{}{}\", prefix, *name))\n                } else {\n                    None\n                }\n            })\n            .collect();\n\n        // Print the names\n        write!(f, \"{}\", tds_display.join(\",\"))\n    }\n}\n\nimpl fmt::Display for Capability\u003cDomain\u003e {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter) -\u003e fmt::Result {\n        write!(f, \"td0 = \")?;\n        let mut as_sorted_vector: Vec\u003c_\u003e = self.data.capabilities.capabilities.iter().collect();\n        let mut names_region: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, usize\u003e = HashMap::new();\n        let mut names_td: HashMap\u003cCapaKey\u003cDomain\u003e, usize\u003e = HashMap::new();\n        as_sorted_vector.sort_by_key(|(id, _)| *id);\n        // Assign names to domain capabilities\n        let mut next_td: usize = 1;\n        let mut next_region: usize = 0;\n\n        // Keep actual capabilities separate\n        let mut tds: Vec\u003c_\u003e = self.children.iter().collect();\n\n        let mut regions: Vec\u003c_\u003e = as_sorted_vector\n            .iter()\n            .filter_map(|(_, x)| match x {\n                CapaWrapper::Region(r) =\u003e {\n                    // Let generate names now.\n                    names_region.insert(CapaKey(r.clone()), next_region);\n                    next_region += 1;\n                    Some(r)\n                }\n                _ =\u003e None,\n            })\n            .collect();\n\n        // Sort the regions by name.\n        regions.sort_by_key(|c| names_region.get(\u0026CapaKey((*c).clone())).unwrap());\n\n        // Give names to children regions first.\n        for r in \u0026regions {\n            let reg = \u0026r.borrow();\n            for c in \u0026reg.children {\n                if !names_region.contains_key(\u0026CapaKey(c.clone())) {\n                    names_region.insert(CapaKey(c.clone()), next_region);\n                    next_region += 1;\n                }\n            }\n        }\n\n        // Now we can go through the header of the current capa.\n        self.print_header(\n            f,\n            \u0026mut names_td,\n            \u0026mut next_td,\n            \u0026mut names_region,\n            \u0026mut next_region,\n        )?;\n\n        tds.sort_by_key(|td| {\n            if !names_td.contains_key(\u0026CapaKey((*td).clone())) {\n                names_td.insert(CapaKey((*td).clone()), next_td);\n                next_td += 1;\n            }\n            *names_td.get(\u0026CapaKey((*td).clone())).unwrap()\n        });\n        for td in tds {\n            write!(f, \"td{} = \", names_td.get(\u0026CapaKey(td.clone())).unwrap())?;\n            td.borrow().print_header(\n                f,\n                \u0026mut names_td,\n                \u0026mut next_td,\n                \u0026mut names_region,\n                \u0026mut next_region,\n            )?;\n        }\n\n        // Print the regions.\n        let mut regions_sorted: Vec\u003c(CapaRef\u003cMemoryRegion\u003e, usize)\u003e = names_region\n            .iter()\n            .map(|(k, v)| (k.0.clone(), *v))\n            .collect();\n\n        // Now we can sort without borrowing names_region\n        regions_sorted.sort_by_key(|(_, v)| *v);\n\n        // Filter the regions to be printed.\n        let mut region_set: HashMap\u003cCapaKey\u003cMemoryRegion\u003e, bool\u003e = HashMap::new();\n        for r in regions {\n            region_set.insert(CapaKey(r.clone()), true);\n            for c in \u0026r.borrow().children {\n                // If we do not own the child region anymore.\n                if !region_set.contains_key(\u0026CapaKey(c.clone())) {\n                    region_set.insert(CapaKey(c.clone()), false);\n                }\n            }\n        }\n\n        // Now iterate and print\n        for (key, name) in regions_sorted {\n            if !region_set.contains_key(\u0026CapaKey(key.clone())) {\n                continue;\n            }\n            write!(f, \"r{} = \", name)?;\n            let full = *region_set.get(\u0026CapaKey(key.clone())).unwrap();\n            let capa = key.borrow(); // no conflict anymore\n            capa.fmt_with_names(\n                f,\n                \u0026mut names_region,\n                String::from(\"r\"),\n                \u0026mut next_region,\n                full,\n            )?;\n            write!(f, \"\\n\")?;\n        }\n\n        // Print the local indices\n        if as_sorted_vector.len() != 0 {\n            write!(f, \"|indices:\")?;\n            for (key, capa) in as_sorted_vector {\n                match capa {\n                    CapaWrapper::Region(r) =\u003e {\n                        let name = names_region.get(\u0026CapaKey(r.clone())).unwrap();\n                        write!(f, \" {}-\u003er{}\", key, name)?;\n                    }\n                    CapaWrapper::Domain(d) =\u003e {\n                        let name = names_td.get(\u0026CapaKey(d.clone())).unwrap();\n                        write!(f, \" {}-\u003etd{}\", key, name)?;\n                    }\n                }\n            }\n\n            write!(f, \"\\n\")?;\n        }\n\n        Ok(())\n    }\n}\n\nimpl fmt::Display for Policies {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        writeln!(f, \"|cores: {:#x}\", self.cores)?;\n        writeln!(f, \"|mon.api: {:#x}\", self.api.bits())?;\n        write!(f, \"{}\", self.interrupts)\n    }\n}\n\nimpl fmt::Display for InterruptPolicy {\n    fn fmt(\u0026self, f: \u0026mut fmt::Formatter\u003c'_\u003e) -\u003e fmt::Result {\n        let mut start = 0;\n        let mut vector = self.get(0);\n\n        for i in 1..NB_INTERRUPTS {\n            if self.get(i) == vector {\n                continue;\n            }\n\n            // Print the range [start, i - 1] and the associated policy\n            if start == i - 1 {\n                writeln!(f, \"|vec{}: {}\", start, vector)?;\n            } else {\n                writeln!(f, \"|vec{}-{}: {}\", start, i - 1, vector)?;\n            }\n\n            // Update start and vector for the next range\n            start = i;\n            vector = self.get(i);\n        }\n\n        // Print the final range\n        if start == NB_INTERRUPTS - 1 {\n i in 0..NB_INTERRUPTS {\n            if !self.get(i).contains(\u0026other.get(i)) {\n                return false;\n            }\n        }\n        return true;\n    }\n\n    pub fn remove(\u0026mut self, i: usize) {\n        let mut to_remove = Vec::new();\n\n        for (policy, mask) in self.overrides.iter_mut() {\n            let idx = i / 64;\n            let bit = i % 64;\n            if idx \u003c mask.bits.len() \u0026\u0026 (mask.bits[idx] \u0026 (1 \u003c\u003c bit)) != 0 {\n                mask.bits[idx] \u0026= !(1 \u003c\u003c bit); // remove vector from old mask\n                if mask.bits.iter().all(|\u0026x| x == 0) {\n                    to_remove.push(*policy); // mark empty masks for removal\n                }\n                break; // vector can only be in one policy\n            }\n        }\n\n        for policy in to_remove {\n            self.overrides.remove(\u0026policy);\n        }\n    }\n\n    pub fn set(\u0026mut self, tpe: FieldType, field: u64, value: u64) -\u003e Result\u003c(), CapaError\u003e {\n        if field as usize \u003e= NB_INTERRUPTS {\n            return Err(CapaError::InvalidField);\n        }\n        let mut prev = self.get(field as usize);\n\n        match tpe {\n            FieldType::InterruptVisibility =\u003e {\n                let vis =\n                    VectorVisibility::from_bits(value as u8).ok_or(CapaError::InvalidValue)?;\n                prev.visibility = vis;\n            }\n            FieldType::InterruptRead =\u003e {\n                prev.read_set = value as u64;\n            }\n            FieldType::InterruptWrite =\u003e {\n                prev.write_set = value as u64;\n            }\n            _ =\u003e return Err(CapaError::InvalidField),\n        }\n\n        // Now add it back.\n        self.set_full(field, prev)\n    }\n\n    pub fn set_full(\u0026mut self, field: u64, value: VectorPolicy) -\u003e Result\u003c(), CapaError\u003e {\n        if field as usize \u003e= NB_INTERRUPTS {\n            return Err(CapaError::InvalidField);\n        }\n        self.remove(field as usize);\n        // Now add it back.\n        let mask = self\n            .overrides\n            .entry(value)\n            .or_insert_with(|| BitMask::zero());\n        mask.set(field as usize);\n        Ok(())\n    }\n}\n\n/// For the moment define a handle\npub type LocalCapa = u64;\n\n/// The structure to manipulate capabilities.\npub enum CapaWrapper {\n    Region(CapaRef\u003cMemoryRegion\u003e),\n    Domain(CapaRef\u003cDomain\u003e),\n}\n\nimpl CapaWrapper {\n    pub fn as_domain(\u0026self) -\u003e Result\u003cCapaRef\u003cDomain\u003e, CapaError\u003e {\n        if let CapaWrapper::Domain(d) = self {\n            return Ok(d.clone());\n        }\n        return Err(CapaError::WrongCapaType);\n    }\n    pub fn as_region(\u0026self) -\u003e Result\u003cCapaRef\u003cMemoryRegion\u003e, CapaError\u003e {\n        if let CapaWrapper::Region(r) = self {\n            return Ok(r.clone());\n        }\n        return Err(CapaError::WrongCapaType);\n    }\n}\n\npub struct CapabilityStore {\n    pub capabilities: BTreeMap\u003cLocalCapa, CapaWrapper\u003e,\n    pub next_handle: LocalCapa,\n    pub free_handles: VecDeque\u003cLocalCapa\u003e,\n}\n\nimpl CapabilityStore {\n    pub fn new() -\u003e Self {\n        CapabilityStore {\n            capabilities: BTreeMap::new(),\n            next_handle: 1,\n            free_handles: VecDeque::new(),\n        }\n    }\n    pub fn install_capability(\u0026mut self, cap: CapaWrapper) -\u003e LocalCapa {\n        let handle = if let Some(recycled) = self.free_handles.pop_front() {\n            recycled\n        } else {\n            let h = self.next_handle;\n            self.next_handle += 1;\n            h\n        };\n        self.capabilities.insert(handle, cap);\n        handle\n    }\n\n    pub fn install_capabilitiy_at(\u0026mut self, cap: CapaWrapper, idx: LocalCapa) {\n        self.capabilities.insert(idx, cap);\n    }\n\n    pub fn remove(\u0026mut self, handle: \u0026LocalCapa) -\u003e Result\u003cCapaWrapper, CapaError\u003e {\n        if let Some(cap) = self.capabilities.remove(handle) {\n            self.free_handles.push_back(*handle);\n            return Ok(cap);\n        }\n        Err(CapaError::InvalidLocalCapa)\n    }\n\n    pub fn get(\u0026self, handle: \u0026LocalCapa) -\u003e Result\u003c\u0026CapaWrapper, CapaError\u003e {\n        self.capabilities\n            .get(handle)\n            .ok_or(CapaError::InvalidLocalCapa)\n    }\n\n    pub fn foreach_region_mut\u003cF\u003e(\u0026mut self, op: F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: Fn(\u0026CapaRef\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for (_k, c) in \u0026mut self.capabilities {\n            if c.as_region().is_err() {\n                continue;\n            }\n            let region = c.as_region()?;\n            op(\u0026region)?;\n        }\n        Ok(())\n    }\n\n    pub fn foreach_region\u003cF\u003e(\u0026self, op: \u0026mut F) -\u003e Result\u003c(), CapaError\u003e\n    where\n        F: FnMut(\u0026CapaRef\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e,\n    {\n        for (_k, c) in \u0026self.capabilities {\n            if c.as_region().is_err() {\n                continue;\n            }\n            let region = c.as_region()?;\n            op(\u0026region)?;\n        }\n        Ok(())\n    }\n\n    pub fn reset(\u0026mut self) {\n        self.capabilities = BTreeMap::new();\n        self.next_handle = 1;\n        self.free_handles = VecDeque::new();\n    }\n}\n\npub struct Domain {\n    pub id: u64,\n    pub status: Status,\n    pub capabilities: CapabilityStore,\n    pub policies: Policies,\n}\n\nimpl PartialEq for Domain {\n    fn eq(\u0026self, other: \u0026Self) -\u003e bool {\n        self.id == other.id\n    }\n}\n\nimpl Domain {\n    pub fn new(policies: Policies) -\u003e Self {\n        Domain {\n            id: NEXT_ID.fetch_add(1, Ordering::Relaxed),\n            status: Status::Unsealed,\n            capabilities: CapabilityStore::new(),\n            policies,\n        }\n    }\n    pub fn is_sealed(\u0026self) -\u003e bool {\n        return self.status == Status::Sealed;\n    }\n    pub fn install(\u0026mut self, capa: CapaWrapper) -\u003e LocalCapa {\n        self.capabilities.install_capability(capa)\n    }\n\n    pub fn remove(\u0026mut self, capa: LocalCapa) -\u003e Result\u003cCapaWrapper, CapaError\u003e {\n        self.capabilities.remove(\u0026capa)\n    }\n\n    pub fn is_domain(\u0026self, capa: LocalCapa) -\u003e Result\u003cbool, CapaError\u003e {\n        if let CapaWrapper::Domain(_) = self.capabilities.get(\u0026capa)? {\n            return Ok(true);\n        }\n        Ok(false)\n    }\n\n    pub fn is_region(\u0026self, capa: LocalCapa) -\u003e Result\u003cbool, CapaError\u003e {\n        if let CapaWrapper::Region(_) = self.capabilities.get(\u0026capa)? {\n            return Ok(true);\n        }\n        return Ok(false);\n    }\n\n    pub fn operation_allowed(\u0026self, apicall: MonitorAPI) -\u003e bool {\n        self.policies.api.contains(apicall)\n    }\n\n    pub fn set_policy(\u0026mut self, tpe: FieldType, field: u64, value: u64) -\u003e Result\u003c(), CapaError\u003e {\n        if self.is_sealed() {\n            return Err(CapaError::DomainSealed);\n        }\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::InvalidField),\n            FieldType::Cores =\u003e {\n                self.policies.cores = value as u64;\n                return Ok(());\n            }\n            FieldType::Api =\u003e {\n                self.policies.api =\n                    MonitorAPI::from_bits(value as u16).ok_or(CapaError::InvalidValue)?;\n                return Ok(());\n            }\n            FieldType::InterruptVisibility\n            | FieldType::InterruptRead\n            | FieldType::InterruptWrite =\u003e self.policies.interrupts.set(tpe, field, value),\n        }\n    }\n\n    pub fn get_policy(\u0026self, tpe: FieldType, field: u64) -\u003e Result\u003cu64, CapaError\u003e {\n        match tpe {\n            FieldType::Register =\u003e return Err(CapaError::InvalidField),\n            FieldType::Api =\u003e Ok(self.policies.api.bits() as u64),\n            FieldType::Cores =\u003e Ok(self.policies.cores),\n            FieldType::InterruptWrite =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self.policies.interrupts.get(field as usize).write_set)\n            }\n            FieldType::InterruptRead =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self.policies.interrupts.get(field as usize).read_set)\n            }\n            FieldType::InterruptVisibility =\u003e {\n                if field as usize \u003e= NB_INTERRUPTS {\n                    return Err(CapaError::InvalidField);\n                }\n                Ok(self\n                    .policies\n                    .interrupts\n                    .get(field as usize)\n                    .visibility\n                    .bits() as u64)\n            }\n        }\n    }\n}\n","traces":[{"line":11,"address":[773177,772849,771163,773020,773089,771003,772945,772533,770822,772556,771422,772513,772913,772821,769746,770717,769765,772681,771502,773153,767671,773121,771598,769886,773057,771254,772805,770621,772718,771662,769960,772977,772881,772497,770902,772649,771342,771083,769793,770677],"length":1,"stats":{"Line":299}},{"line":12,"address":[803029,803024,802896,802995,802976,803013,802928,803008],"length":1,"stats":{"Line":0}},{"line":31,"address":[442368],"length":1,"stats":{"Line":1}},{"line":32,"address":[442369],"length":1,"stats":{"Line":1}},{"line":36,"address":[714108,715551,715 -\u003e Self {\n        match self {\n            Self::Identity =\u003e Self::Identity,\n            Self::Remapped(y) =\u003e Self::Remapped(x + y),\n        }\n    }\n}\n\n#[derive(PartialEq, Clone, Copy, Debug, Eq)]\npub struct Access {\n    pub start: u64,\n    pub size: u64,\n    pub rights: Rights,\n}\n\nimpl Access {\n    pub fn new(start: u64, size: u64, rights: Rights) -\u003e Self {\n        Access {\n            start,\n            size,\n            rights,\n        }\n    }\n    pub fn contained(\u0026self, other: \u0026Self) -\u003e bool {\n        self.start \u003e= other.start\n            \u0026\u0026 self.start + self.size \u003c= other.start + other.size\n            \u0026\u0026 other.rights.contains(self.rights)\n    }\n\n    pub fn intersect(\u0026self, other: \u0026Self) -\u003e bool {\n        let case_1 = self.start \u003c= other.start \u0026\u0026 other.start \u003c self.start + self.size;\n        let case_2 = other.start \u003c= self.start \u0026\u0026 self.start \u003c other.start + other.size;\n        case_1 || case_2\n    }\n    pub fn end(\u0026self) -\u003e u64 {\n        self.start + self.size\n    }\n}\n\n#[derive(PartialEq, Debug, Clone)]\npub struct MemoryRegion {\n    pub kind: RegionKind,\n    pub status: Status,\n    pub access: Access,\n    pub attributes: Attributes,\n    pub remapped: Remapped,\n}\n\n#[derive(Clone, Copy, Debug, PartialEq, Eq)]\npub struct ViewRegion {\n    pub access: Access,\n    pub remap: Remapped,\n}\n\nimpl ViewRegion {\n    pub fn new(access: Access, remap: Remapped) -\u003e Self {\n        ViewRegion { access, remap }\n    }\n\n    pub fn active_start(\u0026self) -\u003e u64 {\n        if let Remapped::Remapped(gva) = self.remap {\n            gva\n        } else {\n            self.access.start\n        }\n    }\n    pub fn active_end(\u0026self) -\u003e u64 {\n        self.active_start() + self.access.size\n    }\n\n    pub fn contains_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.active_start() \u003c= other.active_start()\n            \u0026\u0026 other.active_end() \u003c= self.active_end()\n            \u0026\u0026 self.access.rights.contains(other.access.rights)\n    }\n\n    pub fn contiguous(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        // They must be contiguous in remaps and non remaps\n        // and have the same access rights\n        self.active_end() == other.active_start()\n            \u0026\u0026 self.access.end() == other.access.start\n            \u0026\u0026 self.access.rights == other.access.rights\n    }\n\n    pub fn overlap_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.active_start() \u003c= other.active_start() \u0026\u0026 other.active_start() \u003c self.active_end()\n        //\u0026\u0026 self.active_end() \u003c other.active_end()\n    }\n\n    pub fn overlap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.access.start \u003c= other.access.start \u0026\u0026 other.access.start \u003c self.access.end()\n        //\u0026\u0026 self.access.end() \u003c other.access.end()\n    }\n\n    // Check if they intersect.\n    pub fn intersect_remap(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        self.overlap_remap(other) || other.overlap_remap(self)\n    }\n\n    pub fn compatible(\u0026self, other: \u0026ViewRegion) -\u003e bool {\n        if self.active_start() \u003c= other.active_start() \u0026\u0026 !self.overlap_remap(other) {\n            return true;\n        }\n        if self.active_start() \u003e= other.active_start() \u0026\u0026 !other.overlap_remap(self) {\n            return true;\n        }\n        let (first, second) = if self.active_start() \u003c= other.active_start() {\n            (self, other)\n        } else {\n            (other, self)\n        };\n\n        match (first.remap, second.remap) {\n            (Remapped::Identity, Remapped::Identity) =\u003e {\n                return true;\n            }\n            // Needs to be remapped in exactly the same way.\n            // We can have several capabilities with the same physical and remaped\n            // range but we cannot have a gap with two different ranges, i.e.,\n            // we need to avoid gva mapping to multiple hpa.\n            (Remapped::Remapped(x), Remapped::Remapped(y)) =\u003e {\n                // They are not ordered in the same way, that won't work.\n                if first.access.start \u003e second.access.start {\n                    return false;\n                }\n                let diff_active = y - x;\n                let diff_real = second.access.start - first.access.start;\n                return diff_active == diff_real;\n            }\n            // For the moment, let's disallow all remapping overlaps.\n            _ =\u003e return false,\n        }\n    }\n\n    pub fn merge_at(curr: usize, regions: \u0026mut Vec\u003cSelf\u003e) -\u003e Result\u003cusize, CapaError\u003e {\n        if curr == regions.len() - 1 {\n            return Ok(regions.len());\n        }\n\n        let mut current = regions[curr];\n        let mut other = regions[curr + 1];\n\n        // Case 1: contained.\n        if current.contains_remap(\u0026other) {\n            // Safety check, this should only happen if they are the same in physical space.\n            if !(current.access.start \u003c= other.access.start\n                \u0026\u0026 other.access.end() \u003c= current.access.end())\n            {\n                return Err(CapaError::DoubleRemapping);\n            }\n            // Remove the next.\n            regions.remove(curr + 1);\n            return Ok(curr);\n        }\n\n        // Case 2: contiguous\n        if current.contiguous(\u0026other) {\n            current = ViewRegion::new(\n                Access::new(\n                    current.access.start,\n                    current.access.size + other.access.size,\n                    current.access.rights,\n                ),\n

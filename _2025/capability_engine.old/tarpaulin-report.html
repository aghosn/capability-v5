     owner: HashMap::new(),\n            parent_children: HashMap::new(),\n            domains: HashMap::new(),\n            indicies: HashMap::new(),\n        }\n    }\n\n    pub fn find_end(lines: \u0026[\u0026str], start: usize) -\u003e usize {\n        let mut j = start + 1;\n        while j \u003c lines.len() \u0026\u0026 lines[j].starts_with(\"|\") \u0026\u0026 !lines[j].starts_with(\"|indices:\") {\n            j += 1;\n        }\n        return j;\n    }\n\n    pub fn parse_indicies(\u0026mut self, line: \u0026str) -\u003e Result\u003c(), CapaError\u003e {\n        if !line.starts_with(\"|indices: \") {\n            return Err(CapaError::ParserCapability);\n        }\n\n        let line = line.trim_start_matches(\"|indices: \");\n        line.split_whitespace().for_each(|e| {\n            let sp: Vec\u003c\u0026str\u003e = e.split(\"-\u003e\").collect();\n            if sp.len() != 2 {\n                panic!(\"Invalid length {}\", sp.len());\n            }\n            self.indicies.insert(\n                sp[1].to_string(),\n                LocalCapa::from_str_radix(sp[0], 10).unwrap(),\n            );\n        });\n        Ok(())\n    }\n\n    pub fn parse_domain(\u0026mut self, lines: \u0026[\u0026str]) -\u003e Result\u003c(), CapaError\u003e {\n        if lines.len() \u003c 4 {\n            return Err(CapaError::ParserDomain);\n        }\n        // Should be tdX = STATUS domain(CAPAS)\n        let header: Vec\u003c\u0026str\u003e = lines[0].split_whitespace().collect();\n        let name = header[0].trim();\n        let status = Status::from_string(header[2].to_string())?;\n        let capabilities: Vec\u003c\u0026str\u003e = {\n            let start = header[3].find('(').ok_or(CapaError::ParserDomain)?;\n            let end = start\n                + header[3][start..]\n                    .find(\")\")\n                    .ok_or(CapaError::InvalidValue)?;\n            header[3][start + 1..end]\n                .split(\",\")\n                .filter(|s| s.len() \u003e 0)\n                .collect()\n        };\n        // Add the children now so it's done.\n        for c in capabilities {\n            self.owner.insert(c.to_string(), name.to_string());\n            if !c.starts_with(\"td\") {\n                continue;\n            }\n            self.parent_children\n                .entry(name.to_string())\n                .or_insert_with(Vec::new)\n                .push(c.to_string());\n        }\n\n        // Now parse the next lines.\n        if !lines[1].starts_with(\"|cores: 0x\") {\n            return Err(CapaError::ParserDomain);\n        }\n        let cores = {\n            let mask = lines[1].trim_start_matches(\"|cores: 0x\");\n            u64::from_str_radix(mask, 16).map_err(|_| CapaError::ParserDomain)?\n        };\n        let api = MonitorAPI::from_string(lines[2].to_string())?;\n\n        // Parse the interrupt policies.\n        let mut inter_policy: InterruptPolicy = InterruptPolicy::default_none();\n\n        for l in lines[3..].iter() {\n            if !l.starts_with(\"|vec\") {\n                break;\n            }\n            inter_policy.parse_one(l.to_string())?;\n        }\n        let domain = Domain {\n            id: 0,\n            status,\n            capabilities: CapabilityStore::new(),\n            policies: Policies::new(cores, api, \u0026inter_policy),\n        };\n        // Add the domain.\n        self.domains.insert(\n            name.to_string(),\n            CapaRef::new(RefCell::new(Capability::\u003cDomain\u003e::new(domain))),\n        );\n        Ok(())\n    }\n\n    pub fn parse_rights(input: \u0026str) -\u003e Result\u003cRights, CapaError\u003e {\n        let mut rights = Rights::empty();\n        if input.contains(\"R\") {\n            rights |= Rights::READ;\n        }\n        if input.contains(\"W\") {\n            rights |= Rights::WRITE;\n        }\n        if input.contains(\"W\") {\n            rights |= Rights::EXECUTE;\n        }\n        Ok(rights)\n    }\n\n    pub fn parse_remapped(input: \u0026str) -\u003e Result\u003cRemapped, CapaError\u003e {\n        if input.trim().contains(\"Identity\") {\n            return Ok(Remapped::Identity);\n        }\n        if !input.contains(\"Remapped\") {\n            return Err(CapaError::ParserRegion);\n        }\n        let mut trimmed = input.trim().trim_start_matches(\"Remapped(0x\");\n        trimmed = \u0026trimmed[0..trimmed.len() - 1];\n        let addr = u64::from_str_radix(trimmed, 16).map_err(|_| CapaError::ParserRegion)?;\n        Ok(Remapped::Remapped(addr))\n    }\n\n    pub fn parse_region_child(input: \u0026str) -\u003e Result\u003c(String, CapaRef\u003cMemoryRegion\u003e), CapaError\u003e {\n        let kind = if input.starts_with(\"| Alias\") {\n            RegionKind::Alias\n        } else if input.starts_with(\"| Carve\") {\n            RegionKind::Carve\n        } else {\n            return Err(CapaError::ParserRegion);\n        };\n        let splitted: Vec\u003c\u0026str\u003e = input.split_whitespace().collect();\n        if splitted.len() != 9 {\n            return Err(CapaError::ParserRegion);\n        }\n\n        let start = u64::from_str_radix(splitted[3].trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        let end = u64::from_str_radix(splitted[4].trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        if end \u003c= start {\n            return Err(CapaError::InvalidValue);\n        }\n        let rights = Self::parse_rights(splitted[6])?;\n        let access = Access::new(start, end - start, rights);\n        let name = splitted.last().ok_or(CapaError::ParserRegion)?;\n        if !name.starts_with(\"r\") {\n            return Err(CapaError::ParserRegion);\n        }\n        Ok((\n            name.to_string(),\n            CapaRef::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n                MemoryRegion {\n                    kind,\n                    status: MStatus::Exclusive,\n                    access,\n                    attributes: Attributes::empty(),\n                    remapped: Remapped::Identity,\n                },\n            ))),\n        ))\n    }\n\n    pub fn parse_region(\u0026mut self, input: \u0026[\u0026str]) -\u003e Result\u003c(), CapaError\u003e {\n        if input.len() == 0 || !input[0].starts_with(\"r\") {\n            return Err(CapaError::ParserDomain);\n        }\n        let header: Vec\u003c\u0026str\u003e = input[0].split_whitespace().collect();\n        if header.len() != 9 {\n            return Err(CapaError::ParserRegion);\n        }\n        let name = header[0];\n        let status = if header[2].to_lowercase().contains(\"exclusive\") {\n            MStatus::Exclusive\n        } else if header[2].to_lowercase().contains(\"aliased\") {\n            MStatus::Aliased\n        } else {\n            return Err(CapaError::ParserRegion);\n        };\n        let start = u64::from_str_radix(header[3].trim().trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        let end = u64::from_str_radix(header[4].trim().trim_start_matches(\"0x\"), 16)\n            .map_err(|_| CapaError::ParserRegion)?;\n        if end \u003c= start {\n            return Err(CapaError::InvalidValue);\n        }\n        let rights = Self::parse_rights(header[6])?;\n\n        let access: Access = Access::new(start, end - start, rights);\n\n        let remapped = Self::parse_remapped(header[8])?;\n\n        let kind = if status == MStatus::Exclusive {\n            RegionKind::Carve\n        } else {\n            RegionKind::Alias\n        };\n\n        let region = self\n            .regions\n            .entry(name.to_string())\n            .or_insert(CapaRef::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n                MemoryRegion {\n                    kind,\n                    status,\n                    access,\n                    attributes: Attributes::empty(),\n                    remapped,\n                },\n            ))));\n        // Make sure we set what might be missing, i.e., the status, remapped, and attributes.\n        region.borrow_mut().data.status = status;\n        region.borrow_mut().data.remapped = remapped;\n        //region.attributes = ???;\n\n        // Now parse the children and populate the map.\n        for i in 1..input.len() {\n            let (cname, child) = Self::parse_region_child(input[i])?;\n            if self.regions.contains_key(\u0026cname) {\n                let entry = self\n                    .regions\n                    .get_mut(\u0026cname)\n                    .ok_or(CapaError::ParserRegion)?;\n                entry.borrow_mut().data.kind = child.borrow_mut().data.kind;\n            } else {\n                self.regions.insert(cname.clone(), child);\n            }\n            self.parent_children\n                .entry(name.to_string())\n                .or_insert_with(Vec::new)\n                .push(cname.clone());\n        }\n\n        Ok(())\n    }\n\n    pub fn parse_attestation(\u0026mut self, attestation: String) -\u003e Result\u003c(), CapaError\u003e {\n        let lines: Vec\u003c\u0026str\u003e = attestation.lines().collect();\n        self.parse_attestation_internal(\u0026lines)\n    }\n\n    fn parse_attestation_internal(\u0026mut self, lines: \u0026Vec\u003c\u0026str\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let mut i: usize = 0;\n        while i \u003c lines.len() {\n            if lines[i].starts_with(\"td\") {\n                let end = Self::find_end(lines, i);\n                self.parse_domain(\u0026lines[i..end])?;\n                i = end;\n            } else if lines[i].starts_with(\"r\") {\n                let end = Self::find_end(lines, i);\n                self.parse_region(\u0026lines[i..end])?;\n                i = end;\n            } else if lines[i].starts_with(\"|indices:\") {\n                self.parse_indicies(lines[i])?;\n                i += 1;\n            } else {\n                break;\n            }\n        }\n        // Now create the tree for the capabilities.\n        for (k, v) in self.parent_children.iter() {\n            if k.starts_with(\"td\") {\n                let parent = self.domains.get(k).ok_or(CapaError::ParserCapability)?;\n                for c in v.iter() {\n                    if !self.domains.contains_key(c) {\n                        continue;\n                    }\n                    let child = self.domains.get(c).unwrap();\n                    parent.borrow_mut().children.push(child.clone());\n                    child.borrow_mut().parent = Rc::downgrade(parent);\n                }\n            } else if k.starts_with(\"r\") {\n                let parent = self.regions.get(k).ok_or(CapaError::ParserCapability)?;\n                for c in v.iter() {\n                    if !self.regions.contains_key(c) {\n                        continue;\n                    }\n                    let child = self.regions.get(c).unwrap();\n                    parent.borrow_mut().children.push(child.clone());\n                    child.borrow_mut().parent = Rc::downgrade(parent);\n                }\n            }\n        }\n        let td0 = self.domains.get(\"td0\").ok_or(CapaError::ParserDomain)?;\n        // Now use the indicies to set ownership.\n        for (k, v) in self.indicies.iter() {\n            let capa_wrapper = if k.starts_with(\"td\") {\n                let dom = self.domains.get(k).ok_or(CapaError::ParserDomain)?;\n                dom.borrow_mut().owned = Ownership::new(Rc::downgrade(td0), *v);\n                CapaWrapper::Domain(dom.clone())\n            } else {\n                let reg = self.regions.get(k).ok_or(CapaError::ParserRegion)?;\n                reg.borrow_mut().owned = Ownership::new(Rc::downgrade(td0), *v);\n                CapaWrapper::Region(reg.clone())\n            };\n\n            td0.borrow_mut()\n                .data\n                .capabilities\n                .capabilities\n                .insert(*v, capa_wrapper);\n        }\n\n        // Should setup the rest of the domains too?\n        for (capa, owner) in self.owner.iter() {\n            if owner.contains(\"td0\") {\n                // We already did it\n                continue;\n            }\n            let dom_owner = self\n                .domains\n                .get(owner)\n                .ok_or(CapaError::InvalidValue)\n                .unwrap();\n\n            let wrapper = if capa.starts_with(\"td\") {\n                let dom = self\n                    .domains\n                    .get(capa)\n                    .ok_or(CapaError::InvalidValue)\n                    .unwrap();\n                CapaWrapper::Domain(dom.clone())\n            } else {\n                let reg = self\n                    .regions\n                    .get(capa)\n                    .ok_or(CapaError::InvalidValue)\n                    .unwrap();\n                CapaWrapper::Region(reg.clone())\n            };\n            dom_owner.borrow_mut().data.install(wrapper);\n        }\n        Ok(())\n    }\n}\n\n// —————————————————————— Unmarshall specific elements —————————————————————— //\npub trait Unmarshall {\n    type Output;\n    fn from_string(input: String) -\u003e Result\u003cSelf::Output, CapaError\u003e;\n}\n\nimpl Unmarshall for Status {\n    type Output = Status;\n    fn from_string(input: String) -\u003e Result\u003cSelf::Output, CapaError\u003e {\n        match input.trim().to_lowercase().as_str() {\n            \"sealed\" =\u003e Ok(crate::core::domain::Status::Sealed),\n            \"unsealed\" =\u003e Ok(crate::core::domain::Status::Unsealed),\n            _ =\u003e return Err(CapaError::ParserStatus),\n        }\n    }\n}\n\nimpl Unmarshall for MonitorAPI {\n    type Output = MonitorAPI;\n    fn from_string(input: String) -\u003e Result\u003cSelf::Output, CapaError\u003e {\n        let value = input.trim_start_matches(\"|mon.api: 0x\");\n        let raw = u64::from_str_radix(value, 16).map_err(|_| CapaError::ParserMonitor)?;\n        MonitorAPI::from_bits(raw as u16).ok_or(CapaError::ParserMonitor)\n    }\n}\n\nimpl InterruptPolicy {\n    pub fn parse_one(\u0026mut self, l: String) -\u003e Result\u003c(), CapaError\u003e {\n        if !l.starts_with(\"|vec\") {\n            return Err(CapaError::InvalidValue);\n        }\n        let prefix = l.strip_prefix(\"|vec\").ok_or(CapaError::InvalidValue)?;\n        let parts: Vec\u003c\u0026str\u003e = prefix.split(',').collect();\n        if parts.len() != 3 {\n            return Err(CapaError::InvalidValue);\n        }\n\n        let tmp: Vec\u003c\u0026str\u003e = parts[0].split(':').collect();\n        let (range, visi) = (tmp[0].trim_start_matches(\"|vec\"), tmp[1]);\n        // We have the start and end vector.\n        let (vs, ve) = if let Some((start, end)) = range.split_once('-') {\n            (\n                usize::from_str_radix(start, 10).map_err(|_| CapaError::InvalidValue)?,\n                usize::from_str_radix(end, 10).map_err(|_| CapaError::InvalidValue)?,\n            )\n        } else {\n            let value = usize::from_str_radix(range, 10).map_err(|_| CapaError::InvalidValue)?;\n            (value, value)\n        };\n\n        let visibility = match visi.trim().to_lowercase().as_str() {\n            \"allowed|visible\" =\u003e VectorVisibility::all(),\n            \"allowed\" =\u003e VectorVisibility::ALLOWED,\n            \"visible\" =\u003e VectorVisibility::VISIBLE,\n            \"not reported\" =\u003e VectorVisibility::empty(),\n            _ =\u003e return Err(CapaError::InvalidValue),\n        };\n\n        let read = u64::from_str_radix(parts[1].trim_start_matches(\" r: 0x\"), 16)\n            .map_err(|_| CapaError::InvalidValue)\n            .unwrap();\n        let write = u64::from_str_radix(parts[2].trim_start_matches(\" w: 0x\"), 16)\n            .map_err(|_| CapaError::InvalidValue)\n            .unwrap();\n\n        // Now set the values\n        for j in vs..=ve {\n            self.set_full(\n                j as u64,\n                VectorPolicy {\n                    visibility,\n                    read_set: read,\n                    write_set: write,\n                },\n            )?;\n        }\n        Ok(())\n    }\n}\n","traces":[{"line":33,"address":[310018,309648,310012],"length":1,"stats":{"Line":1}},{"line":35,"address":[953233],"length":1,"stats":{"Line":1}},{"line":36,"address":[953247],"length":1,"stats":{"Line":1}},{"line":37,"address":[953304],"length":1,"stats":{"Line":1}},{"line":38,"address":[953358],"length":1,"stats":{"Line":1}},{"line":39,"address":[309827],"length":1,"stats":{"Line":1}},{"line":43,"address":[953648],"length":1,"stats":{"Line":1}},{"line":44,"address":[310087,310061],"length":1,"stats":{"Line":1}},{"line":45,"address":[953701,953721,953743,953953],"length":1,"stats":{"Line":4}},{"line":46,"address":[310340,310306],"length":1,"stats":{"Line":1}},{"line":48,"address":[310112],"length":1,"stats":{"Line":1}},{"line":51,"address":[310368],"length":1,"stats":{"Line":1}},{"line":52,"address":[954048],"length":1,"stats":{"Line":1}},{"line":53,"address":[954070],"length":1,"stats":{"Line":0}},{"line":56,"address":[310478],"length":1,"stats":{"Line":1}},{"line":57,"address":[1117366,1116864,1117490],"length":1,"stats":{"Line":2}},{"line":58,"address":[1183844],"length":1,"stats":{"Line":2}},{"line":59,"address":[1183913,1183975],"length":1,"stats":{"Line":4}},{"line":60,"address":[1061611,1061905],"length":1,"stats":{"Line":0}},{"line":62,"address":[1121410,1121658],"length":1,"stats":{"Line":3}},{"line":63,"address":[1091752,1091690],"length":1,"stats":{"Line":2}},{"line":64,"address":[1146440,1146362],"length":1,"stats":{"Line":4}},{"line":67,"address":[954165],"length":1,"stats":{"Line":2}},{"line":70,"address":[314067,314704,310576],"length":1,"stats":{"Line":1}},{"line":71,"address":[95427 e Result\u003cString, Self::CapabilityError\u003e;\n\n    fn switch(\n        \u0026mut self,\n        domain: Self::CapaReference,\n        _capa: Self::OwnedCapa,\n    ) -\u003e Result\u003c(), Self::CapabilityError\u003e;\n\n    fn alias(\n        \u0026mut self,\n        domain: Self::CapaReference,\n        capa: Self::OwnedCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cSelf::OwnedCapa, Self::CapabilityError\u003e;\n\n    fn carve(\n        \u0026mut self,\n        domain: Self::CapaReference,\n        capa: Self::OwnedCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cSelf::OwnedCapa, Self::CapabilityError\u003e;\n\n    fn revoke(\n        \u0026mut self,\n        domain: Self::CapaReference,\n        capa: Self::OwnedCapa,\n        child: u64,\n    ) -\u003e Result\u003c(), Self::CapabilityError\u003e;\n\n    fn send(\n        \u0026mut self,\n        domain: Self::CapaReference,\n        dest: Self::OwnedCapa,\n        capa: Self::OwnedCapa,\n        remap: Remapped,\n        attributes: Attributes,\n    ) -\u003e Result\u003c(), Self::CapabilityError\u003e;\n}\n","traces":[{"line":10,"address":[347664],"length":1,"stats":{"Line":17}},{"line":11,"address":[1073802],"length":1,"stats":{"Line":14}}],"covered":2,"coverable":2},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","src","main.rs"],"content":"use std::cell::RefCell;\nuse std::rc::Rc;\n\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::{\n    CapaWrapper, CapabilityStore, Domain, InterruptPolicy, MonitorAPI, Policies, Status as DStatus,\n};\nuse capa_engine::core::memory_region::*;\n\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn create_root_domain() -\u003e Capability\u003cDomain\u003e {\n    let policies = Policies::new(\n        !(0 as u64),\n        MonitorAPI::all(),\n        \u0026InterruptPolicy::default_all(),\n    );\n    let mut capa = Capability::\u003cDomain\u003e::new(Domain::new(policies));\n    capa.data.status = DStatus::Sealed;\n    capa\n}\n\nfn main() {\n    let mut domain = create_root_domain();\n    let region = create_root();\n    let reference = Rc::new(RefCell::new(region));\n    domain.data.install(CapaWrapper::Region(reference));\n    println!(\"The root domain:\\n{}\", domain);\n    println!(\n        \"Here is the size of a memory region capa {}\",\n        std::mem::size_of::\u003cCapability\u003cMemoryRegion\u003e\u003e()\n    );\n    println!(\n        \"Here is the size of a memory region capa {}\",\n        std::mem::size_of::\u003cCapability\u003cDomain\u003e\u003e()\n    );\n    println!(\n        \"sizes inside a domain: status {}, capabilities: {}, policies: {}\",\n        std::mem::size_of::\u003cStatus\u003e(),\n        std::mem::size_of::\u003cCapabilityStore\u003e(),\n        std::mem::size_of::\u003cPolicies\u003e()\n    );\n}\n","traces":[{"line":10,"address":[194992],"length":1,"stats":{"Line":0}},{"line":11,"address":[195081],"length":1,"stats":{"Line":0}},{"line":12,"address":[195006],"length":1,"stats":{"Line":0}},{"line":13,"address":[195011],"length":1,"stats":{"Line":0}},{"line":14,"address":[195016],"length":1,"stats":{"Line":0}},{"line":16,"address":[195072],"length":1,"stats":{"Line":0}},{"line":20,"address":[195184],"length":1,"stats":{"Line":0}},{"line":23,"address":[195291],"length":1,"stats":{"Line":0}},{"line":24,"address":[195301],"length":1,"stats":{"Line":0}},{"line":26,"address":[195349],"length":1,"stats":{"Line":0}},{"line":27,"address":[195395],"length":1,"stats":{"Line":0}},{"line":28,"address":[195417],"length":1,"stats":{"Line":0}},{"line":31,"address":[195766,195772,195456],"length":1,"stats":{"Line":0}},{"line":32,"address":[195483],"length":1,"stats":{"Line":0}},{"line":33,"address":[195496],"length":1,"stats":{"Line":0}},{"line":34,"address":[195544],"length":1,"stats":{"Line":0}},{"line":35,"address":[195606],"length":1,"stats":{"Line":0}},{"line":36,"address":[195671],"length":1,"stats":{"Line":0}}],"covered":0,"coverable":18},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","src","platform.rs"],"content":"use crate::capability::CapaError;\n\npub trait Platform {\n    fn set_register(dom: u64, core: usize, field: usize, value: usize);\n    fn get_register(dom: u64, core: usize, field: usize) -\u003e Result\u003cusize, CapaError\u003e;\n    fn get_interrupt(dom: u64, core: usize) -\u003e Result\u003cusize, CapaError\u003e;\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","src","server","engine.rs"],"content":"use std::collections::VecDeque;\nuse std::{cell::RefCell, rc::Rc};\n\nuse crate::core::capability::{CapaError, CapaRef, Capability, Ownership, WeakRef};\nuse crate::core::domain::CapaWrapper;\nuse crate::core::domain::{\n    Domain, Field, FieldType, InterruptPolicy, LocalCapa, MonitorAPI, Policies, Status,\n};\nuse crate::core::memory_region::{Access, Attributes, MemoryRegion, Remapped, ViewRegion};\nuse crate::core::platform_state::PlatformState;\nuse crate::core::update::{CoreUpdate, OperationUpdate, Update};\nuse crate::{is_core_subset, EngineInterface};\n\n/// Engine implementation.\n/// This is the entry point for all operations.\npub struct Engine\u003cP: PlatformState\u003e {\n    // The root lives in the engine.\n    pub root: CapaRef\u003cDomain\u003e,\n    pub scheduled: Vec\u003cWeakRef\u003cDomain\u003e\u003e,\n    pub updates: VecDeque\u003cVec\u003cUpdate\u003e\u003e,\n    pub core_update: Vec\u003cVec\u003cCoreUpdate\u003e\u003e,\n    pub platform: P,\n}\n\nimpl\u003cP: PlatformState\u003e Engine\u003cP\u003e {\n    fn is_sealed_and_allowed(\n        \u0026self,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        call: MonitorAPI,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        let dom = domain.borrow();\n        if dom.data.status != Status::Sealed {\n            return Err(CapaError::DomainUnsealed);\n        }\n        if !dom.data.operation_allowed(call) {\n            return Err(CapaError::CallNotAllowed);\n        }\n        Ok(())\n    }\n\n    pub fn add_root_region(\n        \u0026self,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        region: \u0026CapaRef\u003cMemoryRegion\u003e,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        let local_handle = {\n            let dom = \u0026mut domain.borrow_mut();\n            dom.data.install(CapaWrapper::Region(region.clone()))\n        };\n        let reg = \u0026mut region.borrow_mut();\n        reg.owned = Ownership::new(Rc::downgrade(domain), local_handle);\n        Ok(local_handle)\n    }\n\n    fn revoke_region_handler(capa: \u0026mut Capability\u003cMemoryRegion\u003e) -\u003e Result\u003c(), CapaError\u003e {\n        let owner = capa.owned.owner.upgrade().ok_or(CapaError::CapaNotOwned)?;\n        owner\n            .borrow_mut()\n            .data\n            .capabilities\n            .remove(\u0026capa.owned.handle)?;\n        Ok(())\n    }\n}\n\nimpl\u003cP: PlatformState\u003e EngineInterface for Engine\u003cP\u003e {\n    type CapaReference = CapaRef\u003cDomain\u003e;\n    type OwnedCapa = LocalCapa;\n    type CapabilityError = CapaError;\n\n    fn new(nb_cores: u64) -\u003e Self {\n        // Create the root capability for the domain.\n        let mut root = Domain::new(Policies::new(\n            (1 \u003c\u003c nb_cores) - 1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_all(),\n        ));\n        root.status = Status::Sealed;\n        let dom = Capability::\u003cDomain\u003e::new(root);\n        let ref_td = Rc::new(RefCell::new(dom));\n        Engine {\n            root: ref_td,\n            scheduled: Vec::new(), /*vec![\u0026ref_td; nb_cores]*/\n            updates: VecDeque::\u003cVec\u003cUpdate\u003e\u003e::new(),\n            core_update: Vec::new(),\n            platform: P::new(),\n        }\n    }\n\n    fn create(\n        \u0026mut self,\n        domain: \u0026CapaRef\u003cDomain\u003e,\n        cores: u64,\n        api: MonitorAPI,\n        interrupts: \u0026InterruptPolicy,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::CREATE)?;\n\n        let dom = \u0026mut domain.borrow_mut();\n        if !is_core_subset(dom.data.policies.cores, cores) {\n            return Err(CapaError::InsufficientRights);\n        }\n        let policies = Policies::new(cores, api, interrupts);\n        let child_dom = Domain::new(policies);\n\n        let capa = Capability::\u003cDomain\u003e::new(child_dom);\n        let reference = Rc::new(RefCell::new(capa));\n        dom.add_child(reference.clone(), Rc::downgrade(\u0026domain));\n        let local_capa = dom.data.install(CapaWrapper::Domain(reference));\n        Ok(local_capa)\n    }\n\n    fn set(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        child: LocalCapa,\n        core: u64,\n        tpe: FieldType,\n        field: Field,\n        value: u64,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SET)?;\n        // We are not setting registers\n        if tpe != FieldType::Register {\n            // Check if the domain is sealed in which case policies cannot be set.\n            if domain\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)?\n                .as_domain()?\n                .borrow()\n                .data\n                .is_sealed()\n            {\n                return Err(CapaError::DomainSealed);\n            }\n\n            // The fact that it is a subset will be checked at seal time for policies.\n            return domain\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)?\n                .as_domain()?\n                .borrow_mut()\n                .set(core, tpe, field, value);\n        }\n\n        // It is a platform set, check if the {interrupt, register} is allowed.\n        let child = domain.borrow().data.capabilities.get(\u0026child)?.as_domain()?;\n        let allowed = {\n            if !child.borrow().data.is_sealed() {\n                true\n            } else if let Some(vec) = self\n                .platform\n                .interrupt_info_on_core(Rc::downgrade(\u0026child), core)\n            {\n                //Check that the interrupt allows this field in the write set.\n                let mask = child\n                    .borrow()\n                    .data\n                    .get_policy(FieldType::InterruptWrite, vec.vector)?;\n                mask \u0026 (1 \u003c\u003c field) != 0\n            } else {\n                false\n            }\n        };\n\n        // The write is not allowed, return an error.\n        if !allowed {\n            return Err(CapaError::InvalidField);\n        }\n        self.platform\n            .set_register_on_core(Rc::downgrade(\u0026child), core, field, value)\n    }\n\n    fn get(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        child: LocalCapa,\n        core: u64,\n        tpe: FieldType,\n        field: Field,\n    ) -\u003e Result\u003cu64, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::GET)?;\n\n        //if tpe !=\n\n        domain\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child)?\n            .as_domain()?\n            .borrow()\n            .get(core, tpe, field)\n    }\n\n    fn seal(\u0026mut self, domain: CapaRef\u003cDomain\u003e, child: LocalCapa) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SEAL)?;\n\n        let current_policies = \u0026domain.borrow().data.policies;\n        // Check the child's policies are a subset of the parent.\n        if !current_policies.contains(\n            \u0026domain\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)?\n                .as_domain()?\n                .borrow()\n                .data\n                .policies,\n        ) {\n            return Err(CapaError::InsufficientRights);\n        }\n        domain.borrow().seal(child)\n    }\n\n    fn attest(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        other: Option\u003cLocalCapa\u003e,\n    ) -\u003e Result\u003cString, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ATTEST)?;\n\n        if let Some(child) = other {\n            return domain.borrow().attest(child);\n        }\n        let display = format!(\"{}\", domain.borrow());\n        return Ok(display);\n    }\n\n    fn enumerate(\u0026mut self, domain: CapaRef\u003cDomain\u003e, capa: LocalCapa) -\u003e Result\u003cString, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ENUMERATE)?;\n        let binding = domain.borrow();\n        let capa = binding.data.capabilities.get(\u0026capa)?;\n        match capa {\n            CapaWrapper::Region(r) =\u003e Ok(format!(\"{}\", r.borrow())),\n            CapaWrapper::Domain(d) =\u003e Ok(format!(\"{}\", d.borrow())),\n        }\n    }\n\n    fn switch(\u0026mut self, domain: CapaRef\u003cDomain\u003e, _capa: LocalCapa) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SWITCH)?;\n        todo!();\n    }\n\n    fn alias(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::ALIAS)?;\n\n        let dom = \u0026mut domain.borrow_mut();\n        let region = dom.data.capabilities.get(\u0026capa)?.as_region()?;\n        let aliased = region.borrow_mut().alias(access)?;\n        let aliased_capa = dom.data.install(CapaWrapper::Region(aliased.clone()));\n\n        // Tree \u0026 ownership logic.\n        aliased.borrow_mut().parent = Rc::downgrade(\u0026region);\n        aliased.borrow_mut().owned = Ownership::new(Rc::downgrade(\u0026domain), aliased_capa);\n        Ok(aliased_capa)\n    }\n\n    fn carve(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\n        access: \u0026Access,\n    ) -\u003e Result\u003cLocalCapa, CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::CARVE)?;\n\n        let mut updates = OperationUpdate::new();\n\n        let region = {\n            let dom = \u0026domain.borrow();\n            dom.data.capabilities.get(\u0026capa)?.as_region()?\n        };\n\n        // Carve can require updates if we reduce access rights.\n        if region.borrow().data.access.rights != access.rights {\n            updates.add(Update::ChangeMemory {\n                dom: Rc::downgrade(\u0026domain.clone()),\n            });\n        }\n        updates.snapshot()?;\n        //TODO: notify all cores\n\n        let dom = \u0026mut domain.borrow_mut();\n        let carved = region.borrow_mut().carve(access)?;\n        let carved_capa = dom.data.install(CapaWrapper::Region(carved.clone()));\n\n        // Tree \u0026 ownership logic.\n        carved.borrow_mut().parent = Rc::downgrade(\u0026region);\n        carved.borrow_mut().owned = Ownership::new(Rc::downgrade(\u0026domain), carved_capa);\n\n        updates.compute()?;\n        Ok(carved_capa)\n    }\n\n    fn revoke(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        capa: LocalCapa,\n        child: u64,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::REVOKE)?;\n\n        let is_domain = {\n            let dom = \u0026mut domain.borrow_mut();\n            dom.data.is_domain(capa)?\n        };\n        // Match directly on the wrapper while we hold the borrow\n        if is_domain {\n            // Prepare the update.\n            let mut update = OperationUpdate::new();\n            {\n                let dom = domain.borrow();\n                let d = dom.data.capabilities.get(\u0026capa)?.as_domain()?;\n                dom.on_revoke_child(\u0026d, \u0026mut update)?;\n            }\n            update.snapshot()?;\n            //TODO: notify all then we process the revoke.\n\n            let dom = \u0026mut domain.borrow_mut();\n            let d = dom.data.capabilities.get(\u0026capa)?.as_domain()?;\n\n            // Mark the domain as being revoked.\n            d.borrow_mut().data.status = Status::Revoked;\n            dom.revoke_child(\u0026d, \u0026mut |c: \u0026mut Capability\u003cDomain\u003e| {\n                c.data.status = Status::Revoked;\n                c.data\n                    .capabilities\n                    .foreach_region_mut(|c: \u0026CapaRef\u003cMemoryRegion\u003e| {\n                        Capability::\u003cMemoryRegion\u003e::revoke_node(c.clone(), \u0026mut |_c| Ok(()))\n                    })?;\n                c.data.capabilities.reset();\n                update.compute()?;\n                //TODO: notify\n                Ok(())\n            })?;\n            // Remove the handle\n            dom.data.capabilities.remove(\u0026capa)?;\n        } else {\n            let r = domain\n                .borrow_mut()\n                .data\n                .capabilities\n                .get(\u0026capa)?\n                .as_region()?;\n            // Drop borrow of dom before borrowing r\n            let child = {\n                let r_borrow = r.borrow();\n                r_borrow\n                    .children\n                    .get(child as usize)\n                    .cloned()\n                    .ok_or(CapaError::InvalidChildCapa)?\n            };\n\n            // Prepare the update, this finds affected domains.\n            let mut updates = OperationUpdate::new();\n            child.borrow().on_revoke(\u0026mut updates)?;\n            updates.snapshot()?;\n\n            // Now we should know all the affected domains.\n            // TODO: preempt and process them.\n\n            // Now actually do the revocation.\n            // The region might belong to the dom, so we need to drop the domain.\n            r.borrow_mut()\n                .revoke_child(\u0026child, \u0026mut |a| Self::revoke_region_handler(a))?;\n            updates.compute()?\n            // TODO Will need to notify\n        }\n\n        Ok(())\n    }\n\n    fn send(\n        \u0026mut self,\n        domain: CapaRef\u003cDomain\u003e,\n        dest: LocalCapa,\n        capa: LocalCapa,\n        remap: Remapped,\n        attributes: Attributes,\n    ) -\u003e Result\u003c(), CapaError\u003e {\n        self.is_sealed_and_allowed(\u0026domain, MonitorAPI::SEND)?;\n\n        // Perform all the checks to ensure the operation is allowed.\n        let dest = { domain.borrow().data.capabilities.get(\u0026dest)?.as_domain()? };\n\n        if dest.borrow().data.is_sealed()\n            \u0026\u0026 (!dest.borrow().data.operation_allowed(MonitorAPI::RECEIVE)\n                || !attributes.is_empty())\n        {\n            return Err(CapaError::CallNotAllowed);\n        }\n\n        // Check the attributes for the owner and conflicts in the dest.\n        {\n            let region = domain.borrow().data.capabilities.get(\u0026capa)?.as_region()?;\n            // Check attributes.\n            if region\n                .borrow()\n                .data\n                .attributes\n                .intersects(Attributes::VITAL | Attributes::CLEAN)\n            {\n                return Err(CapaError::InvalidAttributes);\n            }\n            // Check conflicts.\n            dest.borrow()\n                .check_conflict(\u0026ViewRegion::new(region.borrow().data.access, remap))?;\n        }\n\n        // Compute the updates, only trigger one if the dest is sealed.\n        let mut updates = OperationUpdate::new();\n        updates.add(Update::ChangeMemory {\n            dom: Rc::downgrade(\u0026domain.clone()),\n        });\n        if dest.borrow().data.is_sealed() {\n            updates.add(Update::ChangeMemory {\n                dom: Rc::downgrade(\u0026dest.clone()),\n            });\n        }\n        updates.snapshot()?;\n\n        // Now effect the send.\n        let dom = \u0026mut domain.borrow_mut();\n        let region = dom.data.capabilities.remove(\u0026capa)?.as_region()?;\n\n        // Apply the remapping and attributes.\n        {\n            let mut ref_reg = region.borrow_mut();\n            ref_reg.data.remapped = remap;\n            ref_reg.data.attributes = attributes;\n        };\n\n        let dest_capa = dest\n            .borrow_mut()\n            .data\n            .install(CapaWrapper::Region(region.clone()));\n        region.borrow_mut().owned = Ownership::new(Rc::downgrade(\u0026dest), dest_capa);\n\n        // Apply the updates.\n        updates.compute()?;\n        Ok(())\n    }\n}\n","traces":[{"line":24,"address":[847015,846704,847009],"length":1,"stats":{"Line":16}},{"line":29,"address":[834920],"length":1,"stats":{"Line":20}},{"line":30,"address":[1062862,1062923],"length":1,"stats":{"Line":46}},{"line":31,"address":[1062983],"length":1,"stats":{"Line":1}},{"line":33,"address":[951634,951680],"length":1,"stats":{"Line":58}},{"line":34,"address":[826540],"length":1,"stats":{"Line":1}},{"line":36,"address":[835147],"length":1,"stats":{"Line":29}},{"line":39,"address":[847040,847771,847765],"length":1,"s ay_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\"#;\n\n    // Check if the display output contains the root and child\n    assert_eq!(display_output, expected_output);\n\n    // Check the child.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Identity\";\n\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_multiple_children() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x1000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let a1 = root.alias(\u0026alias_access).expect(\"Error\");\n\n    let carve_access = Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026carve_access).expect(\"Error\");\n\n    // Get the display output of the root capability with its children\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\n| Carve at 0x3000 0x4000 with RW_ for .1\"#;\n\n    // Check if the display output contains the root and children\n    assert_eq!(display_output, expected_output);\n\n    // Check the children now.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Identity\";\n    assert_eq!(display_output, expected_output);\n\n    let display_output = format!(\"{}\", c1.borrow());\n    let expected_output = \"Exclusive 0x3000 0x4000 with RW_ mapped Identity\";\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_nested_children() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x2000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let a1 = root.alias(\u0026alias_access).expect(\"Error\");\n\n    let carve_access = Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE);\n    let c1 = a1.borrow_mut().carve(\u0026carve_access).expect(\"Error\");\n\n    // Get the display output of the root capability with its alias and nested carve\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x4000 with RWX for .0\"#; // Nested carve should also be .0\n\n    // Check if the display output contains the root and nested child\n    assert_eq!(display_output, expected_output);\n\n    // Check the alias.\n    let display_output = format!(\"{}\", a1.borrow());\n    let expected_output = r#\"Aliased 0x2000 0x4000 with RWX mapped Identity\n| Carve at 0x3000 0x4000 with RW_ for .0\"#;\n    assert_eq!(display_output, expected_output);\n\n    // Check the carve.\n    let display_output = format!(\"{}\", c1.borrow());\n    let expected_output = \"Aliased 0x3000 0x4000 with RW_ mapped Identity\";\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_display_with_remap() {\n    let mut root = create_root();\n    let alias_access = Access::new(\n        0x2000,\n        0x1000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    let alias_ref = root.alias(\u0026alias_access).expect(\"Error\");\n\n    // Change the remap to a non-identity one\n    alias_ref.borrow_mut().data.remapped = Remapped::Remapped(0x1000);\n\n    let display_output = format!(\"{}\", root);\n\n    let expected_output = r#\"Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x2000 0x3000 with RWX for .0\"#;\n\n    // Check if the display output contains the remap information\n    assert_eq!(display_output, expected_output);\n\n    // Check the remapped in the child.\n    let display_output = format!(\"{}\", alias_ref.borrow());\n    let expected_output = \"Aliased 0x2000 0x3000 with RWX mapped Remapped(0x1000)\";\n    assert_eq!(display_output, expected_output);\n}\n\n// ——————————————————— Testing the display of ViewRegions ——————————————————— //\n\nfn assert_view_display_eq(view: \u0026[ViewRegion], expected: \u0026[\u0026str]) {\n    let rendered: Vec\u003cString\u003e = view.iter().map(|v| v.to_string()).collect();\n    assert_eq!(rendered.len(), expected.len(), \"Length mismatch\");\n\n    for (i, (actual, expect)) in rendered.iter().zip(expected.iter()).enumerate() {\n        assert_eq!(\n            actual, expect,\n            \"Mismatch at index {}: got `{}`, expected `{}`\",\n            i, actual, expect\n        );\n    }\n}\n\n#[test]\nfn test_display_viewregion_identity() {\n    let base_access = Access::new(0x0, 0x10000, Rights::READ | Rights::WRITE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    let mut cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    // Carve out a region in the middle\n    let carved = Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE);\n    cap.carve(\u0026carved).unwrap();\n\n    let views = cap.view();\n\n    let expected = vec![\n        \"0x0 0x1000 with RW_ mapped Identity\",\n        \"0x2000 0x10000 with RW_ mapped Identity\",\n    ];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_display_viewregion_remapped() {\n    let base_access = Access::new(0x0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Remapped(0x4000),\n    };\n\n    let mut cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    // Carve out a region at the start\n    let carved = Access::new(\n        0x2000,\n        0x2000,\n        Rights::READ | Rights::WRITE | Rights::EXECUTE,\n    );\n    cap.carve(\u0026carved).unwrap();\n\n    let views = cap.view();\n\n    let expected = vec![\n        \"0x0 0x2000 with RWX mapped Remapped(0x4000)\",\n        \"0x4000 0x10000 with RWX mapped Remapped(0x8000)\",\n    ];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_display_viewregion_no_carves() {\n    let base_access = Access::new(0x0, 0x10000, Rights::WRITE);\n    let region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: base_access,\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    let cap = Capability::\u003cMemoryRegion\u003e::new(region);\n\n    let views = cap.view();\n\n    let expected = vec![\"0x0 0x10000 with _W_ mapped Identity\"];\n\n    assert_view_display_eq(\u0026views, \u0026expected);\n}\n\n#[test]\nfn test_view_with_alias() {\n    let mut capa = Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    });\n\n    capa.alias(\u0026Access::new(0x1400, 0x200, Rights::READ | Rights::WRITE))\n        .unwrap(); // should NOT affect view\n    let views = capa.view();\n    assert_view_display_eq(\u0026views, \u0026vec![\"0x1000 0x2000 with RW_ mapped Identity\"]);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","domain.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_domain() -\u003e Capability\u003cDomain\u003e {\n    let policies = Policies::new(0b111111, MonitorAPI::all(), \u0026InterruptPolicy::default_all());\n    let mut capa = Capability::\u003cDomain\u003e::new(Domain::new(policies));\n    capa.data.status = Status::Sealed;\n    capa\n}\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_empty_root_domain() {\n    let domain = create_root_domain();\n    let display_output = format!(\"{}\", domain);\n    let expected_output = format!(\"td0 = Sealed domain()\\n|cores: 0x3f\\n|mon.api: 0x1fff\\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\\n\");\n    assert_eq!(display_output, expected_output)\n}\n\n#[test]\nfn test_root_domain_with_root_memory() {\n    let mut domain = create_root_domain();\n    let region = create_root();\n    let reference = Rc::new(RefCell::new(region));\n    domain.data.install(CapaWrapper::Region(reference));\n\n    let display_output = format!(\"{}\", domain);\n    let expected_output = format!(\"td0 = Sealed domain(r0)\\n|cores: 0x3f\\n|mon.api: 0x1fff\\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\\n|indices: 1-\u003er0\\n\");\n    assert_eq!(display_output, expected_output);\n}\n\n#[test]\nfn test_unallowed_calls() {\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::ATTEST,\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // Let's seal the child directly.\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    // Now try to send it something.\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n\n    let res = engine.send(\n        td0.clone(),\n        child_td,\n        alias,\n        Remapped::Identity,\n        Attributes::empty(),\n    );\n    assert!(res.is_err());\n\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Now try to make the child do stuff while not sealed.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias,\n            Remapped::Identity,\n            Attributes::empty(),\n        )\n        .unwrap();\n\n    {\n        let child = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let access = Access::new(0x0, 0x1000, Rights::READ);\n        let res = engine.alias(child.clone(), 1, \u0026access);\n        assert_eq!(res, Err(CapaError::DomainUnsealed));\n    }\n\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Okay last one.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::CARVE,\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    let alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n    engine\n        .send(\n            td0.clone(),\n            child_td,\n            alias,\n            Remapped::Identity,\n            Attributes::empty(),\n        )\n        .unwrap();\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    {\n        let child = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let res = engine.alias(child.clone(), 1, \u0026Access::new(0x0, 0x1000, Rights::READ));\n        assert_eq!(res, Err(CapaError::CallNotAllowed));\n\n        let res = child.borrow().seal(1);\n        assert!(res.is_err());\n    }\n\n    // Okay try to reseal the same domain.\n    let res = engine.seal(td0.clone(), child_td);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n\n    // Try to seal something wrong.\n    let res = engine.seal(td0.clone(), td0_r0);\n    assert_eq!(res, Err(CapaError::WrongCapaType));\n    let res = td0.borrow().seal(td0_r0);\n    assert_eq!(res, Err(CapaError::WrongCapaType));\n}\n\n#[test]\nfn test_set_get() {\n    let (mut engine, td0, _r0, _td0_r0) = setup_engine_with_root();\n\n    // Create a child domain\n\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // First let's seal it and see if we read the right things.\n    engine.seal(td0.clone(), child_td).unwrap();\n\n    let cores = engine\n        .get(td0.clone(), child_td, 0, FieldType::Cores, 0)\n        .unwrap();\n    assert_eq!(cores, 1);\n\n    let api = engine\n        .get(td0.clone(), child_td, 0, FieldType::Api, 0)\n        .unwrap();\n    assert_eq!(api, MonitorAPI::all().bits() as u64);\n\n    for i in 0..NB_INTERRUPTS {\n        let vis = engine\n            .get(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptVisibility,\n                i as u64,\n            )\n            .unwrap();\n        let read = engine\n            .get(td0.clone(), child_td, 0, FieldType::InterruptRead, i as u64)\n            .unwrap();\n        let write = engine\n            .get(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptWrite,\n                i as u64,\n            )\n            .unwrap();\n        assert_eq!(vis, 0);\n        assert_eq!(read, !0);\n        assert_eq!(write, !0);\n    }\n\n    // Now attempt to change policies.\n    let res = engine.set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n    let res = engine.set(td0.clone(), child_td, 0, FieldType::Api, 0, 0);\n    assert_eq!(res, Err(CapaError::DomainSealed));\n    for i in 0..NB_INTERRUPTS {\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptVisibility,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptRead,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n        let res = engine.set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::InterruptWrite,\n            i as u64,\n            1,\n        );\n        assert_eq!(res, Err(CapaError::DomainSealed));\n    }\n\n    // Revoke and now lets do sets.\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n\n    // Create the new one and play with its values.\n    let child_td = engine\n        .create(\n            \u0026td0.clone(),\n            1,\n            MonitorAPI::empty(),\n            \u0026InterruptPolicy::default_none(),\n        )\n        .unwrap();\n\n    // Now attempt to change policies.\n    engine\n        .set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11)\n        .unwrap();\n    engine\n        .set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::Api,\n            0,\n            MonitorAPI::all().bits() as u64,\n        )\n        .unwrap();\n    for i in 0..NB_INTERRUPTS {\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptVisibility,\n                i as u64,\n                VectorVisibility::all().bits() as u64,\n            )\n            .unwrap();\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptRead,\n                i as u64,\n                0,\n            )\n            .unwrap();\n        engine\n            .set(\n                td0.clone(),\n                child_td,\n                0,\n                FieldType::InterruptWrite,\n                i as u64,\n                0,\n            )\n            .unwrap();\n    }\n\n    // Try to set a field that's above the allowed range.\n    let res = engine.set(\n        td0.clone(),\n        child_td,\n        0,\n        FieldType::InterruptVisibility,\n        (NB_INTERRUPTS + 2) as u64,\n        555,\n    );\n    assert_eq!(res, Err(CapaError::InvalidField));\n    // Same for get.\n    let res = engine.get(\n        td0.clone(),\n        child_td,\n        0,\n        FieldType::InterruptVisibility,\n        (NB_INTERRUPTS + 2) as u64,\n    );\n    assert_eq!(res, Err(CapaError::InvalidField));\n\n    // Let's try to see if we can overload the cores before sealing.\n    // This should work, but then we will see if when we attempt to seal.\n    engine\n        .set(\n            td0.clone(),\n            child_td,\n            0,\n            FieldType::Cores,\n            0,\n            0b11111111111111111,\n        )\n        .unwrap();\n\n    let res = engine.seal(td0.clone(), child_td);\n    assert_eq!(res, Err(CapaError::InsufficientRights));\n\n    engine\n        .set(td0.clone(), child_td, 0, FieldType::Cores, 0, 0b11)\n        .unwrap();\n    engine.seal(td0.clone(), child_td).unwrap();\n    engine.revoke(td0.clone(), child_td, 0).unwrap();\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","engine.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_engine_create_root_and_simple_child() {\n    // Initial setup\n    let (mut engine, ref_td, ref_mem, ref_region) = setup_engine_with_root();\n\n    assert_eq!(Rc::strong_count(\u0026ref_td), 2);\n    assert_eq!(Rc::weak_count(\u0026ref_td), 1);\n    assert_eq!(Rc::strong_count(\u0026ref_mem), 2);\n\n    {\n        // Create a child.\n        let child_td = engine\n            .create(\n                \u0026ref_td.clone(),\n                1,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n\n        // Create some regions.\n        let ref_aliased = engine\n            .alias(\n                ref_td.clone(),\n                ref_region,\n                \u0026Access::new(0x0, 0x2000, Rights::READ | Rights::WRITE),\n            )\n            .unwrap();\n        let ref_carved = engine\n            .carve(\n                ref_td.clone(),\n                ref_region,\n                \u0026Access::new(\n                    0x2000,\n                    0x2000,\n                    Rights::READ | Rights::WRITE | Rights::EXECUTE,\n                ),\n            )\n            .unwrap();\n\n        // Send the region, this moves the references.\n        engine\n            .send(\n                ref_td.clone(),\n                child_td,\n                ref_aliased,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n        engine\n            .send(\n                ref_td.clone(),\n                child_td,\n                ref_carved,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n\n        // Seal\n        engine.seal(ref_td.clone(), child_td).unwrap();\n\n        // Print the root domain.\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RW_ for r1\n| Carve at 0x2000 0x4000 with RWX for r2\nr1 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n\n        assert_eq!(display, expected);\n        // Print the child domain.\n        let child = ref_td\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026child_td)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now hack the engine to make a new capability appear.\n        let phantom = Rc::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(\n            MemoryRegion {\n                kind: RegionKind::Carve,\n                status: MStatus::Exclusive,\n                access: Access::new(\n                    0x15000,\n                    0x20000,\n                    Rights::READ | Rights::WRITE | Rights::EXECUTE,\n                ),\n                attributes: Attributes::NONE,\n                remapped: Remapped::Identity,\n            },\n        )));\n        let ref_phantom = child\n            .borrow_mut()\n            .data\n            .install(CapaWrapper::Region(phantom));\n\n        // Now do the attestation again, we should see a region that is not reported.\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2,r3)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RW_ for r1\n| Carve at 0x2000 0x4000 with RWX for r2\nr1 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now display the children again.\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x0 0x2000 with RW_ mapped Identity\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\nr2 = Exclusive 0x15000 0x35000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n        assert_eq!(display, expected);\n\n        // Remove the phantom.\n        _ = child.borrow_mut().data.remove(ref_phantom);\n\n        // Now we can revoke, let's first revoke one capa, then revoke the domain.\n        engine.revoke(ref_td.clone(), ref_region, 0).unwrap();\n\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x2000 0x4000 with RWX for r1\nr1 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        let display = format!(\"{}\", child.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x2000 0x4000 with RWX mapped Identity\n|indices: 2-\u003er0\n\"#;\n        assert_eq!(display, expected);\n\n        engine.revoke(ref_td.clone(), child_td, 0).unwrap();\n        let display = format!(\"{}\", ref_td.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n\n    assert_eq!(Rc::strong_count(\u0026ref_td), 2);\n    assert_eq!(Rc::weak_count(\u0026ref_td), 1);\n    assert_eq!(Rc::strong_count(\u0026ref_mem), 2);\n}\n\n#[test]\nfn test_engine_nested_child_revoke_td() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n    // Main logic.\n    let td0_td1 = {\n        // Let td0 create td1.\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        // Let's do a carve and an alias and send it to td1.\n        {\n            let td0_r0_carve = engine\n                .carve(\n                    td0.clone(),\n                    td0_r0,\n                    \u0026Access::new(0x0, 0x4000, Rights::all()),\n                )\n                .unwrap();\n            let td0_r0_alias = engine\n                .alias(\n                    td0.clone(),\n                    td0_r0,\n                    \u0026Access::new(0x5000, 0x1000, Rights::READ | Rights::WRITE),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td0.clone(),\n                    td0_td1,\n                    td0_r0_carve,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td0.clone(),\n                    td0_td1,\n                    td0_r0_alias,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            // Finally seal the td.\n            engine.seal(td0.clone(), td0_td1).unwrap();\n        }\n\n        // Now let's access td1 and create td2.\n        {\n            let td1 = \u0026td0.borrow().children[0];\n            let td1_td2 = engine\n                .create(\n                    \u0026td1.clone(),\n                    0b11,\n                    MonitorAPI::encapsulated(),\n                    \u0026InterruptPolicy::default_none(),\n                )\n                .unwrap();\n\n            // Now create the regions and send them.\n            let td1_carve = engine\n                .carve(td1.clone(), 1, \u0026Access::new(0x2000, 0x1000, Rights::all()))\n                .unwrap();\n            let td1_alias = engine\n                .alias(\n                    td1.clone(),\n                    1,\n                    \u0026Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_carve,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_alias,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine.seal(td1.clone(), td1_td2).unwrap();\n        }\n        td0_td1\n    };\n    // Let's check everything is well-formed.\n    {\n        // Check td0.\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2,r1,r2)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x4000 with RWX for r1\n| Alias at 0x5000 0x6000 with RW_ for r2\nr1 = Exclusive 0x0 0x4000 with RWX mapped Identity\nr2 = Aliased 0x5000 0x6000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Check td1\n        {\n            let c_td1 = \u0026td0.borrow().children[0];\n            let display = format!(\"{}\", c_td1.borrow());\n            let expected = r#\"td0 = Sealed domain(td1,r0,r1)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r2,r3)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x4000 with RWX mapped Identity\n| Carve at 0x2000 0x3000 with RWX for r2\n| Alias at 0x3000 0x4000 with RW_ for r3\nr1 = Aliased 0x5000 0x6000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr3 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Check td2\n        {\n            let display = format!(\n                \"{}\",\n                \u0026td0.borrow().children[0].borrow().children[0].borrow(),\n            );\n            let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr1 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Now we revoke td1 from td0.\n        engine.revoke(td0.clone(), td0_td1, 0).unwrap();\n        // Check td0\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n            assert_eq!(display, expected);\n\n            // Now check the structures.\n            assert_eq!(c_td0.children.len(), 0);\n            assert_eq!(c_td0.data.capabilities.capabilities.len(), 1);\n\n            let mem = c_td0\n                .data\n                .capabilities\n                .get(\u00261)\n                .unwrap()\n                .as_region()\n                .unwrap();\n            assert_eq!(mem.borrow().children.len(), 0);\n        }\n    }\n\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_nested_revoke_r1() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n    // Main logic.\n    let td0_td1 = {\n        // Let td0 create td1.\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        // Let's do a carve and an alias and send it to td1.\n        {\n            let td0_r0_carve = engine\n                .carve(\n                    td0.clone(),\n                    td0_r0,\n                    \u0026Access::new(0x0, 0x4000, Rights::all()),\n                )\n                .unwrap();\n            let td0_r0_alias = engine\n                .alias(\n                    td0.clone(),\n                    td0_r0,\n                    \u0026Access::new(0x5000, 0x1000, Rights::READ | Rights::WRITE),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td0.clone(),\n                    td0_td1,\n                    td0_r0_carve,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td0.clone(),\n                    td0_td1,\n                    td0_r0_alias,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            // Finally seal the td.\n            engine.seal(td0.clone(), td0_td1).unwrap();\n        }\n\n        // Now let's access td1 and create td2.\n        {\n            let td1 = \u0026td0.borrow().children[0];\n            let td1_td2 = engine\n                .create(\n                    \u0026td1.clone(),\n                    0b11,\n                    MonitorAPI::encapsulated(),\n                    \u0026InterruptPolicy::default_none(),\n                )\n                .unwrap();\n\n            // Now create the regions and send them.\n            let td1_carve = engine\n                .carve(td1.clone(), 1, \u0026Access::new(0x2000, 0x1000, Rights::all()))\n                .unwrap();\n            let td1_alias = engine\n                .alias(\n                    td1.clone(),\n                    1,\n                    \u0026Access::new(0x3000, 0x1000, Rights::READ | Rights::WRITE),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_carve,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine\n                .send(\n                    td1.clone(),\n                    td1_td2,\n                    td1_alias,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            engine.seal(td1.clone(), td1_td2).unwrap();\n        }\n        td0_td1\n    };\n    // Let's check everything is well-formed.\n    {\n        // Check td0.\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2,r1,r2)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x4000 with RWX for r1\n| Alias at 0x5000 0x6000 with RW_ for r2\nr1 = Exclusive 0x0 0x4000 with RWX mapped Identity\nr2 = Aliased 0x5000 0x6000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Check td1\n        {\n            let c_td1 = \u0026td0.borrow().children[0];\n            let display = format!(\"{}\", c_td1.borrow());\n            let expected = r#\"td0 = Sealed domain(td1,r0,r1)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r2,r3)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x4000 with RWX mapped Identity\n| Carve at 0x2000 0x3000 with RWX for r2\n| Alias at 0x3000 0x4000 with RW_ for r3\nr1 = Aliased 0x5000 0x6000 with RW_ mapped Identity\nr2 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr3 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Check td2\n        {\n            let display = format!(\n                \"{}\",\n                \u0026td0.borrow().children[0].borrow().children[0].borrow(),\n            );\n            let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr1 = Aliased 0x3000 0x4000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n            assert_eq!(display, expected);\n        }\n        // Now we revoke td1's r1 from td0.\n        engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n        // Check td0\n        {\n            let c_td0 = \u0026td0.borrow();\n            let display = format!(\"{}\", c_td0);\n            let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2,r1)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x5000 0x6000 with RW_ for r1\nr1 = Aliased 0x5000 0x6000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n\n            // Now check the structures.\n            assert_eq!(

c_td0.children.len(), 1);\n            assert_eq!(c_td0.data.capabilities.capabilities.len(), 2);\n\n            let mem = c_td0\n                .data\n                .capabilities\n                .get(\u0026td0_r0)\n                .unwrap()\n                .as_region()\n                .unwrap();\n            assert_eq!(mem.borrow().children.len(), 1);\n        }\n        // Check td1\n        {\n            let c_td1 = \u0026td0.borrow().children[0];\n            let display = format!(\"{}\", c_td1.borrow());\n            let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x3\n|mon.api: 0xe0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x5000 0x6000 with RW_ mapped Identity\n|indices: 2-\u003er0 3-\u003etd1\n\"#;\n            assert_eq!(display, expected);\n\n            // Now check the structures.\n            assert_eq!(c_td1.borrow().children.len(), 1);\n            assert_eq!(c_td1.borrow().data.capabilities.capabilities.len(), 2);\n\n            let mem = c_td1\n                .borrow()\n                .data\n                .capabilities\n                .get(\u00262)\n                .unwrap()\n                .as_region()\n                .unwrap();\n            assert_eq!(mem.borrow().children.len(), 0);\n        }\n        engine.revoke(td0.clone(), td0_td1, 0).unwrap();\n    }\n\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_two_children_revoke_aliased_twice() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    {\n        // Let td0 create td1.\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n        // Let td0 create td2\n        let td0_td2 = engine\n            .create(\n                \u0026td0.clone(),\n                0b111,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        // Carve a region.\n        let td0_carve = engine\n            .carve(\n                td0.clone(),\n                td0_r0,\n                \u0026Access::new(0x0, 0x2000, Rights::all()),\n            )\n            .unwrap();\n\n        // Do two aliases.\n        let td0_alias_td1 = engine\n            .alias(\n                td0.clone(),\n                td0_carve,\n                \u0026Access::new(0x0, 0x2000, Rights::all()),\n            )\n            .unwrap();\n        let td0_alias_td2 = engine\n            .alias(\n                td0.clone(),\n                td0_carve,\n                \u0026Access::new(0x0, 0x1000, Rights::all()),\n            )\n            .unwrap();\n        // Send the capas.\n        engine\n            .send(\n                td0.clone(),\n                td0_td1,\n                td0_alias_td1,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n        engine\n            .send(\n                td0.clone(),\n                td0_td2,\n                td0_alias_td2,\n                Remapped::Identity,\n                Attributes::empty(),\n            )\n            .unwrap();\n\n        // Seal the domains.\n        engine.seal(td0.clone(), td0_td1).unwrap();\n        engine.seal(td0.clone(), td0_td2).unwrap();\n\n        // Now check the output.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r2)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(r3)\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x2000 with RWX for r1\nr1 = Exclusive 0x0 0x2000 with RWX mapped Identity\n| Alias at 0x0 0x2000 with RWX for r2\n| Alias at 0x0 0x1000 with RWX for r3\nr2 = Aliased 0x0 0x2000 with RWX mapped Identity\nr3 = Aliased 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2 4-\u003er1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke the carve.\n        engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n\n        // Now make sure the display is correct.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain()\n|cores: 0x7\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke both domains.\n        engine.revoke(td0.clone(), td0_td1, 0).unwrap();\n        engine.revoke(td0.clone(), td0_td2, 0).unwrap();\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_nested_domains_three_branches() {\n    // Initial setup\n    let (mut engine, td0, r0, _) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    let mut create_three_domains = |capa_me: \u0026CapaRef\u003cDomain\u003e| -\u003e Vec\u003cLocalCapa\u003e {\n        let mut handles: Vec\u003cLocalCapa\u003e = Vec::new();\n        for _i in 0..3 {\n            let local = engine\n                .create(\n                    \u0026capa_me.clone(),\n                    0x1,\n                    MonitorAPI::all(),\n                    \u0026InterruptPolicy::default_all(),\n                )\n                .unwrap();\n            handles.push(local);\n            engine.seal(capa_me.clone(), local).unwrap();\n        }\n        handles\n    };\n\n    {\n        let handles_td0 = create_three_domains(\u0026td0);\n        for child in \u0026td0.borrow().children {\n            let _ = create_three_domains(\u0026child);\n            for grandchild in \u0026child.borrow().children {\n                let _ = create_three_domains(\u0026grandchild);\n            }\n        }\n\n        // Now make sure everyone has three children.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,td2,td3,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td4,td5,td6)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(td7,td8,td9)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd3 = Sealed domain(td10,td11,td12)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1 3-\u003etd2 4-\u003etd3\n\"#;\n        assert_eq!(display, expected);\n\n        // Now attest each of the children.\n        for i in \u0026handles_td0 {\n            let child = td0\n                .borrow()\n                .data\n                .capabilities\n                .get(i)\n                .unwrap()\n                .as_domain()\n                .unwrap();\n            let display = format!(\"{}\", child.borrow());\n            let expected = r#\"td0 = Sealed domain(td1,td2,td3)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td4,td5,td6)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd2 = Sealed domain(td7,td8,td9)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd3 = Sealed domain(td10,td11,td12)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\n|indices: 1-\u003etd1 2-\u003etd2 3-\u003etd3\n\"#;\n            assert_eq!(display, expected);\n        }\n\n        // Now revoke them\n        for i in \u0026handles_td0 {\n            engine.revoke(td0.clone(), *i, 0).unwrap();\n        }\n\n        // Display td0\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_reclaim_from_grand_child() {\n    // Initial setup\n    let (mut engine, td0, r0, td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    let carve = engine\n        .carve(\n            td0.clone(),\n            td0_r0,\n            \u0026Access::new(0x0, 0x1000, Rights::all()),\n        )\n        .unwrap();\n\n    {\n        let mut current: CapaRef\u003cDomain\u003e = td0.clone();\n        let mut to_send: LocalCapa = carve;\n        for _i in 0..5 {\n            let child = engine\n                .create(\n                    \u0026current.clone(),\n                    0b1,\n                    MonitorAPI::all(),\n                    \u0026InterruptPolicy::default_all(),\n                )\n                .unwrap();\n            engine.seal(current.clone(), child).unwrap();\n            engine\n                .send(\n                    current.clone(),\n                    child,\n                    to_send,\n                    Remapped::Identity,\n                    Attributes::empty(),\n                )\n                .unwrap();\n            // Update to point to the child.\n            let child_ref = current\n                .borrow()\n                .data\n                .capabilities\n                .get(\u0026child)\n                .unwrap()\n                .as_domain()\n                .unwrap();\n            current = child_ref;\n            to_send = 1;\n        }\n\n        // Now check the child that has the region.\n        let display = format!(\"{}\", current.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke from td0.\n        engine.revoke(td0.clone(), td0_r0, 0).unwrap();\n\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(td2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 3-\u003etd1\n\"#;\n        assert_eq!(display, expected);\n\n        // Now revoke the domains in cascade.\n        engine.revoke(td0.clone(), 3, 0).unwrap();\n\n        // Check it worked.\n        let display = format!(\"{}\", td0.borrow());\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(display, expected);\n    }\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n}\n\n#[test]\nfn test_engine_policies_core_fail() {\n    // Initial setup\n    let (mut engine, td0, r0, _td0_r0) = setup_engine_with_root();\n    assert_eq!(Rc::strong_count(\u0026td0), 2);\n    assert_eq!(Rc::weak_count(\u0026td0), 1);\n    assert_eq!(Rc::strong_count(\u0026r0), 2);\n\n    // Let td0 create a domain and that domain try to gain more writes.\n    {\n        let mut api_without_send_rcv = MonitorAPI::all();\n        api_without_send_rcv.remove(MonitorAPI::SEND | MonitorAPI::RECEIVE);\n        let td0_td1 = engine\n            .create(\n                \u0026td0.clone(),\n                0b1,\n                api_without_send_rcv,\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n        engine.seal(td0.clone(), td0_td1).unwrap();\n\n        // Now let the domain try to create a new one with more cores.\n        let td1 = td0\n            .borrow()\n            .data\n            .capabilities\n            .get(\u0026td0_td1)\n            .unwrap()\n            .as_domain()\n            .unwrap();\n\n        let td2_err = engine.create(\n            \u0026td1.clone(),\n            0x2,\n            MonitorAPI::all(),\n            \u0026InterruptPolicy::default_all(),\n        );\n        assert!(td2_err.is_err());\n\n        // Now let's try the wrong interrupt policies.\n        let td1_td2 = engine\n            .create(\n                \u0026td1.clone(),\n                0b1,\n                api_without_send_rcv,\n                \u0026InterruptPolicy::default_all(),\n            )\n            .unwrap();\n\n        assert!(engine.seal(td1.clone(), td1_td2).is_err());\n\n        // Now let's try the wrong api policies.\n        engine.revoke(td1.clone(), td1_td2, 0).unwrap();\n        let td1_td2 = engine\n            .create(\n                \u0026td1.clone(),\n                0b1,\n                MonitorAPI::all(),\n                \u0026InterruptPolicy::default_none(),\n            )\n            .unwrap();\n\n        assert!(engine.seal(td1.clone(), td1_td2).is_err());\n    }\n}\n\n#[test]\nfn test_engine_alias_then_carve_root() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n    let err = engine.carve(td0.clone(), td0_r0, \u0026access);\n    assert!(err.is_err());\n\n    // Try to alias it a second time.\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026access).unwrap();\n\n    // Do the display.\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x1000 with RWX for r1\n| Alias at 0x0 0x1000 with RWX for r2\nr1 = Aliased 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n    assert_eq!(display, expected);\n}\n\n#[test]\nfn test_engine_alias_carve_root() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    let access = Access::new(0x0, 0x1000, Rights::all());\n    let carve = engine.carve(td0.clone(), td0_r0, \u0026access).unwrap();\n    let err = engine.alias(td0.clone(), td0_r0, \u0026access);\n    assert!(err.is_err());\n\n    // Try to alias it a second time.\n    let carve2 = engine.carve(td0.clone(), td0_r0, \u0026access);\n    assert!(carve2.is_err());\n\n    // Carve the carve.\n    engine.carve(td0.clone(), carve, \u0026access).unwrap();\n\n    // Do the display.\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1,r2)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r2\nr2 = Exclusive 0x0 0x1000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1 3-\u003er2\n\"#;\n    assert_eq!(display, expected);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","local_client.rs"],"content":"use capa_engine::client::engine::Engine;\nuse capa_engine::client::local_client::LocalClient;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup() -\u003e Engine\u003cLocalClient\u003e {\n    let engine = Engine::\u003cLocalClient\u003e::new(16);\n\n    let root_region = create_root_region();\n    let root_region2 = create_root_region();\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_mem2 = Rc::new(RefCell::new(root_region2));\n    let _ = engine\n        .platform\n        .server\n        .add_root_region(\u0026engine.platform.current.clone(), \u0026ref_mem)\n        .unwrap();\n    // Cheat to add a root region for client engine.\n    let _ = engine\n        .add_root_region(\u0026engine.current.clone(), \u0026ref_mem2)\n        .unwrap();\n    engine\n}\n\n#[test]\nfn test_client_create() {\n    let mut client = setup();\n\n    // Check that the initial attesttion is correct.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Create and attest again.\n    let child_td = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Unsealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Seal it and attest again.\n    client.r_seal(\u0026child_td).unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain()\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n}\n\n#[test]\nfn test_client_alias() {\n    let mut client = setup();\n\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x0,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x1000 with RW_ for r1\nr1 = Aliased 0x0 0x1000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Check r1 is correct too.\n    let display = format!(\"{}\", r1.borrow());\n    let expected = \"Aliased 0x0 0x1000 with RW_ mapped Identity\";\n    assert_eq!(display, expected)\n}\n\n#[test]\nfn test_client_carve() {\n    let mut client = setup();\n\n    // We have only one region.\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_carve(\n            \u0026r0.clone(),\n            0x0,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RW_ for r1\nr1 = Exclusive 0x0 0x1000 with RW_ mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Check r1 is correct too.\n    let display = format!(\"{}\", r1.borrow());\n    let expected = \"Exclusive 0x0 0x1000 with RW_ mapped Identity\";\n    assert_eq!(display, expected)\n}\n\n#[test]\nfn test_client_child_alias_carve() {\n    let mut client = setup();\n\n    // We have only one region.\n    let r0 = client.find_region(|_x| true).unwrap();\n    let r1 = client\n        .r_carve(\u0026r0.clone(), 0x0, 0x1000, Rights::all().bits())\n        .unwrap();\n\n    let r2 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x1000,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n\n    let td1 = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n\n    client\n        .r_send(\u0026td1.clone(), \u0026r1, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client\n        .r_send(\u0026td1.clone(), \u0026r2, Remapped::Identity, Attributes::empty())\n        .unwrap();\n\n    client.r_seal(\u0026td1.clone()).unwrap();\n\n    // Check we have the right attestations.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\n|indices: 1-\u003er0 4-\u003etd1\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Try the revoke.\n    client.r_revoke_child(\u0026td1.clone()).unwrap();\n\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n    // Check the local state too.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n}\n\n#[test]\nfn test_client_multiple_children() {\n    let mut client = setup();\n\n    let r0 = client.find_region(|_| true).unwrap();\n    let r1 = client\n        .r_carve(\u0026r0.clone(), 0x0, 0x1000, Rights::all().bits())\n        .unwrap();\n    let r2 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x1000,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n    let r3 = client\n        .r_alias(\n            \u0026r0.clone(),\n            0x1000,\n            0x1000,\n            (Rights::READ | Rights::WRITE).bits(),\n        )\n        .unwrap();\n    let r4 = client\n        .r_carve(\u0026r0.clone(), 0x2000, 0x1000, Rights::all().bits())\n        .unwrap();\n\n    let td1 = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n    let td2 = client\n        .r_create(0x2, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n    client\n        .r_send(\u0026td1.clone(), \u0026r1, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client\n        .r_send(\u0026td1.clone(), \u0026r2, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client.r_seal(\u0026td1.clone()).unwrap();\n\n    client\n        .r_send(\u0026td2.clone(), \u0026r3, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client\n        .r_send(\u0026td2.clone(), \u0026r4, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client.r_seal(\u0026td2.clone()).unwrap();\n\n    // Double children.\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\ntd2 = Sealed domain(r3,r4)\n|cores: 0x2\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\n| Alias at 0x1000 0x2000 with RW_ for r3\n| Carve at 0x2000 0x3000 with RWX for r4\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr3 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr4 = Exclusive 0x2000 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 6-\u003etd1 7-\u003etd2\n\"#;\n    assert_eq!(attestation, expected);\n    // Check the local state now.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Now do something weird.\n    let r5 = client\n        .r_alias(\u0026r0.clone(), 0x5000, 0x1000, Rights::all().bits())\n        .unwrap();\n    let r6 = client\n        .r_alias(\u0026r5.clone(), 0x5000, 0x1000, Rights::all().bits())\n        .unwrap();\n\n    client\n        .r_send(\u0026td2.clone(), \u0026r5, Remapped::Identity, Attributes::empty())\n        .unwrap();\n    client\n        .r_send(\u0026td1.clone(), \u0026r6, Remapped::Identity, Attributes::empty())\n        .unwrap();\n\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2,r6)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\ntd2 = Sealed domain(r3,r4,r5)\n|cores: 0x2\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\n| Alias at 0x1000 0x2000 with RW_ for r3\n| Carve at 0x2000 0x3000 with RWX for r4\n| Alias at 0x5000 0x6000 with RWX for r5\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr3 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr4 = Exclusive 0x2000 0x3000 with RWX mapped Identity\nr5 = Aliased 0x5000 0x6000 with RWX mapped Identity\n|indices: 1-\u003er0 6-\u003etd1 7-\u003etd2\n\"#;\n    assert_eq!(attestation, expected);\n\n    // Check the local state.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Now revoke the r5 child.\n    client.r_revoke_region(\u0026r5).unwrap();\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(td1,td2,r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\ntd1 = Sealed domain(r1,r2)\n|cores: 0x1\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\ntd2 = Sealed domain(r3,r4)\n|cores: 0x2\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Carve at 0x0 0x1000 with RWX for r1\n| Alias at 0x1000 0x2000 with RW_ for r2\n| Alias at 0x1000 0x2000 with RW_ for r3\n| Carve at 0x2000 0x3000 with RWX for r4\nr1 = Exclusive 0x0 0x1000 with RWX mapped Identity\nr2 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr3 = Aliased 0x1000 0x2000 with RW_ mapped Identity\nr4 = Exclusive 0x2000 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 6-\u003etd1 7-\u003etd2\n\"#;\n    assert_eq!(attestation, expected);\n    // Check locally\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n\n    // Now revoke everything.\n    client.r_revoke_child(\u0026td2).unwrap();\n    client.r_revoke_child(\u0026td1).unwrap();\n\n    let attestation = client.r_attest(None).unwrap();\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n    // Check the local state.\n    let attestation = format!(\"{}\", client.current.borrow());\n    assert_eq!(attestation, expected);\n}\n\n#[test]\nfn test_client_exercise_set_get() {\n    let mut client = setup();\n\n    let td1 = client\n        .r_create(0x1, MonitorAPI::all(), InterruptPolicy::default_none())\n        .unwrap();\n\n    // Change cores.\n    client\n        .r_set(\u0026td1.clone(), 0, FieldType::Cores, 0, 0x22)\n        .unwrap();\n    // Get it and check.\n    let v = client.r_get(\u0026td1.clone(), 0, FieldType::Cores, 0).unwrap();\n    assert_eq!(v, 0x22);\n\n    // Check local and remote attestation.\n    let attestation = format!(\"{}\", td1.borrow());\n    let expected = r#\"td0 = Unsealed domain()\n|cores: 0x22\n|mon.api: 0x1fff\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\n\"#;\n    assert_eq!(attestation, expected);\n    let attestation = client.r_attest(Some(\u0026td1.clone())).unwrap();\n    assert_eq!(attestation, expected);\n\n    // Change the monitor API.\n    client\n        .r_set(\n            \u0026td1.clone(),\n            0,\n            FieldType::Api,\n            0,\n            MonitorAPI::RECEIVE.bits() as u64,\n        )\n        .unwrap();\n    // Get it and check.\n    let v = client.r_get(\u0026td1.clone(), 0, FieldType::Api, 0).unwrap();\n    assert_eq!(v, MonitorAPI::RECEIVE.bits() as u64);\n\n    // Check local and remote attestation.\n    let attestation = format!(\"{}\", td1.borrow());\n    let expected = r#\"td0 = Unsealed domain()\n|cores: 0x22\n|mon.api: 0x1000\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\n\"#;\n    assert_eq!(attestation, expected);\n    let attestation = client.r_attest(Some(\u0026td1.clone())).unwrap();\n    assert_eq!(attestation, expected);\n\n    // Now go through the vectors.\n    for i in 0..NB_INTERRUPTS {\n        client\n            .r_set(\n                \u0026td1.clone(),\n                0,\n                FieldType::InterruptVisibility,\n                i as u64,\n                VectorVisibility::ALLOWED.bits() as u64,\n            )\n            .unwrap();\n        client\n            .r_set(\n                \u0026td1.clone(),\n                0,\n                FieldType::InterruptRead,\n                i as u64,\n                i as u64,\n            )\n            .unwrap();\n        client\n            .r_set(\n                \u0026td1.clone(),\n                0,\n                FieldType::InterruptWrite,\n                i as u64,\n                i as u64,\n            )\n            .unwrap();\n        // Now do the gets.\n        let vis = client\n            .r_get(\u0026td1.clone(), 0, FieldType::InterruptVisibility, i as u64)\n            .unwrap();\n        let read = client\n            .r_get(\u0026td1.clone(), 0, FieldType::InterruptRead, i as u64)\n            .unwrap();\n        let write = client\n            .r_get(\u0026td1.clone(), 0, FieldType::InterruptWrite, i as u64)\n            .unwrap();\n        assert_eq!(vis, VectorVisibility::ALLOWED.bits() as u64);\n        assert_eq!(read, i as u64);\n        assert_eq!(write, i as u64);\n    }\n}\n\n#[test]\nfn test_client_100_children() {\n    let mut client = setup();\n\n    let r0 = client.find_region(|_x| true).unwrap();\n    for _i in 0..100 {\n        let child = client\n            .r_create(0x1, MonitorAPI::empty(), InterruptPolicy::default_none())\n            .unwrap();\n        let r = client\n            .r_alias(\u0026r0.clone(), 0x2000, 0x1000, Rights::all().bits())\n            .unwrap();\n        client\n            .r_send(\u0026child.clone(), \u0026r, Remapped::Identity, Attributes::empty())\n            .unwrap();\n        client.r_seal(\u0026child).unwrap();\n    }\n\n    // Compare the two attestations.\n    let local = format!(\"{}\", client.current.borrow());\n    let remote = client.r_attest(None).unwrap();\n    assert_eq!(local, remote);\n    // Check the first line of the attestation.\n    {\n        assert_eq!(*local\n            .split(\"\\n\")\n            .collect::\u003cVec\u003c_\u003e\u003e()\n            .get(0)\n            .unwrap(), \"td0 = Sealed domain(td1,td2,td3,td4,td5,td6,td7,td8,td9,td10,td11,td12,td13,td14,td15,td16,td17,td18,td19,td20,td21,td22,td23,td24,td25,td26,td27,td28,td29,td30,td31,td32,td33,td34,td35,td36,td37,td38,td39,td40,td41,td42,td43,td44,td45,td46,td47,td48,td49,td50,td51,td52,td53,td54,td55,td56,td57,td58,td59,td60,td61,td62,td63,td64,td65,td66,td67,td68,td69,td70,td71,td72,td73,td74,td75,td76,td77,td78,td79,td80,td81,td82,td83,td84,td85,td86,td87,td88,td89,td90,td91,td92,td93,td94,td95,td96,td97,td98,td99,td100,r0)\");\n    }\n\n    // Now use find_child to loop and kill all the kids.\n    let mut child = client.find_child(|_x| true);\n    while child.is_some() {\n        let c = child.unwrap();\n        // Enumerate the child.\n        let handle = c.borrow().owned.handle;\n        let enumerate = client.enumerate(client.current.clone(), handle).unwrap();\n        let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0x1\n|mon.api: 0x0\n|vec0-255: NOT REPORTED, r: 0xffffffffffffffff, w: 0xffffffffffffffff\nr0 = Aliased 0x2000 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n        assert_eq!(enumerate, expected);\n        // Do a wrong enumerate.\n        let err = client.enumerate(client.current.clone(), 2000);\n        assert!(err.is_err());\n\n        client.r_revoke_child(\u0026c).unwrap();\n        child = client.find_child(|_x| true);\n    }\n\n    // Attest everything is good.\n    let attestation = format!(\"{}\", client.current.borrow());\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(attestation, expected);\n\n    let attestation = client.r_attest(None).unwrap();\n    assert_eq!(attestation, expected);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","memory_region.rs"],"content":"use capa_engine::core::capability::*;\nuse capa_engine::core::memory_region::*;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\n#[test]\nfn test_valid_carve() {\n    let mut root = create_root();\n    let access = Access::new(0x2000, 0x1000, Rights::READ | Rights::WRITE);\n    let result = root.carve(\u0026access);\n    assert!(result.is_ok());\n\n    let carved = result.unwrap();\n    let carved_borrow = carved.borrow();\n\n    assert_eq!(carved_borrow.data.kind, RegionKind::Carve);\n    assert_eq!(carved_borrow.data.status, Status::Exclusive);\n    assert_eq!(carved_borrow.data.access, access);\n}\n\n#[test]\nfn test_valid_alias() {\n    let mut root = create_root();\n    let access = Access::new(0x2000, 0x1000, Rights::READ);\n    let result = root.alias(\u0026access);\n    assert!(result.is_ok());\n\n    let alias = result.unwrap();\n    let alias_borrow = alias.borrow();\n\n    assert_eq!(alias_borrow.data.kind, RegionKind::Alias);\n    assert_eq!(alias_borrow.data.status, Status::Aliased);\n    assert_eq!(alias_borrow.data.access, access);\n}\n\n#[test]\nfn test_carve_overlap_rejected() {\n    let mut root = create_root();\n\n    let c1 = Access::new(0x2000, 0x1000, Rights::READ);\n    assert!(root.carve(\u0026c1).is_ok());\n\n    // Overlaps with previous carve\n    let overlapping = Access::new(0x2800, 0x1000, Rights::READ);\n    let result = root.carve(\u0026overlapping);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_alias_overlap_with_carve_rejected() {\n    let mut root = create_root();\n\n    let c1 = Access::new(0x3000, 0x1000, Rights::READ);\n    assert!(root.carve(\u0026c1).is_ok());\n\n    // Aliases are no longer possible\n    let a1 = Access::new(0x3000, 0x1000, Rights::READ);\n    let result = root.alias(\u0026a1);\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_carve_out_of_bounds() {\n    let mut root = create_root();\n\n    // Beyond the root region\n    let access = Access::new(0x20000, 0x1000, Rights::READ);\n    let result = root.carve(\u0026access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_alias_with_extra_rights_rejected() {\n    let mut root = create_root();\n\n    // Root does not give WRITE or EXECUTE\n    root.data.access.rights = Rights::READ;\n\n    let access = Access::new(0x1000, 0x1000, Rights::READ | Rights::WRITE);\n    let result = root.alias(\u0026access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n// ——————————————————————————— Nested operations ———————————————————————————— //\n\n#[test]\nfn test_nested_carve() {\n    let mut root = create_root();\n\n    // Carve a sub-region from the root\n    let c1_access = Access::new(0x2000, 0x4000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026c1_access).expect(\"root carve failed\");\n\n    // Carve from the carved region\n    let mut c1_borrow = c1.borrow_mut();\n    let c2_access = Access::new(0x3000, 0x1000, Rights::READ);\n    let c2 = c1_borrow.carve(\u0026c2_access).expect(\"nested carve failed\");\n\n    let c2_borrow = c2.borrow();\n    assert_eq!(c2_borrow.data.access, c2_access);\n    assert_eq!(c2_borrow.data.status, Status::Exclusive);\n    assert_eq!(c2_borrow.data.kind, RegionKind::Carve);\n    assert_eq!(c2_borrow.data.remapped, Remapped::Identity);\n}\n\n#[test]\nfn test_nested_alias() {\n    let mut root = create_root();\n\n    let c1_access = Access::new(0x1000, 0x2000, Rights::READ | Rights::WRITE);\n    let c1 = root.carve(\u0026c1_access).expect(\"carve failed\");\n\n    let mut c1_borrow = c1.borrow_mut();\n    let a1_access = Access::new(0x1800, 0x800, Rights::READ);\n    let a1 = c1_borrow\n        .alias(\u0026a1_access)\n        .expect(\"alias from carve failed\");\n\n    let a1_borrow = a1.borrow();\n    assert_eq!(a1_borrow.data.kind, RegionKind::Alias);\n    assert_eq!(a1_borrow.data.status, Status::Aliased);\n    assert_eq!(a1_borrow.data.access, a1_access);\n}\n\n#[test]\nfn test_nested_carve_invalid_due_to_rights() {\n    let mut root = create_root();\n\n    let carve_access = Access::new(0x0, 0x4000, Rights::READ);\n    let carve = root.carve(\u0026carve_access).expect(\"carve failed\");\n\n    let mut carve_borrow = carve.borrow_mut();\n\n    // Request WRITE, which is not present in parent\n    let invalid_access = Access::new(0x1000, 0x1000, Rights::WRITE);\n    let result = carve_borrow.carve(\u0026invalid_access);\n    assert_eq!(result, Err(CapaError::InvalidAccess));\n}\n\n#[test]\nfn test_nested_alias_invalid_due_to_overlap() {\n    let mut root = create_root();\n\n    let carve_1 = root\n        .carve(\u0026Access::new(0x2000, 0x2000, Rights::READ))\n        .expect(\"carve_1 failed\");\n    let carve_2 = root\n        .carve(\u0026Access::new(0x4000, 0x2000, Rights::READ))\n        .expect(\"carve_2 failed\");\n\n    let mut carve_1_borrow = carve_1.borrow_mut();\n    let alias_1_access = Access::new(0x2000, 0x1000, Rights::READ);\n    let alias_1 = carve_1_borrow\n        .alias(\u0026alias_1_access)\n        .expect(\"alias_1 creation failed\");\n\n    {\n        let alias_1_borrow = alias_1.borrow();\n        assert_eq!(alias_1_borrow.data.access, alias_1_access);\n        assert_eq!(alias_1_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_1_borrow.data.status, Status::Aliased);\n    }\n\n    let mut carve_2_borrow = carve_2.borrow_mut();\n    let alias_2_access = Access::new(0x4000, 0x1000, Rights::READ);\n    let alias_2 = carve_2_borrow\n        .alias(\u0026alias_2_access)\n        .expect(\"alias_2 creation failed\");\n\n    {\n        let alias_2_borrow = alias_2.borrow();\n        assert_eq!(alias_2_borrow.data.access, alias_2_access);\n        assert_eq!(alias_2_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_2_borrow.data.status, Status::Aliased);\n    }\n}\n\n#[test]\nfn test_carve_then_alias_then_carve() {\n    let mut root = create_root();\n\n    // Step 1: Carve a region from the root\n    let carved = root\n        .carve(\u0026Access::new(0x2000, 0x2000, Rights::READ | Rights::WRITE))\n        .expect(\"Carving from root failed\");\n\n    // Step 2: Alias the carved region\n    let alias_access = Access::new(0x2000, 0x1000, Rights::READ);\n    let alias = carved\n        .borrow_mut()\n        .alias(\u0026alias_access)\n        .expect(\"Aliasing carved region failed\");\n\n    // Check alias kind and status\n    {\n        let alias_borrow = alias.borrow();\n        assert_eq!(alias_borrow.data.kind, RegionKind::Alias);\n        assert_eq!(alias_borrow.data.status, Status::Aliased);\n    }\n\n    // Step 3: Carve from the alias\n    let carve_from_alias_access = Access::new(0x2000, 0x0800, Rights::READ);\n    let carved_from_alias = alias\n        .borrow_mut()\n        .carve(\u0026carve_from_alias_access)\n        .expect(\"Carving from alias failed\");\n\n    // Check carve kind and status\n    {\n        let carved_borrow = carved_from_alias.borrow();\n        assert_eq!(carved_borrow.data.kind, RegionKind::Carve);\n        assert_eq!(carved_borrow.data.status, Status::Aliased); // inherits from parent\n    }\n}\n\n// ——————————————————————————————— Revocation ——————————————————————————————— //\n\n#[test]\nfn test_revoke_single_node() {\n    let mut root = create_root();\n\n    // Create a simple child node under the root\n    let child = root\n        .carve(\u0026Access::new(0x1000, 0x2000, Rights::READ | Rights::WRITE))\n        .unwrap();\n\n    // Track revoked nodes\n    let mut seen = Vec::new();\n\n    // Revoke the child node\n    let revoked = root.revoke_child(\u0026child, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n        seen.push(c.data.access.start);\n        Ok(())\n    });\n\n    // Check that the revocation was successful\n    assert!(revoked.is_ok());\n\n    // Check that the callback was called with the correct access start address\n    assert_eq!(seen, vec![0x1000]);\n\n    // Check that the child node is now removed\n    assert_eq!(root.children.len(), 0);\n}\n\n#[test]\nfn test_revoke_complex_subtree() {\n    let mut root = create_root();\n\n    // Branch 1\n    let b1 = root\n        .carve(\u0026Access::new(0x0000, 0x4000, Rights::READ | Rights::WRITE))\n        .unwrap();\n    let b1a = b1\n        .borrow_mut()\n        .alias(\u0026Access::new(0x1000, 0x1000, Rights::READ))\n        .unwrap();\n    let _b1a1 = b1a\n        .borrow_mut()\n        .carve(\u0026Access::new(0x1000, 0x0800, Rights::READ))\n        .unwrap();\n\n    // Branch 2 (will not be revoked)\n    let _b2 = root\n        .carve(\u0026Access::new(0x5000, 0x1000, Rights::READ))\n        .unwrap();\n\n    // Track revoked nodes\n    let mut seen = Vec::new();\n\n    //let data = b1a.borrow().data;\n    // Revoke b1a\n    let revoked = b1\n        .borrow_mut()\n        .revoke_child(\u0026b1a, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            seen.push((\n                c.data.kind.clone(),\n                c.data.status.clone(),\n                c.data.access.start,\n            ));\n            Ok(())\n        });\n\n    // Check the callback was called for b1a1 then b1a\n    assert!(revoked.is_ok());\n    assert_eq!(seen.len(), 2);\n    assert!(seen.contains(\u0026(RegionKind::Carve, Status::Aliased, 0x1000)));\n    assert!(seen.contains(\u0026(RegionKind::Alias, Status::Aliased, 0x1000)));\n\n    // b1 should still be there, but now empty\n    assert_eq!(b1.borrow().children.len(), 0);\n\n    // b2 should still exist\n    assert_eq!(root.children.len(), 2);\n    let b2_found = root\n        .children\n        .iter()\n        .any(|c| c.borrow().data.access.start == 0x5000);\n    assert!(b2_found);\n}\n\n#[test]\nfn test_revoke_deep_leaf_order() {\n    let mut root = create_root();\n\n    let c1 = root\n        .carve(\u0026Access::new(0x0000, 0x8000, Rights::READ | Rights::WRITE))\n        .unwrap();\n    let c2 = c1\n        .borrow_mut()\n        .carve(\u0026Access::new(0x1000, 0x4000, Rights::READ))\n        .unwrap();\n    let c3 = c2\n        .borrow_mut()\n        .alias(\u0026Access::new(0x2000, 0x1000, Rights::READ))\n        .unwrap();\n    let _c4 = c3\n        .borrow_mut()\n        .carve(\u0026Access::new(0x2000, 0x0800, Rights::READ))\n        .unwrap();\n\n    let mut seen = Vec::new();\n\n    let res = c2\n        .borrow_mut()\n        .revoke_child(\u0026c3, \u0026mut |c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            seen.push(c.data.access.start);\n            Ok(())\n        });\n    assert!(res.is_ok());\n\n    // Order of callback: c4 then c3\n    assert_eq!(seen, vec![0x2000, 0x2000]);\n    assert_eq!(c2.borrow().children.len(), 0);\n}\n\n#[test]\nfn test_revoke_nonexistent() {\n    let mut root = create_root();\n\n    // Create a valid region in the root.\n    let _valid_region = root\n        .carve(\u0026Access::new(0x0000, 0x1000, Rights::READ | Rights::WRITE))\n        .unwrap();\n\n    // Create a dummy region that doesn't exist in the children\n    let dummy_region = MemoryRegion {\n        kind: RegionKind::Carve,\n        status: Status::Exclusive,\n        access: Access::new(0xDEAD, 0x100, Rights::READ),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    };\n\n    // Try to revoke the dummy region, which doesn't exist as a child\n    let result = root.revoke_child(\n        \u0026Rc::new(RefCell::new(Capability::\u003cMemoryRegion\u003e::new(dummy_region))),\n        \u0026mut |_c: \u0026mut Capability\u003cMemoryRegion\u003e| {\n            panic!(\"Callback should not run on nonexistent revoke\");\n        },\n    );\n\n    // Assert that the result is an error, indicating that the child was not found\n    assert_eq!(result, Err(CapaError::ChildNotFound));\n\n    // Ensure the valid_region is still present\n    let valid_region_found = root\n        .children\n        .iter()\n        .any(|c| c.borrow().data.access.start == 0x0000);\n    assert!(valid_region_found);\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","aghosn","Documents","Programs","capability-v5","capability_engine","tests","parser.rs"],"content":"use capa_engine::client::no_platform::NoPlatform;\nuse capa_engine::core::capability::*;\nuse capa_engine::core::domain::*;\nuse capa_engine::core::memory_region::{\n    Access, Attributes, MemoryRegion, RegionKind, Remapped, Rights, Status as MStatus,\n};\nuse capa_engine::core::parser::Parser;\nuse capa_engine::server::engine::Engine;\nuse capa_engine::EngineInterface;\nuse std::cell::RefCell;\nuse std::rc::Rc;\n\nfn create_root_region() -\u003e Capability\u003cMemoryRegion\u003e {\n    Capability::\u003cMemoryRegion\u003e::new(MemoryRegion {\n        kind: RegionKind::Carve,\n        status: MStatus::Exclusive,\n        access: Access::new(0, 0x10000, Rights::READ | Rights::WRITE | Rights::EXECUTE),\n        attributes: Attributes::NONE,\n        remapped: Remapped::Identity,\n    })\n}\n\nfn setup_engine_with_root() -\u003e (\n    Engine\u003cNoPlatform\u003e,\n    CapaRef\u003cDomain\u003e,\n    CapaRef\u003cMemoryRegion\u003e,\n    LocalCapa, // ref_region returned by `add_root_region`\n) {\n    let engine = Engine::new(16);\n    let root_region = create_root_region();\n\n    let ref_mem = Rc::new(RefCell::new(root_region));\n    let ref_region = engine\n        .add_root_region(\u0026engine.root.clone(), \u0026ref_mem)\n        .unwrap();\n    let ref_td = engine.root.clone();\n    (engine, ref_td, ref_mem, ref_region)\n}\n\n#[test]\nfn test_parse_simple_td0() {\n    // Initial setup\n    let (_engine, td0, _r0, _td0_r0) = setup_engine_with_root();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n|indices: 1-\u003er0\n\"#;\n    assert_eq!(display, expected);\n\n    // Now parse the attestation.\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    // Now print td0 from the parser\n    let reconstructed_td0 = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", reconstructed_td0.borrow());\n    assert_eq!(display, expected);\n}\n\n#[test]\nfn test_parse_with_alias() {\n    // Initial setup\n    let (mut engine, td0, _r0, td0_r0) = setup_engine_with_root();\n\n    // Let's create some regions.\n    let alias_access = Access::new(0x0, 0x3000, Rights::all());\n\n    let _alias = engine.alias(td0.clone(), td0_r0, \u0026alias_access).unwrap();\n\n    let display = format!(\"{}\", td0.borrow());\n    let expected = r#\"td0 = Sealed domain(r0,r1)\n|cores: 0xffff\n|mon.api: 0x1fff\n|vec0-255: ALLOWED|VISIBLE, r: 0x0, w: 0x0\nr0 = Exclusive 0x0 0x10000 with RWX mapped Identity\n| Alias at 0x0 0x3000 with RWX for r1\nr1 = Aliased 0x0 0x3000 with RWX mapped Identity\n|indices: 1-\u003er0 2-\u003er1\n\"#;\n    assert_eq!(display, expected);\n    let mut parser = Parser::new();\n    parser.parse_attestation(display).unwrap();\n\n    let td0_recon = parser.domains.get(\"td0\").unwrap();\n    let display = format!(\"{}\", td0_recon.borrow());\n    assert_eq!(display, expected);\n\n    // Do some reconstruction checks.\n    let r1 = parser.regions.get(\"r1\").unwrap();\n    a     <script>const e = React.createElement;

function pathToString(path) {
  if (path[0] === '/') {
    return '/' + path.slice(1).join('/');
  } else {
    return path.join('/');
  }
}

function findCommonPath(files) {
  if (!files || !files.length) {
    return [];
  }

  function isPrefix(arr, prefix) {
    if (arr.length < prefix.length) {
      return false;
    }
    for (let i = prefix.length - 1; i >= 0; --i) {
      if (arr[i] !== prefix[i]) {
        return false;
      }
    }
    return true;
  }

  let commonPath = files[0].path.slice(0, -1);
  while (commonPath.length) {
    if (files.every(file => isPrefix(file.path, commonPath))) {
      break;
    }
    commonPath.pop();
  }
  return commonPath;
}

function findFolders(files) {
  if (!files || !files.length) {
    return [];
  }

  let folders = files.filter(file => file.path.length > 1).map(file => file.path[0]);
  folders = [...new Set(folders)]; // unique
  folders.sort();

  folders = folders.map(folder => {
    let filesInFolder = files
      .filter(file => file.path[0] === folder)
      .map(file => ({
        ...file,
        path: file.path.slice(1),
        parent: [...file.parent, file.path[0]],
      }));

    const children = findFolders(filesInFolder); // recursion

    return {
      is_folder: true,
      path: [folder],
      parent: files[0].parent,
      children,
      covered: children.reduce((sum, file) => sum + file.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.coverable, 0),
      prevRun: {
        covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
        coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
      }
    };
  });

  return [
    ...folders,
    ...files.filter(file => file.path.length === 1),
  ];
}

class App extends React.Component {
  constructor(...args) {
    super(...args);

    this.state = {
      current: [],
    };
  }

  componentDidMount() {
    this.updateStateFromLocation();
    window.addEventListener("hashchange", () => this.updateStateFromLocation(), false);
  }

  updateStateFromLocation() {
    if (window.location.hash.length > 1) {
      const current = window.location.hash.substr(1).split('/');
      this.setState({current});
    } else {
      this.setState({current: []});
    }
  }

  getCurrentPath() {
    let file = this.props.root;
    let path = [file];
    for (let p of this.state.current) {
      file = file.children.find(file => file.path[0] === p);
      if (!file) {
        return path;
      }
      path.push(file);
    }
    return path;
  }

  render() {
    const path = this.getCurrentPath();
    const file = path[path.length - 1];

    let w = null;
    if (file.is_folder) {
      w = e(FilesList, {
        folder: file,
        onSelectFile: this.selectFile.bind(this),
        onBack: path.length > 1 ? this.back.bind(this) : null,
      });
    } else {
      w = e(DisplayFile, {
        file,
        onBack: this.back.bind(this),
      });
    }

    return e('div', {className: 'app'}, w);
  }

  selectFile(file) {
    this.setState(({current}) => {
      return {current: [...current, file.path[0]]};
    }, () => this.updateHash());
  }

  back(file) {
    this.setState(({current}) => {
      return {current: current.slice(0, current.length - 1)};
    }, () => this.updateHash());
  }

  updateHash() {
    if (!this.state.current || !this.state.current.length) {
      window.location = '#';
    } else {
      window.location = '#' + this.state.current.join('/');
    }
  }
}

function FilesList({folder, onSelectFile, onBack}) {
  let files = folder.children;
  return e('div', {className: 'display-folder'},
    e(FileHeader, {file: folder, onBack}),
    e('table', {className: 'files-list'},
      e('thead', {className: 'files-list__head'},
        e('tr', null,
          e('th', null, "Path"),
          e('th', null, "Coverage")
        )
      ),
      e('tbody', {className: 'files-list__body'},
        files.map(file => e(File, {file, onClick: onSelectFile}))
      )
    )
  );
}

function File({file, onClick}) {
  const coverage = file.coverable ? file.covered / file.coverable * 100 : -1;
  const coverageDelta = file.prevRun &&
    (file.covered / file.coverable * 100 - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('tr', {
      className: 'files-list__file'
        + (coverage >= 0 && coverage < 50 ? ' files-list__file_low': '')
        + (coverage >= 50 && coverage < 80 ? ' files-list__file_medium': '')
        + (coverage >= 80 ? ' files-list__file_high': '')
        + (file.is_folder ? ' files-list__file_folder': ''),
      onClick: () => onClick(file),
    },
    e('td', null, e('a', null, pathToString(file.path))),
    e('td', null,
      file.covered + ' / ' + file.coverable +
      (coverage >= 0 ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function DisplayFile({file, onBack}) {
  return e('div', {className: 'display-file'},
    e(FileHeader, {file, onBack}),
    e(FileContent, {file})
  );
}

function FileHeader({file, onBack}) {
  const coverage = file.covered / file.coverable * 100;
  const coverageDelta = file.prevRun && (coverage - file.prevRun.covered / file.prevRun.coverable * 100);

  return e('div', {className: 'file-header'},
    onBack ? e('a', {className: 'file-header__back', onClick: onBack}, 'Back') : null,
    e('div', {className: 'file-header__name'}, pathToString([...file.parent, ...file.path])),
    e('div', {className: 'file-header__stat'},
      'Covered: ' + file.covered + ' of ' + file.coverable +
      (file.coverable ? ' (' + coverage.toFixed(2) + '%)' : ''),
      e('span', {title: 'Change from the previous run'},
        (coverageDelta ? ` (${coverageDelta > 0 ? '+' : ''}${coverageDelta.toFixed(2)}%)` : ''))
    )
  );
}

function FileContent({file}) {
  return e('pre', {className: 'file-content'},
    file.content.split(/\r?\n/).map((line, index) => {
      const trace = file.traces.find(trace => trace.line === index + 1);
      const covered = trace && trace.stats.Line;
      const uncovered = trace && !trace.stats.Line;
      return e('code', {
          className: 'code-line'
            + (covered ? ' code-line_covered' : '')
            + (uncovered ? ' code-line_uncovered' : ''),
          title: trace ? JSON.stringify(trace.stats, null, 2) : null,
        }, line);
    })
  );
}

(function(){
  const commonPath = findCommonPath(data.files);
  const prevFilesMap = new Map();

  previousData && previousData.files.forEach((file) => {
    const path = file.path.slice(commonPath.length).join('/');
    prevFilesMap.set(path, file);
  });

  const files = data.files.map((file) => {
    const path = file.path.slice(commonPath.length);
    const { covered = 0, coverable = 0 } = prevFilesMap.get(path.join('/')) || {};
    return {
      ...file,
      path,
      parent: commonPath,
      prevRun: { covered, coverable },
    };
  });

  const children = findFolders(files);

  const root = {
    is_folder: true,
    children,
    path: commonPath,
    parent: [],
    covered: children.reduce((sum, file) => sum + file.covered, 0),
    coverable: children.reduce((sum, file) => sum + file.coverable, 0),
    prevRun: {
      covered: children.reduce((sum, file) => sum + file.prevRun.covered, 0),
      coverable: children.reduce((sum, file) => sum + file.prevRun.coverable, 0),
    }
  };

  ReactDOM.render(e(App, {root, prevFilesMap}), document.getElementById('root'));
}());
</script>
